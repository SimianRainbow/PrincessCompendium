<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Teen Tower 🏰</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#1a0038 0%,#4a0072 45%,#002060 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-gem{position:fixed;pointer-events:none;opacity:.09;font-size:clamp(16px,4vw,26px);animation:bgFloat linear infinite;z-index:0;}
    @keyframes bgFloat{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}

    /* Header */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;font-weight:bold;}
    .tier-easy  {background:linear-gradient(135deg,#a5d6a7,#388e3c);color:#fff;}
    .tier-medium{background:linear-gradient(135deg,#ffe082,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);color:#fff;}
    #score-lbl{font-size:clamp(14px,3.5vw,19px);color:#ffd700;font-weight:bold;}
    #round-lbl{font-size:clamp(13px,3.2vw,17px);color:rgba(255,255,255,.85);}

    /* Progress */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(5px,1.2vw,9px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);border-radius:99px;transition:width .4s ease;width:0%;}

    /* Prompt */
    #prompt{
      font-size:clamp(17px,4.5vw,26px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.5);text-align:center;
      padding:clamp(6px,1.5vw,10px) 20px 0;
      flex-shrink:0;position:relative;z-index:1;line-height:1.2;
    }

    /* Ten-frame card */
    #tf-card{
      background:rgba(255,255,255,.1);border-radius:28px;
      padding:clamp(12px,3vw,20px) clamp(14px,3.5vw,24px);
      display:flex;flex-direction:column;align-items:center;gap:6px;
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 3px rgba(255,215,0,.3);
      margin:clamp(8px,2vw,14px) clamp(12px,3vw,20px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tf-card.pop-in{animation:cardPop .4s cubic-bezier(.34,1.56,.64,1);}
    @keyframes cardPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

    .tf-label{
      font-size:clamp(11px,2.8vw,15px);color:rgba(255,255,255,.7);
      letter-spacing:1px;text-transform:uppercase;
    }
    .tf-row{display:flex;gap:clamp(5px,1.3vw,8px);align-items:center;justify-content:center;}
    .tf-sep{
      width:calc(100% - 16px);height:2px;
      background:linear-gradient(90deg,transparent,rgba(255,215,0,.5),transparent);
      margin:2px 0;
    }
    .tf-cell{
      width:clamp(38px,9.5vw,52px);height:clamp(38px,9.5vw,52px);
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(18px,4.5vw,26px);
      border:2px solid rgba(255,255,255,.3);
      background:rgba(255,255,255,.07);
      transition:transform .2s;
    }
    .tf-cell.filled-base{
      background:radial-gradient(circle at 35% 30%,#ffd700,#ff8c00);
      border-color:rgba(255,215,0,.7);
      box-shadow:0 0 10px rgba(255,215,0,.4);
    }
    .tf-cell.filled-extra{
      background:radial-gradient(circle at 35% 30%,#f48fb1,#e91e63);
      border-color:rgba(244,143,177,.7);
      box-shadow:0 0 10px rgba(233,30,99,.4);
    }
    .tf-cell.empty{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.18);}

    .tf-legend{
      display:flex;gap:12px;align-items:center;justify-content:center;
      flex-wrap:wrap;
    }
    .legend-item{display:flex;align-items:center;gap:5px;font-size:clamp(10px,2.5vw,13px);color:rgba(255,255,255,.7);}
    .legend-dot{width:14px;height:14px;border-radius:50%;}
    .legend-gold{background:radial-gradient(circle,#ffd700,#ff8c00);}
    .legend-pink{background:radial-gradient(circle,#f48fb1,#e91e63);}

    /* Choices */
    #choices-wrap{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(8px,2vw,14px);padding:clamp(8px,2vw,14px) clamp(14px,3.5vw,22px);
      width:100%;position:relative;z-index:1;
    }
    #sub-prompt{font-size:clamp(15px,3.8vw,20px);color:#f8bbd0;text-align:center;}
    #choices{
      display:flex;gap:clamp(12px,3vw,18px);
      justify-content:center;align-items:center;
      width:100%;max-width:440px;
    }
    .choice-btn{
      flex:1;max-width:clamp(90px,24vw,120px);
      height:clamp(90px,24vw,120px);
      border-radius:clamp(18px,5vw,26px);border:3px solid rgba(255,255,255,.3);
      background:rgba(255,255,255,.12);
      cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2);
      touch-action:manipulation;transition:transform .12s,border-color .12s;
    }
    .choice-btn:active{transform:scale(.87);}
    .choice-num{font-size:clamp(34px,10vw,52px);color:#ffd700;line-height:1;}
    .choice-gems{font-size:clamp(10px,2.5vw,13px);color:rgba(255,255,255,.7);line-height:1.2;}
    .choice-btn.correct{border-color:#ffd700;background:rgba(255,215,0,.25);animation:correctPop .5s ease-out;}
    .choice-btn.wrong  {animation:wobble .45s ease-out;border-color:rgba(255,80,80,.7);}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 40px rgba(255,215,0,.8)}100%{transform:scale(1)}}
    @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}60%{transform:translateX(12px)}80%{transform:translateX(-6px)}}

    /* Sparkle */
    .sp{position:fixed;pointer-events:none;z-index:50;animation:spOut .75s ease-out forwards;}
    @keyframes spOut{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
    .sp-dot{position:fixed;pointer-events:none;z-index:50;border-radius:50%;animation:dotFly .8s ease-out forwards;}
    @keyframes dotFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0}}

    /* Overlays */
    .overlay{
      position:fixed;inset:0;z-index:99;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(10px,2.5vw,16px);text-align:center;padding:20px;
      opacity:0;pointer-events:none;transition:opacity .35s;
    }
    .overlay.show{opacity:1;pointer-events:all;}

    #cel-overlay{background:rgba(20,0,50,.9);}
    .ov-emoji{font-size:clamp(56px,15vw,88px);}
    .ov-title{font-size:clamp(22px,6vw,40px);color:#ffd700;}
    .ov-count{font-size:clamp(28px,8vw,52px);color:#fff;font-weight:bold;letter-spacing:2px;}
    .ov-eqn{font-size:clamp(16px,4.5vw,26px);color:#f8bbd0;}
    .ov-fact{font-size:clamp(12px,3.2vw,17px);color:#ce93d8;max-width:340px;line-height:1.4;}
    .btn-next{
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,52px);font-size:clamp(18px,5vw,26px);
      border-radius:50px;border:none;background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00;font-weight:bold;cursor:pointer;font-family:inherit;
      min-height:64px;min-width:180px;box-shadow:0 4px 18px rgba(255,180,0,.5);
      touch-action:manipulation;
    }

    #tier-overlay{background:rgba(0,0,0,.82);}
    .to-title{font-size:clamp(24px,6.5vw,44px);color:#ffd700;text-shadow:0 0 20px #ff9800;}
    .to-sub{font-size:clamp(15px,4vw,22px);color:#fff;max-width:320px;line-height:1.3;}

    #win-overlay{background:linear-gradient(160deg,#1a0038 0%,#003060 100%);}
    #win-icon{font-size:clamp(72px,18vw,110px);animation:crownBounce 1.1s ease-in-out infinite;}
    @keyframes crownBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    .win-title{font-size:clamp(26px,7vw,46px);color:#ffd700;}
    .win-sub{font-size:clamp(15px,4vw,22px);color:#e1bee7;max-width:340px;line-height:1.3;}
    .win-score{font-size:clamp(20px,5vw,32px);color:#80d8ff;font-weight:bold;}

    .cf{position:fixed;pointer-events:none;z-index:100;border-radius:3px;animation:cfFall linear forwards;}
    @keyframes cfFall{0%{top:-20px;opacity:1;transform:rotate(0)}100%{top:110vh;opacity:.2;transform:rotate(720deg)}}
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-lbl">⭐ 0</div>
  <div id="round-lbl">1 / 18</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>
<div id="prompt">How many gems does Princess have?</div>

<div id="tf-card">
  <div class="tf-label">Royal Gem Tower</div>
  <div id="tf-grid"></div>
  <div class="tf-legend">
    <div class="legend-item"><div class="legend-dot legend-gold"></div><span>ten gems</span></div>
    <div class="legend-item"><div class="legend-dot legend-pink"></div><span>extra gems</span></div>
  </div>
</div>

<div id="choices-wrap">
  <div id="sub-prompt">Tap the right number! 👑</div>
  <div id="choices"></div>
</div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji" id="cel-emoji">💎</div>
  <div class="ov-title" id="cel-title">Amazing! 🌟</div>
  <div class="ov-count" id="cel-count">11</div>
  <div class="ov-eqn"  id="cel-eqn">10 + 1 = 11! 🏰</div>
  <div class="ov-fact"  id="cel-fact">Fun fact!</div>
  <button class="btn-next" id="cel-btn">Next ➡️</button>
</div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="to-emoji">🌸</div>
  <div class="to-title" id="to-title">Easy Done! 🎉</div>
  <div class="to-sub"   id="to-sub">Now try bigger teen numbers!</div>
  <button class="btn-next" id="tier-btn">Keep going! ➡️</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div id="win-icon">👑</div>
  <div class="win-title">Teen Tower Champion! 🏰</div>
  <div class="win-sub">You know all the teen numbers! 10 + ones = teens! ✨</div>
  <div class="win-score" id="win-score">Score: 18 / 18 ⭐</div>
  <button class="btn-next" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
'use strict';

// ── Audio ──────────────────────────────────────────────────────────────────────
var audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,type,dur,vol,delay){
  delay=delay||0;vol=vol||0.15;
  try{
    var c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type||'sine';o.frequency.value=f;
    var t0=c.currentTime+delay;
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function playCorrect(){[523,659,784,1047].forEach(function(f,i){tone(f,'sine',.18,.18,i*.07);});}
function playWrong()  {tone(260,'sawtooth',.18,.12);setTimeout(function(){tone(210,'sawtooth',.14,.09);},160);}
function playTierUp() {[392,494,587,784,1047].forEach(function(f,i){tone(f,'triangle',.25,.18,i*.09);});}
function playWin()    {[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,'sine',.28,.2,i*.1);});}

// ── Data ──────────────────────────────────────────────────────────────────────
var POOL=[
  // Tier 0: Easy — 11, 12, 13
  {n:11,tier:0,fact:'11 = TEN + ONE! All teen numbers hide a TEN inside!'},
  {n:11,tier:0,fact:'E-LEV-en has 3 syllables — it is a magical sounding number!'},
  {n:12,tier:0,fact:'12 = TEN + TWO! A DOZEN means 12 — like 12 eggs in a box!'},
  {n:12,tier:0,fact:'Twelve! A clock goes from 1 to 12 — twelve is at the top!'},
  {n:13,tier:0,fact:'13 = TEN + THREE! Thirteen starts the -teen numbers!'},
  {n:13,tier:0,fact:'Thir-TEEN — can you hear the teen? All teen numbers end in -teen!'},
  // Extra for replay variety
  {n:11,tier:0,fact:'Eleven gems! Count the pink ones — just ONE extra above the TEN!'},
  {n:12,tier:0,fact:'Twelve gems! Count the pink ones — TWO extra above the TEN!'},
  // Tier 1: Medium — 14, 15, 16
  {n:14,tier:1,fact:'14 = TEN + FOUR! Four-TEEN — spot the FOUR in fourteen!'},
  {n:14,tier:1,fact:'Fourteen — count 4 pink gems above the 10 gold ones!'},
  {n:15,tier:1,fact:'15 = TEN + FIVE! Five-TEEN — spot the FIVE in fifteen!'},
  {n:15,tier:1,fact:'Fifteen = five threes! 3 + 3 + 3 + 3 + 3 = 15. Wow!'},
  {n:16,tier:1,fact:'16 = TEN + SIX! Six-TEEN — spot the SIX in sixteen!'},
  {n:16,tier:1,fact:'Sixteen! 8 + 8 = 16 — two groups of eight!'},
  // Extra for replay variety
  {n:14,tier:1,fact:'Fourteen gems! The gold TEN plus 4 pink extras makes fourteen!'},
  {n:15,tier:1,fact:'Fifteen gems! High five (5) + ten (10) = fifteen!'},
  // Tier 2: Hard — 17, 18, 19
  {n:17,tier:2,fact:'17 = TEN + SEVEN! Seven-TEEN — spot the SEVEN in seventeen!'},
  {n:17,tier:2,fact:'Seventeen! Count carefully — 10 gold and 7 pink!'},
  {n:18,tier:2,fact:'18 = TEN + EIGHT! Eight-TEEN — spot the EIGHT in eighteen!'},
  {n:18,tier:2,fact:'Eighteen! An octopus has 8 arms — 10 + 8 = eighteen!'},
  {n:19,tier:2,fact:'19 = TEN + NINE! Nine-TEEN — just ONE away from TWENTY!'},
  {n:19,tier:2,fact:'Nineteen! One more step and you reach the BIG TWENTY! 🎉'},
  // Extra for replay variety
  {n:17,tier:2,fact:'Seventeen gems! Almost at 18 — just one more would make eighteen!'},
  {n:18,tier:2,fact:'Eighteen gems! One step from nineteen — and two from twenty!'},
];

var TIERS=[
  {label:'🌱 Easy',  cls:'tier-easy',  name:'Easy',   count:6},
  {label:'🌸 Medium',cls:'tier-medium',name:'Medium',  count:6},
  {label:'⭐ Hard',  cls:'tier-hard',  name:'Hard',    count:6},
];
var TOTAL=18;

var PROMPTS=[
  'How many gems does Princess have? 💎',
  'Count the royal gems! 👑',
  'How many gems in the tower? 🏰',
  'Tap the right number! ⭐',
  'What is the total? Count them all! ✨',
];

// ── State ─────────────────────────────────────────────────────────────────────
var round=0,score=0,locked=false,gamePlan=[],promptIdx=0;

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function getTierIdx(r){return r<=6?0:r<=12?1:2;}

function buildPlan(){
  var plan=[];
  TIERS.forEach(function(tier,ti){
    var pool=POOL.filter(function(p){return p.tier===ti;});
    var picks=shuffle(pool).slice(0,tier.count);
    picks.forEach(function(item){plan.push(item);});
  });
  return plan;
}

// ── Background gems ───────────────────────────────────────────────────────────
(function initBg(){
  var icons=['💎','✨','⭐','👑','🌸','💜','🌟','💫','🏰','🪄','🌺','🎀','💖','🌈','🔮','🦋','🌙','👸'];
  for(var i=0;i<18;i++){
    var el=document.createElement('div');
    el.className='bg-gem';
    el.textContent=icons[i%icons.length];
    el.style.left=(3+Math.random()*94)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*18)+'s';
    document.body.appendChild(el);
  }
})();

// ── Game flow ──────────────────────────────────────────────────────────────────
function startGame(){
  ['cel-overlay','tier-overlay','win-overlay'].forEach(function(id){
    document.getElementById(id).classList.remove('show');
  });
  round=0;score=0;locked=false;
  promptIdx=Math.floor(Math.random()*PROMPTS.length);
  gamePlan=buildPlan();
  nextRound();
}

function nextRound(){
  document.getElementById('cel-overlay').classList.remove('show');
  document.getElementById('tier-overlay').classList.remove('show');
  if(round>=TOTAL){endGame();return;}
  round++;locked=false;
  updateHUD();
  if(round%3===0) promptIdx=(promptIdx+1)%PROMPTS.length;
  document.getElementById('prompt').textContent=PROMPTS[promptIdx];
  showQuestion();
}

function updateHUD(){
  var ti=getTierIdx(round);
  var tier=TIERS[ti];
  var badge=document.getElementById('tier-badge');
  badge.textContent=tier.label;badge.className=tier.cls;
  document.getElementById('score-lbl').textContent='⭐ '+score;
  document.getElementById('round-lbl').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';
}

function showQuestion(){
  var q=gamePlan[round-1];
  var card=document.getElementById('tf-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');
  renderTenFrame(q.n);
  renderChoices(q);
}

// ── Ten-frame rendering ────────────────────────────────────────────────────────
function renderTenFrame(n){
  var extra=n-10; // number of extra (pink) gems
  var grid=document.getElementById('tf-grid');
  grid.innerHTML='';

  // 4 rows of 5 columns (can hold up to 19 gems)
  // Rows 1-2: gold (base 10), Row 3-4: pink extras
  var rows=[];
  for(var r=0;r<4;r++){
    var row=document.createElement('div');
    row.className='tf-row';
    for(var c=0;c<5;c++){
      var idx=r*5+c; // cell index 0-19
      var cell=document.createElement('div');
      cell.className='tf-cell';
      if(idx<10){
        cell.classList.add('filled-base');
        cell.textContent='💛';
      } else if(idx<10+extra){
        cell.classList.add('filled-extra');
        cell.textContent='💗';
      } else {
        cell.classList.add('empty');
      }
      row.appendChild(cell);
    }
    rows.push(row);
    // Add separator between base-10 rows and extra rows
    if(r===1){
      var sep=document.createElement('div');
      sep.className='tf-sep';
      grid.appendChild(rows[0]);
      grid.appendChild(rows[1]);
      grid.appendChild(sep);
      rows=[];
    }
  }
  rows.forEach(function(row){grid.appendChild(row);});
}

// ── Choices rendering ──────────────────────────────────────────────────────────
function renderChoices(q){
  var container=document.getElementById('choices');
  container.innerHTML='';
  var correct=q.n;
  // Generate 3 distractors close to correct
  var all=[correct];
  var d1=correct>11?correct-1:correct+1;
  var d2=correct<19?correct+1:correct-1;
  if(d2===d1) d2=correct>12?correct-2:correct+2;
  all=[correct,d1,d2];
  // Shuffle
  var shuffled=shuffle(all);
  shuffled.forEach(function(num){
    var btn=document.createElement('button');
    btn.className='choice-btn';
    var numEl=document.createElement('div');numEl.className='choice-num';numEl.textContent=num;
    var gemEl=document.createElement('div');gemEl.className='choice-gems';
    gemEl.textContent='10+'+(num-10)+' gems';
    btn.appendChild(numEl);btn.appendChild(gemEl);
    var isCorrect=(num===correct);
    btn.addEventListener('pointerdown',function(){handleTap(btn,isCorrect,q);});
    container.appendChild(btn);
  });
}

// ── Tap handling ───────────────────────────────────────────────────────────────
function handleTap(btn,ok,q){
  if(locked)return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true;score++;
    btn.classList.add('correct');
    playCorrect();
    var r=btn.getBoundingClientRect();
    sparkleBurst(r.left+r.width/2,r.top+r.height/2);
    confetti(20);
    updateHUD();
    setTimeout(function(){showCelebrate(q);},600);
  } else {
    btn.classList.add('wrong');
    playWrong();
    setTimeout(function(){btn.classList.remove('wrong');},460);
  }
}

function showCelebrate(q){
  var extra=q.n-10;
  var tierIdx=getTierIdx(round);
  var nextTierIdx=getTierIdx(round+1);
  var isTierEnd=(round<TOTAL && nextTierIdx>tierIdx);

  var msgs=['Amazing! 🌟','Bravo! ✨','You got it! 👑','Superstar! ⭐','Wonderful! 🌸','Perfect! 💎'];
  document.getElementById('cel-emoji').textContent='💎';
  document.getElementById('cel-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('cel-count').textContent=q.n+'!';
  document.getElementById('cel-eqn').textContent='10 + '+extra+' = '+q.n+' gems! 🏰';
  document.getElementById('cel-fact').textContent=q.fact;

  if(isTierEnd){
    document.getElementById('cel-btn').onclick=showTierOverlay_fn;
  } else {
    document.getElementById('cel-btn').onclick=nextRound;
  }
  document.getElementById('cel-overlay').classList.add('show');
}

function showTierOverlay_fn(){
  document.getElementById('cel-overlay').classList.remove('show');
  var nextTier=getTierIdx(round+1);
  var msgs=[
    {emoji:'🌸',title:'Easy Done! 🎉',sub:'Now try bigger teen numbers — 14, 15, 16!'},
    {emoji:'⭐',title:'Medium Done! 🎉',sub:'The biggest teen numbers! 17, 18, 19!'},
  ];
  var tm=msgs[nextTier-1];
  document.getElementById('to-emoji').textContent=tm.emoji;
  document.getElementById('to-title').textContent=tm.title;
  document.getElementById('to-sub').textContent=tm.sub;
  document.getElementById('tier-btn').onclick=nextRound;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();confetti(42);
}

function endGame(){
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('win-score').textContent='Score: '+score+' / '+TOTAL+' ⭐';
  document.getElementById('win-overlay').classList.add('show');
  playWin();confetti(60);setTimeout(function(){confetti(42);},700);
}

// ── Particles ──────────────────────────────────────────────────────────────────
function sparkleBurst(cx,cy){
  var ems=['✨','💫','⭐','💎','👑','🌟','💛','💗','🏰','🌸'];
  var cols=['#ffd700','#f48fb1','#fff','#ce93d8','#e040fb','#80d8ff'];
  for(var i=0;i<20;i++){
    var el=document.createElement('div');el.className='sp';
    el.textContent=ems[i%ems.length];
    var a=Math.random()*Math.PI*2,dist=30+Math.random()*90;
    el.style.cssText='font-size:'+(15+Math.random()*13)+'px;left:'+(cx+Math.cos(a)*dist)+'px;top:'+(cy+Math.sin(a)*dist)+'px;animation-delay:'+(Math.random()*.12)+'s;';
    document.body.appendChild(el);
    (function(e){setTimeout(function(){e.remove();},850);})(el);
  }
  for(var j=0;j<18;j++){
    var dot=document.createElement('div');dot.className='sp-dot';
    var ang=Math.random()*Math.PI*2,dst=25+Math.random()*75,sz=5+Math.random()*9;
    dot.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;background:'+cols[j%cols.length]+';--tx:'+(Math.cos(ang)*dst)+'px;--ty:'+(Math.sin(ang)*dst)+'px;';
    document.body.appendChild(dot);
    (function(e){setTimeout(function(){e.remove();},900);})(dot);
  }
}

function confetti(count){
  var cols=['#ffd700','#f48fb1','#fff','#ce93d8','#80d8ff','#e040fb','#a5d6a7','#ff8a65'];
  for(var i=0;i<count;i++){
    var el=document.createElement('div');el.className='cf';
    var sz=6+Math.random()*10,dur=1.4+Math.random()*2;
    el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*.5+'s;';
    document.body.appendChild(el);
    (function(e,d){setTimeout(function(){e.remove();},(d+.6)*1000+200);})(el,dur);
  }
}

startGame();
</script>
