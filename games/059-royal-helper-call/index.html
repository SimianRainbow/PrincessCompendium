<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Royal Helper Call 🚒</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(155deg, #1a237e 0%, #880e4f 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      font-family: 'Fredoka One', cursive;
      overflow: hidden; user-select: none;
      padding-bottom: 12px;
    }

    #header {
      width: 100%; max-width: 440px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px 0;
      flex-shrink: 0;
    }
    #tier-badge {
      font-size: clamp(13px,3.5vw,18px); color:#fff;
      padding: 5px 14px; border-radius: 20px;
      transition: background 0.4s;
    }
    #tier-badge.easy   { background: rgba(56,142,60,0.8); }
    #tier-badge.medium { background: rgba(230,81,0,0.8); }
    #tier-badge.hard   { background: rgba(81,45,168,0.8); }
    #score-lbl { font-size: clamp(13px,3.2vw,17px); color: rgba(255,255,255,0.92); }
    #round-lbl { font-size: clamp(13px,3.2vw,17px); color: rgba(255,255,255,0.85); }

    #progress-wrap { width:100%; max-width:440px; padding:7px 18px 0; flex-shrink:0; }
    #progress-bg { background:rgba(255,255,255,0.2); border-radius:8px; height:8px; overflow:hidden; }
    #progress-fill { height:100%; border-radius:8px; background:linear-gradient(90deg,#ffd700,#ffb300); width:0%; transition:width 0.4s ease; }

    #scene-card {
      width: 100%; max-width: 440px;
      padding: 10px 16px 0;
      flex-shrink: 0;
    }
    #scene-inner {
      border-radius: 26px;
      overflow: hidden;
      height: clamp(160px, 42vw, 220px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
      position: relative;
      box-shadow: 0 6px 28px rgba(0,0,0,0.4);
      transition: background 0.5s;
    }
    #bg-floaters {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .floater {
      position: absolute;
      font-size: clamp(16px, 4vw, 24px);
      opacity: 0.18;
      animation: float-drift linear infinite;
    }
    @keyframes float-drift {
      0%   { transform: translateY(110%) rotate(0deg); opacity: 0.12; }
      50%  { opacity: 0.22; }
      100% { transform: translateY(-120%) rotate(360deg); opacity: 0; }
    }

    #princess-wrap {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      z-index: 2;
    }
    #princess-emoji { font-size: clamp(42px,11vw,64px); animation: sway 2.4s ease-in-out infinite; }
    @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
    #situation-emoji {
      font-size: clamp(36px,9vw,54px);
      animation: pulse-sit 1.4s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes pulse-sit { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

    #scene-text {
      font-size: clamp(14px, 3.6vw, 20px);
      color: #fff; text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
      padding: 0 16px; z-index: 2;
      line-height: 1.3;
    }

    #prompt {
      font-size: clamp(17px,4.5vw,23px); color:#fff;
      text-align: center; padding: 10px 16px 0;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    #helper-grid {
      width: 100%; max-width: 440px;
      padding: 10px 16px 0;
      display: grid; gap: clamp(8px,2vw,12px);
      flex-shrink: 0;
    }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr 1fr; }
    .g4 { grid-template-columns: 1fr 1fr; }

    .helper-btn {
      min-height: clamp(90px,23vw,115px);
      border-radius: 20px; border: 3px solid rgba(255,255,255,0.35);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .helper-btn:active { transform: scale(0.9); }
    .helper-btn .h-icon { font-size: clamp(28px,7.5vw,42px); pointer-events:none; }
    .helper-btn .h-label {
      font-size: clamp(12px,3.2vw,16px); color:#fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
      pointer-events:none; text-align:center;
    }
    .helper-btn.wobble { animation: wobble 0.42s ease-out; }
    @keyframes wobble {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      60%{transform:translateX(10px)}
      80%{transform:translateX(-5px)}
    }
    .helper-btn.locked { opacity: 0.4; pointer-events: none; }

    .sparkle {
      position: fixed; pointer-events:none; z-index:50;
      font-size: clamp(12px,3.5vw,20px);
      animation: sFly ease-out forwards;
    }
    @keyframes sFly {
      0%  { transform:translate(0,0) scale(1.2); opacity:1; }
      100%{ transform:translate(var(--tx),var(--ty)) scale(0.1); opacity:0; }
    }

    #celebrate-overlay {
      position: fixed; inset:0; background:rgba(0,0,0,0.55);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
      z-index:99; opacity:0; pointer-events:none; transition:opacity 0.35s;
    }
    #celebrate-overlay.show { opacity:1; pointer-events:all; }
    #cel-emoji { font-size:clamp(56px,15vw,96px); }
    #cel-text { font-size:clamp(22px,6vw,40px); color:#fff; text-shadow:0 0 20px #ffd700; text-align:center; padding:0 16px; line-height:1.3; }
    #cel-helper { font-size:clamp(16px,4vw,22px); color:#ffe082; text-align:center; padding:0 16px; }
    #next-btn {
      padding: clamp(14px,4vw,20px) clamp(32px,8vw,52px);
      font-size:clamp(18px,5vw,26px); border-radius:50px; border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00; font-weight:bold; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 16px rgba(255,180,0,0.5);
    }

    #win-overlay {
      position:fixed; inset:0;
      background:linear-gradient(160deg,#0d47a1 0%,#880e4f 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      z-index:110; opacity:0; pointer-events:none; transition:opacity 0.4s;
    }
    #win-overlay.show { opacity:1; pointer-events:all; }
    #win-icon { font-size:clamp(64px,18vw,110px); }
    #win-title { font-size:clamp(28px,7.5vw,48px); color:#ffd700; text-shadow:0 0 24px #ff9800; }
    #win-score { font-size:clamp(20px,5.5vw,34px); color:#fff; }
    #win-play-again {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,52px);
      font-size:clamp(18px,5vw,26px); border-radius:50px; border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00; font-weight:bold; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 16px rgba(255,180,0,0.5);
    }

    #tier-overlay {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:95; pointer-events:none; opacity:0; transition:opacity 0.3s;
    }
    #tier-overlay.show { opacity:1; }
    #tier-inner {
      background:rgba(0,0,0,0.8); border-radius:24px; padding:22px 44px;
      font-size:clamp(22px,6.5vw,38px); color:#fff; text-align:center;
      text-shadow:0 0 20px gold; box-shadow:0 0 0 4px rgba(255,215,0,0.4);
    }

    .confetti-piece {
      position:fixed; border-radius:50%;
      animation:cFall linear forwards; pointer-events:none; z-index:100;
    }
    @keyframes cFall { 0%{top:-20px;opacity:1} 100%{top:110vh;opacity:.2} }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="easy">🌸 Easy</div>
  <div id="score-lbl">0 ⭐</div>
  <div id="round-lbl">1 / 9</div>
</div>

<div id="progress-wrap">
  <div id="progress-bg"><div id="progress-fill"></div></div>
</div>

<div id="scene-card">
  <div id="scene-inner">
    <div id="bg-floaters"></div>
    <div id="princess-wrap">
      <div id="princess-emoji">👸</div>
      <div id="situation-emoji">🤒</div>
    </div>
    <div id="scene-text">Princess doesn't feel well!</div>
  </div>
</div>

<div id="prompt">Who should Princess call? 📞</div>

<div id="helper-grid" class="g2"></div>

<div id="celebrate-overlay">
  <div id="cel-emoji">🌟</div>
  <div id="cel-text">Amazing!</div>
  <div id="cel-helper">The Doctor helps when you're sick!</div>
  <button id="next-btn" onclick="nextRound()">Next ➡️</button>
</div>

<div id="win-overlay">
  <div id="win-icon">🏆</div>
  <div id="win-title">You're a Royal Helper! 🌟</div>
  <div id="win-score">You got 0 ⭐</div>
  <button id="win-play-again" onclick="restartGame()">Play Again 🔄</button>
</div>

<div id="tier-overlay">
  <div id="tier-inner">✨ Medium! ✨</div>
</div>

<script>
  /* ── audio ─────────────────────────── */
  let audioCtx = null;
  function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function tone(f,t,d,v) {
    try {
      const ctx=getAudio(), o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type=t||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(v||0.15,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);
      o.start(); o.stop(ctx.currentTime+d);
    } catch(e) {}
  }
  function playCorrect()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.18,0.16),i*85)); }
  function playWrong()     { tone(220,'sawtooth',0.18,0.08); }
  function playCelebrate() { [523,659,784,880,1047,1175,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.22,0.17),i*65)); }
  function playTierUp()    { [660,880,1047,1320].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',0.25,0.18),i*100)); }
  function playWin()       { [523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.3,0.18),i*70)); }

  /* ── helpers ─────────────────────── */
  const HELPERS = {
    doctor:      { label:'Doctor',      emoji:'👨‍⚕️', bg:'rgba(56,142,60,0.45)',   border:'rgba(100,200,100,0.6)', fact:'The Doctor helps when you feel sick!' },
    firefighter: { label:'Firefighter', emoji:'👩‍🚒', bg:'rgba(211,47,47,0.45)',  border:'rgba(255,100,60,0.6)',  fact:'Firefighters are brave helpers who stop fires!' },
    teacher:     { label:'Teacher',     emoji:'👩‍🏫', bg:'rgba(21,101,192,0.45)', border:'rgba(80,160,255,0.6)',  fact:'Teachers help us learn and grow!' },
    police:      { label:'Police',      emoji:'👮',   bg:'rgba(48,63,159,0.45)',   border:'rgba(100,120,255,0.6)', fact:'Police Officers keep everyone safe!' },
    chef:        { label:'Chef',        emoji:'👨‍🍳', bg:'rgba(230,119,0,0.45)',  border:'rgba(255,160,40,0.6)',  fact:'Chefs cook delicious food for us!' },
    vet:         { label:'Vet',         emoji:'🐾',   bg:'rgba(91,64,32,0.55)',    border:'rgba(160,110,60,0.6)',  fact:'Vets are doctors for animals!' },
  };

  /* ── scenario pools ─────────────── */
  const POOL = {
    easy: [
      { situationEmoji:'🤒', sceneText:'Princess has a tummy ache!',          answer:'doctor',      skyBg:'linear-gradient(160deg,#e8f5e9,#c8e6c9)', extraBg:'🌡️💊🌡️' },
      { situationEmoji:'🔥', sceneText:'Fire in the royal kitchen!',           answer:'firefighter', skyBg:'linear-gradient(160deg,#fbe9e7,#ffccbc)', extraBg:'🔥🚒🔥' },
      { situationEmoji:'📚', sceneText:'Princess wants to learn her letters!', answer:'teacher',     skyBg:'linear-gradient(160deg,#e3f2fd,#bbdefb)', extraBg:'✏️📖✏️' },
      { situationEmoji:'🐕', sceneText:'Princess\'s puppy feels poorly!',      answer:'vet',         skyBg:'linear-gradient(160deg,#fff8e1,#ffecb3)', extraBg:'🐾❤️🐾' },
      { situationEmoji:'🎂', sceneText:'The royal feast needs cooking!',       answer:'chef',        skyBg:'linear-gradient(160deg,#fff3e0,#ffe0b2)', extraBg:'🍰🍴🍰' },
      { situationEmoji:'😨', sceneText:'Princess is lost and scared!',         answer:'police',      skyBg:'linear-gradient(160deg,#e8eaf6,#c5cae9)', extraBg:'🗺️🚔🗺️' },
    ],
    medium: [
      { situationEmoji:'🤧', sceneText:'Princess has a sneezy cold!',         answer:'doctor',      skyBg:'linear-gradient(160deg,#e8f5e9,#c8e6c9)', extraBg:'🌡️🤒🌡️' },
      { situationEmoji:'💨', sceneText:'Smoke from the castle tower!',         answer:'firefighter', skyBg:'linear-gradient(160deg,#fbe9e7,#ffccbc)', extraBg:'🔥⚠️🔥' },
      { situationEmoji:'✏️', sceneText:'Princess needs help with lessons!',   answer:'teacher',     skyBg:'linear-gradient(160deg,#e3f2fd,#bbdefb)', extraBg:'📐📏📐' },
      { situationEmoji:'🐈', sceneText:'Princess\'s kitten has a sore paw!',  answer:'vet',         skyBg:'linear-gradient(160deg,#fff8e1,#ffecb3)', extraBg:'🐾🩺🐾' },
      { situationEmoji:'🍰', sceneText:'It\'s the royal birthday — who bakes?',answer:'chef',        skyBg:'linear-gradient(160deg,#fff3e0,#ffe0b2)', extraBg:'🎂🎉🎂' },
      { situationEmoji:'🗺️', sceneText:'Princess can\'t find her way home!',  answer:'police',      skyBg:'linear-gradient(160deg,#e8eaf6,#c5cae9)', extraBg:'🏠🚔🏠' },
    ],
    hard: [
      { situationEmoji:'🦷', sceneText:'Ouch! Princess has a toothache!',        answer:'doctor',      skyBg:'linear-gradient(160deg,#e8f5e9,#c8e6c9)', extraBg:'💊🩺💊' },
      { situationEmoji:'🌊', sceneText:'A pipe burst — water everywhere!',        answer:'firefighter', skyBg:'linear-gradient(160deg,#fbe9e7,#ffccbc)', extraBg:'💧🚒💧' },
      { situationEmoji:'📝', sceneText:'Princess wants to write a storybook!',   answer:'teacher',     skyBg:'linear-gradient(160deg,#e3f2fd,#bbdefb)', extraBg:'📖✍️📖' },
      { situationEmoji:'🐇', sceneText:'The royal bunny won\'t hop or eat!',     answer:'vet',         skyBg:'linear-gradient(160deg,#fff8e1,#ffecb3)', extraBg:'🐰❤️🐰' },
      { situationEmoji:'🥗', sceneText:'The princess banquet has no food!',      answer:'chef',        skyBg:'linear-gradient(160deg,#fff3e0,#ffe0b2)', extraBg:'🍽️🍴🍽️' },
      { situationEmoji:'🏰', sceneText:'Someone took Princess\'s royal crown!',  answer:'police',      skyBg:'linear-gradient(160deg,#e8eaf6,#c5cae9)', extraBg:'👑🚔👑' },
    ],
  };

  const TIERS = [
    { key:'easy',   label:'🌸 Easy',   cls:'easy',   choices:2 },
    { key:'medium', label:'🌟 Medium', cls:'medium', choices:3 },
    { key:'hard',   label:'👑 Hard',   cls:'hard',   choices:4 },
  ];

  const TOTAL_ROUNDS = 9;
  let round = 0, score = 0, locked = false;
  let roundsSeq = [];

  /* ── sequence builder ─────────────── */
  function shuffle(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function buildSequence() {
    roundsSeq = [];
    TIERS.forEach(tier => {
      const pool = shuffle(POOL[tier.key]);
      roundsSeq.push(...pool.slice(0, 3));
    });
  }

  function getTierIndex(r) { return r <= 3 ? 0 : r <= 6 ? 1 : 2; }

  /* ── bg floaters ─────────────────── */
  function setupFloaters(extraBg) {
    const wrap = document.getElementById('bg-floaters');
    wrap.innerHTML = '';
    const icons = extraBg.split('');
    const filtered = [...new Set(icons.filter(c => c.trim()))];
    const count = 8;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'floater';
      el.textContent = filtered[i % filtered.length];
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.bottom = '-20px';
      el.style.animationDuration = (4 + Math.random() * 5) + 's';
      el.style.animationDelay = (Math.random() * 5) + 's';
      wrap.appendChild(el);
    }
  }

  /* ── scene render ─────────────────── */
  function renderScene(scenario) {
    document.getElementById('scene-inner').style.background = scenario.skyBg;
    document.getElementById('situation-emoji').textContent = scenario.situationEmoji;
    document.getElementById('scene-text').textContent = scenario.sceneText;
    setupFloaters(scenario.extraBg);
  }

  /* ── button render ─────────────────── */
  function renderButtons(scenario, tierIdx) {
    const tier = TIERS[tierIdx];
    const answer = scenario.answer;
    const allOthers = Object.keys(HELPERS).filter(h => h !== answer);
    const wrongs = shuffle(allOthers).slice(0, tier.choices - 1);
    const choices = shuffle([answer, ...wrongs]);

    const grid = document.getElementById('helper-grid');
    grid.className = 'g' + tier.choices;
    grid.innerHTML = '';

    choices.forEach(key => {
      const h = HELPERS[key];
      const btn = document.createElement('div');
      btn.className = 'helper-btn';
      btn.style.background = h.bg;
      btn.style.borderColor = h.border;
      btn.dataset.key = key;
      btn.innerHTML = `<span class="h-icon">${h.emoji}</span><span class="h-label">${h.label}</span>`;
      btn.addEventListener('pointerdown', () => handleAnswer(key, btn, scenario));
      grid.appendChild(btn);
    });
  }

  /* ── answer handling ─────────────── */
  function handleAnswer(chosen, btnEl, scenario) {
    if (locked) return;
    if (chosen === scenario.answer) {
      locked = true;
      score++;
      document.getElementById('score-lbl').textContent = score + ' ⭐';
      playCorrect();
      const rect = btnEl.getBoundingClientRect();
      sparkleBurst(rect.left + rect.width/2, rect.top + rect.height/2);
      document.querySelectorAll('.helper-btn').forEach(b => { if (b !== btnEl) b.classList.add('locked'); });
      setTimeout(() => showCelebration(scenario), 560);
    } else {
      btnEl.classList.add('wobble');
      playWrong();
      setTimeout(() => btnEl.classList.remove('wobble'), 500);
    }
  }

  /* ── celebration ─────────────────── */
  function showCelebration(scenario) {
    if (round >= TOTAL_ROUNDS) {
      showWinScreen();
      return;
    }
    const h = HELPERS[scenario.answer];
    const celebs = [
      { text:`Yes! Call the ${h.label}! 🌟`,   emoji: h.emoji },
      { text:`That's right! The ${h.label}! ✨`, emoji:'👑' },
      { text:`You got it! 🌸`,                  emoji:'💎' },
      { text:`Brilliant! ${h.emoji}`,            emoji:'⭐' },
    ];
    const c = celebs[Math.floor(Math.random() * celebs.length)];
    document.getElementById('cel-emoji').textContent   = c.emoji;
    document.getElementById('cel-text').textContent    = c.text;
    document.getElementById('cel-helper').textContent  = h.fact;
    document.getElementById('next-btn').textContent    = 'Next ➡️';
    document.getElementById('next-btn').onclick        = nextRound;
    document.getElementById('celebrate-overlay').classList.add('show');
    playCelebrate(); confettiBurst();
  }

  function showWinScreen() {
    document.getElementById('celebrate-overlay').classList.remove('show');
    document.getElementById('win-score').textContent = `You got ${score} ⭐`;
    document.getElementById('win-overlay').classList.add('show');
    document.getElementById('progress-fill').style.width = '100%';
    playWin();
    confettiBurst();
    setTimeout(confettiBurst, 500);
  }

  /* ── round flow ──────────────────── */
  function nextRound() {
    document.getElementById('celebrate-overlay').classList.remove('show');
    const oldTier = getTierIndex(round);
    round++;
    const newTier = getTierIndex(round);

    const tier = TIERS[newTier];
    const badge = document.getElementById('tier-badge');
    badge.textContent = tier.label;
    badge.className = tier.cls;
    document.getElementById('round-lbl').textContent = `${round} / ${TOTAL_ROUNDS}`;
    document.getElementById('progress-fill').style.width = ((round - 1) / TOTAL_ROUNDS * 100) + '%';

    if (newTier > oldTier) {
      showTierOverlay(tier.label, startRound);
    } else {
      startRound();
    }
  }

  function startRound() {
    locked = false;
    const scenario = roundsSeq[round - 1];
    renderScene(scenario);
    renderButtons(scenario, getTierIndex(round));
  }

  function showTierOverlay(label, callback) {
    const overlay = document.getElementById('tier-overlay');
    document.getElementById('tier-inner').textContent = `✨ ${label}! ✨`;
    overlay.classList.add('show');
    playTierUp();
    confettiBurst();
    setTimeout(() => {
      overlay.classList.remove('show');
      setTimeout(callback, 320);
    }, 1800);
  }

  function restartGame() {
    round = 0; score = 0;
    document.getElementById('score-lbl').textContent = '0 ⭐';
    document.getElementById('win-overlay').classList.remove('show');
    buildSequence();
    nextRound();
  }

  /* ── effects ──────────────────────── */
  function sparkleBurst(cx, cy) {
    const icons = ['✨','🌸','⭐','💫','💖','🌟','🎀','💎'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      const angle = (i / 18) * Math.PI * 2;
      const dist  = 55 + Math.random() * 85;
      el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--ty', Math.sin(angle) * dist - 20 + 'px');
      el.style.left = (cx - 10) + 'px';
      el.style.top  = (cy - 10) + 'px';
      el.style.animationDuration = (0.45 + Math.random() * 0.45) + 's';
      el.style.animationDelay    = (Math.random() * 0.08) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  }

  function confettiBurst() {
    const cols = ['#ffd700','#ff69b4','#ff99cc','#c0a0ff','#7fff00','#00cfff','#fff','#ffb347'];
    for (let i = 0; i < 42; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const sz = 8 + Math.random() * 8;
      el.style.width  = sz + 'px'; el.style.height = sz + 'px';
      el.style.left   = Math.random() * 100 + 'vw';
      el.style.background = cols[Math.floor(Math.random() * cols.length)];
      el.style.animationDuration = (1.2 + Math.random() * 1.6) + 's';
      el.style.animationDelay    = (Math.random() * 0.4) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2900);
    }
  }

  /* ── init ─────────────────────────── */
  buildSequence();
  nextRound();
</script>
</body>
</html>
