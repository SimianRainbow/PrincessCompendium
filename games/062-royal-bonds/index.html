<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Royal Gem Bonds 💎</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#f3e5f5 0%,#e8eaf6 50%,#fce4ec 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-gem{
      position:fixed;pointer-events:none;opacity:.09;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite;z-index:0;
    }
    @keyframes bgFloat{
      0%{transform:translateY(110vh) rotate(0)}
      100%{transform:translateY(-15vh) rotate(360deg)}
    }

    /* ── Header ── */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{
      font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;
      color:#fff;font-weight:bold;border:2px solid rgba(255,255,255,.38);
      transition:background .4s;
    }
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000 !important;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(100,30,180,.8);position:relative;z-index:1;}
    #score-row  {font-size:clamp(18px,4.5vw,26px);letter-spacing:1px;position:relative;z-index:1;}

    /* ── Progress bar ── */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(150,50,200,.15);border-radius:99px;
      margin:clamp(7px,1.8vw,11px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#ab47bc);
      border-radius:99px;transition:width .4s ease;width:0%;
    }

    /* ── Chest ── */
    #chest-area{
      position:relative;z-index:1;
      display:flex;flex-direction:column;align-items:center;
      margin:clamp(8px,2vw,14px) 0 0;
    }
    #chest-emoji{
      font-size:clamp(52px,14vw,84px);line-height:1;
      animation:chestBob 2.8s ease-in-out infinite;
    }
    @keyframes chestBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    #target-label{
      font-size:clamp(14px,3.5vw,20px);color:#4a148c;
      text-align:center;margin-top:4px;
    }

    /* ── Gem grid ── */
    #gem-grid{
      display:flex;flex-wrap:wrap;gap:clamp(5px,1.3vw,9px);
      justify-content:center;
      padding:clamp(8px,2vw,14px);
      position:relative;z-index:1;
    }
    .gem-slot{
      width:clamp(36px,9.5vw,56px);height:clamp(36px,9.5vw,56px);
      border-radius:50%;
      transition:all .25s ease;
    }
    .gem-filled{
      background:linear-gradient(135deg,#f48fb1,#c2185b);
      box-shadow:0 3px 12px rgba(194,24,91,.4),inset 0 2px 0 rgba(255,255,255,.4);
      border:2px solid rgba(255,255,255,.5);
    }
    .gem-filled::after{
      content:'💎';
      display:flex;align-items:center;justify-content:center;
      height:100%;font-size:clamp(16px,4vw,24px);
    }
    .gem-empty{
      background:rgba(180,130,220,.12);
      border:3px dashed rgba(150,100,200,.35);
    }
    .gem-filling{
      background:linear-gradient(135deg,#ffd700,#ff9800) !important;
      border-color:rgba(255,215,0,.6) !important;
      box-shadow:0 3px 18px rgba(255,215,0,.6) !important;
      animation:gemFill .5s ease-out;
    }
    @keyframes gemFill{
      0%{transform:scale(0.6);opacity:.5}
      60%{transform:scale(1.2)}
      100%{transform:scale(1);opacity:1}
    }
    #gem-row-break{width:100%;height:0;}

    /* ── Prompt ── */
    #prompt{
      font-size:clamp(17px,4.5vw,26px);color:#4a148c;
      text-align:center;padding:0 16px;
      margin:clamp(6px,1.5vw,10px) 0;
      position:relative;z-index:1;line-height:1.3;
    }

    /* ── Choice buttons ── */
    #choices{
      display:flex;gap:clamp(10px,2.5vw,18px);
      padding:0 clamp(12px,3vw,22px);
      width:100%;justify-content:center;
      position:relative;z-index:1;
      flex-wrap:wrap;
    }
    .choice-btn{
      min-width:clamp(90px,22vw,130px);min-height:clamp(90px,22vw,120px);
      border-radius:24px;border:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;
      box-shadow:0 5px 20px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);
      transition:transform .1s;touch-action:manipulation;
      flex:1;max-width:clamp(100px,27vw,150px);
    }
    .choice-btn:active{transform:scale(.9);}
    .choice-btn .num{
      font-size:clamp(34px,9vw,56px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1;
    }
    .choice-btn .gem-icon{font-size:clamp(14px,3.5vw,20px);}
    .choice-btn.correct-flash{animation:correctPop .5s ease-out;}
    @keyframes correctPop{
      0%{transform:scale(1)}
      40%{transform:scale(1.16);box-shadow:0 0 40px rgba(255,215,0,.9);}
      100%{transform:scale(1)}
    }
    .choice-btn.wrong-shake{animation:wrongShake .42s ease-out;}
    @keyframes wrongShake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-12px)}
      60%{transform:translateX(12px)}
    }

    /* ── Sparkles ── */
    .sparkle{
      position:fixed;pointer-events:none;z-index:90;
      font-size:clamp(14px,3.5vw,22px);
      animation:sparkleOut ease-out forwards;
    }
    @keyframes sparkleOut{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1}
      50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
      100%{transform:translate(-50%,-50%) scale(.1);opacity:0}
    }
    .confetti-p{
      position:fixed;pointer-events:none;z-index:90;border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall{0%{top:-20px;opacity:1}100%{top:110vh;opacity:.1}}

    /* ── Celebrate overlay ── */
    #celebrate{
      position:fixed;inset:0;z-index:80;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(8px,2vw,14px);
      background:rgba(250,240,255,.93);
    }
    #celebrate.show{display:flex;}
    #cel-big{font-size:clamp(60px,16vw,96px);animation:bigPop .4s ease-out;}
    @keyframes bigPop{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
    #cel-eq{
      font-size:clamp(24px,6.5vw,44px);color:#4a148c;
      text-align:center;
      text-shadow:0 0 14px rgba(150,50,200,.25);
    }
    #cel-msg{font-size:clamp(16px,4.2vw,26px);color:#880e4f;text-align:center;padding:0 16px;}
    #next-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px);
      font-size:clamp(20px,5.5vw,30px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;touch-action:manipulation;
      box-shadow:0 6px 22px rgba(255,180,0,.45);
    }

    /* ── Tier overlay ── */
    #tier-overlay{
      position:fixed;inset:0;z-index:85;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;
      background:rgba(0,0,0,.67);
    }
    #tier-overlay.show{display:flex;}
    #to-icon {font-size:clamp(60px,16vw,96px);}
    #to-title{font-size:clamp(26px,7vw,46px);color:#ffd700;text-shadow:0 0 20px #ff9800;text-align:center;padding:0 16px;}
    #to-sub  {font-size:clamp(16px,4.5vw,24px);color:#fff;text-align:center;padding:0 24px;}
    #to-btn  {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(20px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00;font-family:inherit;cursor:pointer;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;
    }

    /* ── Win overlay ── */
    #win-overlay{
      position:fixed;inset:0;z-index:90;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(12px,3vw,20px);
      background:linear-gradient(160deg,#4a148c 0%,#880e4f 100%);
    }
    #win-overlay.show{display:flex;}
    #win-emoji{font-size:clamp(72px,18vw,110px);animation:startBob 2.4s ease-in-out infinite;}
    @keyframes startBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    #win-title{font-size:clamp(28px,7.5vw,52px);color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.7);text-align:center;padding:0 20px;}
    #win-sub  {font-size:clamp(16px,4.5vw,24px);color:rgba(255,255,255,.85);text-align:center;}
    #play-again-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,64px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;
      box-shadow:0 6px 24px rgba(255,180,0,.5);touch-action:manipulation;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="round-label">1 / 9</div>
  <div id="score-row"></div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="chest-area">
  <div id="chest-emoji">💎</div>
  <div id="target-label">Make 5 gems! ✨</div>
</div>

<div id="gem-grid"></div>
<div id="prompt">How many more gems does Princess need?</div>
<div id="choices"></div>

<div id="celebrate">
  <div id="cel-big">🎉</div>
  <div id="cel-eq">2 + 3 = 5 💎</div>
  <div id="cel-msg">Amazing! 🌟</div>
  <button id="next-btn" onclick="doNext()">Next ➡️</button>
</div>

<div id="tier-overlay">
  <div id="to-icon">💎</div>
  <div id="to-title">Making 10 now!</div>
  <div id="to-sub">The chest needs 10 gems — you can do it!</div>
  <button id="to-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
</div>

<div id="win-overlay">
  <div id="win-emoji">👑</div>
  <div id="win-title">Royal Bond Master! 💎</div>
  <div id="win-sub">You filled all the chests! 🌟</div>
  <button id="play-again-btn" onclick="restartGame()">Play Again 🔄</button>
</div>

<script>
  // Easy: make 5; Medium/Hard: make 10
  var EASY_POOL = [
    {has:0, total:5},
    {has:1, total:5},
    {has:2, total:5},
    {has:3, total:5},
    {has:4, total:5},
  ];
  var MED_POOL = [
    {has:1,  total:10},
    {has:2,  total:10},
    {has:4,  total:10},
    {has:6,  total:10},
    {has:8,  total:10},
    {has:9,  total:10},
  ];
  var HARD_POOL = [
    {has:3,  total:10},
    {has:4,  total:10},
    {has:5,  total:10},
    {has:6,  total:10},
    {has:7,  total:10},
  ];

  var BTN_COLORS = [
    'linear-gradient(135deg,#f48fb1,#c2185b)',
    'linear-gradient(135deg,#ce93d8,#7b1fa2)',
    'linear-gradient(135deg,#80cbc4,#00695c)',
  ];

  var TIER_INFO = [
    {label:'🌱 Easy',   cls:'tier-easy',   target:5,  icon:'💎', title:'Moving to Medium!',  sub:'Now fill a chest with 10 gems! 💎'},
    {label:'⭐ Medium', cls:'tier-medium', target:10, icon:'✨', title:'Almost There!',       sub:'Trickier bonds to 10 — think hard! 👑'},
    {label:'👑 Hard',   cls:'tier-hard',   target:10, icon:'👑', title:'Royal Bond Master!', sub:'All done! Amazing counting! 🎉'},
  ];

  var rounds=[], cur=0, score=0, locked=false;

  // ── Audio ─────────────────────────────────────────────────────────────
  var audioCtx=null;
  function au(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
  function tone(f,type,d,v){
    v=v||0.15;
    try{
      var c=au(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
      o.start();o.stop(c.currentTime+d);
    }catch(e){}
  }
  function playCorrect()  {[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.2,.18);},i*75);});}
  function playWrong()    {tone(200,'sawtooth',.22,.12);}
  function playTierUp()   {[392,494,587,784,988].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.28,.17);},i*90);});}
  function playCelebrate(){[523,587,659,784,880,1047,1319].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.25,.16);},i*60);});}

  // ── Shuffle ──────────────────────────────────────────────────────────
  function shuffle(a){
    var b=a.slice();
    for(var i=b.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=b[i];b[i]=b[j];b[j]=t;}
    return b;
  }

  // ── Distractors ──────────────────────────────────────────────────────
  function getDistractors(need, total){
    var pool=[];
    for(var d=-3;d<=3;d++){
      var c=need+d;
      if(d!==0 && c>=0 && c<=total) pool.push(c);
    }
    pool=shuffle(pool);
    return pool.slice(0,2);
  }

  // ── Gem grid ─────────────────────────────────────────────────────────
  function buildGemGrid(has, total){
    var grid=document.getElementById('gem-grid');
    grid.innerHTML='';
    for(var i=0;i<total;i++){
      if(total===10 && i===5){
        var br=document.createElement('div');
        br.id='gem-row-break'; br.style.width='100%'; br.style.height='0';
        grid.appendChild(br);
      }
      var slot=document.createElement('div');
      slot.className= i<has ? 'gem-slot gem-filled' : 'gem-slot gem-empty';
      slot.id='gem-'+i;
      grid.appendChild(slot);
    }
  }

  function fillEmptyGems(has, total){
    for(var i=has;i<total;i++){
      (function(idx){
        setTimeout(function(){
          var el=document.getElementById('gem-'+idx);
          if(el){el.className='gem-slot gem-filling';}
        }, (idx-has)*60);
      })(i);
    }
  }

  // ── HUD ───────────────────────────────────────────────────────────────
  function updateHUD(){
    document.getElementById('score-row').textContent='⭐'.repeat(score);
    document.getElementById('progress-fill').style.width=((cur/9)*100)+'%';
    document.getElementById('round-label').textContent=(cur+1)+' / 9';
  }

  // ── Pick rounds ───────────────────────────────────────────────────────
  function pickRounds(){
    var e=shuffle(EASY_POOL).slice(0,3);
    var m=shuffle(MED_POOL).slice(0,3);
    var h=shuffle(HARD_POOL).slice(0,3);
    return e.concat(m).concat(h);
  }

  // ── Show round ────────────────────────────────────────────────────────
  function showRound(idx){
    locked=false;
    cur=idx;
    updateHUD();

    var r=rounds[idx];
    var need=r.total-r.has;
    var tIdx=Math.floor(idx/3);
    var ti=TIER_INFO[tIdx];

    var badge=document.getElementById('tier-badge');
    badge.textContent=ti.label; badge.className='tier-badge '+ti.cls;

    document.getElementById('target-label').textContent='Make '+r.total+' gems! 💎';
    document.getElementById('chest-emoji').textContent= r.total===5 ? '📦' : '🏆';

    buildGemGrid(r.has, r.total);

    var txt;
    if(r.has===0){
      txt='The chest is empty! Princess needs '+r.total+' gems total.\nHow many gems does she need?';
    } else {
      txt='Princess has '+r.has+' gem'+(r.has>1?'s':'')+'.\nShe needs '+r.total+' total.\nHow many MORE does she need?';
    }
    document.getElementById('prompt').textContent=txt;

    var distractors=getDistractors(need, r.total);
    var opts=shuffle([need].concat(distractors));

    var choicesDiv=document.getElementById('choices');
    choicesDiv.innerHTML='';
    opts.forEach(function(n, colorIdx){
      var btn=document.createElement('button');
      btn.className='choice-btn';
      btn.style.background=BTN_COLORS[colorIdx%BTN_COLORS.length];
      btn.innerHTML='<span class="num">'+n+'</span><span class="gem-icon">💎</span>';
      (function(chosen){
        btn.addEventListener('pointerdown', function(){ handleTap(btn, chosen, need, r); });
      })(n);
      choicesDiv.appendChild(btn);
    });
  }

  // ── Handle tap ────────────────────────────────────────────────────────
  function handleTap(btn, chosen, need, r){
    if(locked) return;
    if(chosen===need){
      locked=true;
      btn.classList.add('correct-flash');
      playCorrect();
      score++;
      var rect=btn.getBoundingClientRect();
      sparkleBurst(rect.left+rect.width/2, rect.top+rect.height/2);
      fillEmptyGems(r.has, r.total);
      setTimeout(function(){ showCelebrate(r.has, need, r.total); }, 500);
    } else {
      btn.classList.add('wrong-shake');
      playWrong();
      setTimeout(function(){ btn.classList.remove('wrong-shake'); },420);
    }
  }

  // ── Sparkles ──────────────────────────────────────────────────────────
  function sparkleBurst(x,y){
    var ems=['✨','💎','⭐','💜','🌸','👑','💫'];
    for(var i=0;i<20;i++){
      var el=document.createElement('span');
      el.className='sparkle';
      el.textContent=ems[i%ems.length];
      var angle=(i/20)*Math.PI*2;
      var dist=55+Math.random()*95;
      el.style.left=(x+Math.cos(angle)*dist)+'px';
      el.style.top=(y+Math.sin(angle)*dist)+'px';
      el.style.animationDelay=(Math.random()*.15)+'s';
      el.style.animationDuration=(.75+Math.random()*.4)+'s';
      document.body.appendChild(el);
      setTimeout((function(e){return function(){e.remove();};})(el),1200);
    }
  }

  function confettiBurst(n){
    var cols=['#ffd700','#ff69b4','#b39ddb','#80cbc4','#ff6347','#da70d6','#fff','#f48fb1'];
    for(var i=0;i<n;i++){
      var el=document.createElement('div'); el.className='confetti-p';
      var sz=8+Math.random()*8;
      el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz+'px;'
        +'background:'+cols[i%cols.length]+';'
        +'animation-duration:'+(1.2+Math.random()*1.6)+'s;animation-delay:'+Math.random()*.4+'s;';
      document.body.appendChild(el);
      setTimeout((function(e){return function(){e.remove();};})(el),2900);
    }
  }

  // ── Celebrate overlay ─────────────────────────────────────────────────
  var MSGS=['Amazing! 🌟','Brilliant! 💫','You did it! 👑','Wonderful! 🌈','Superstar! 💖','Perfect! ✨'];
  function showCelebrate(has, need, total){
    document.getElementById('cel-big').textContent= total===5 ? '📦' : '🏆';
    document.getElementById('cel-eq').textContent=has+' + '+need+' = '+total+' 💎';
    document.getElementById('cel-msg').textContent=MSGS[Math.floor(Math.random()*MSGS.length)];
    document.getElementById('celebrate').classList.add('show');
    playCelebrate();
    confettiBurst(30);
  }

  function doNext(){
    document.getElementById('celebrate').classList.remove('show');
    advanceRound();
  }

  // ── Advance round ─────────────────────────────────────────────────────
  function advanceRound(){
    var was=cur;
    var next=was+1;
    if(next>=rounds.length){ showWin(); return; }
    var prevTier=Math.floor(was/3);
    var newTier =Math.floor(next/3);
    if(newTier!==prevTier){
      playTierUp(); confettiBurst(42);
      var ti=TIER_INFO[prevTier];
      document.getElementById('to-icon').textContent=ti.icon;
      document.getElementById('to-title').textContent=ti.title;
      document.getElementById('to-sub').textContent=ti.sub;
      document.getElementById('tier-overlay').classList.add('show');
    } else {
      showRound(next);
    }
    cur=next;
  }

  function resumeFromTier(){
    document.getElementById('tier-overlay').classList.remove('show');
    showRound(cur);
  }

  // ── Win ───────────────────────────────────────────────────────────────
  function showWin(){
    document.getElementById('progress-fill').style.width='100%';
    document.getElementById('win-sub').textContent=score+' / 9 ⭐ You filled all the chests!';
    document.getElementById('win-overlay').classList.add('show');
    playCelebrate();
    confettiBurst(60);
    setTimeout(function(){ confettiBurst(40); },600);
  }

  // ── Background gems ───────────────────────────────────────────────────
  function makeBg(){
    var items=['💎','✨','👑','🌸','💜','⭐','💫','🏆','🌟','🔮'];
    for(var i=0;i<10;i++){
      var el=document.createElement('div'); el.className='bg-gem';
      el.textContent=items[i%items.length];
      el.style.left=(5+Math.random()*90)+'vw';
      el.style.animationDuration=(9+Math.random()*14)+'s';
      el.style.animationDelay=-(Math.random()*16)+'s';
      document.body.appendChild(el);
    }
  }

  // ── Restart ───────────────────────────────────────────────────────────
  function restartGame(){
    document.getElementById('win-overlay').classList.remove('show');
    score=0; cur=0;
    rounds=pickRounds();
    updateHUD();
    showRound(0);
  }

  // ── Init ──────────────────────────────────────────────────────────────
  makeBg();
  rounds=pickRounds();
  updateHUD();
  showRound(0);
</script>
</body>
</html>
