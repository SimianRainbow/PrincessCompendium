<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Butterfly 🦋</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background:linear-gradient(160deg,#1a237e 0%,#4a148c 40%,#006064 80%,#1b5e20 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-float {
      position:fixed; pointer-events:none; opacity:.09;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite; z-index:0;
    }
    @keyframes bgFloat {
      0%  { transform:translateY(110vh) rotate(0); }
      100%{ transform:translateY(-15vh) rotate(360deg); }
    }

    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #tier-badge {
      font-size:clamp(13px,3.2vw,17px); padding:5px 14px; border-radius:20px;
      font-weight:bold; border:2px solid rgba(255,255,255,.3); transition:background .4s;
    }
    .tier-easy   { background:linear-gradient(135deg,#a5d6a7,#2e7d32); color:#fff; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#f9a825); color:#3e2000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#6a1b9a); color:#fff; }
    #score-label { font-size:clamp(13px,3.2vw,17px); color:#ffd700; font-weight:bold; position:relative; z-index:1; }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.85); position:relative; z-index:1; }

    #progress-track {
      width:calc(100% - clamp(28px,7vw,44px)); height:8px;
      background:rgba(255,255,255,.15); border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0; overflow:hidden;
      position:relative; z-index:1;
    }
    #progress-fill {
      height:100%; background:linear-gradient(90deg,#a5d6a7,#ffd700);
      border-radius:99px; transition:width .4s ease; width:0%;
      box-shadow:0 0 8px rgba(165,214,167,.5);
    }

    /* Stage display */
    #stage-card {
      background:rgba(255,255,255,.92); border-radius:28px;
      padding:clamp(8px,2vw,14px) clamp(20px,5vw,36px);
      display:flex; align-items:center; gap:clamp(8px,2vw,16px);
      box-shadow:0 6px 28px rgba(0,0,0,.28), 0 0 0 3px rgba(165,214,167,.4);
      margin:clamp(10px,2.5vw,16px) clamp(12px,3vw,20px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #stage-card.pop-in { animation:cardPop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cardPop { from{transform:scale(.65);opacity:0} to{transform:scale(1);opacity:1} }
    #from-emoji { font-size:clamp(56px,14vw,84px); line-height:1; }
    #arrow-wrap {
      display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    #arrow-txt { font-size:clamp(28px,7vw,42px); }
    #question-mark { font-size:clamp(24px,6vw,36px); color:#6a1b9a; font-weight:bold; }
    #from-name {
      font-size:clamp(13px,3.2vw,18px); color:#1a237e; text-align:center;
      margin-top:4px;
    }
    #from-wrap { display:flex; flex-direction:column; align-items:center; }

    #prompt {
      font-size:clamp(17px,4.5vw,26px); color:#ffd700;
      text-shadow:0 2px 8px rgba(0,0,0,.5);
      text-align:center; padding:clamp(6px,1.5vw,10px) 16px 0;
      flex-shrink:0; position:relative; z-index:1; line-height:1.2;
    }

    #choices {
      display:grid; gap:clamp(10px,2.5vw,14px);
      padding:clamp(8px,2vw,12px) clamp(12px,3vw,20px) clamp(10px,2.5vw,16px);
      width:100%; max-width:480px; flex-shrink:0; position:relative; z-index:1;
    }
    #choices.cols-2 { grid-template-columns:1fr 1fr; }
    #choices.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    #choices.cols-4 { grid-template-columns:1fr 1fr; }

    .choice-btn {
      min-height:clamp(88px,21vw,118px);
      border-radius:22px; border:none; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:5px; padding:10px 6px;
      box-shadow:0 4px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3);
      transition:transform .1s; touch-action:manipulation;
    }
    .choice-btn:active { transform:scale(.91); }
    .choice-icon  { font-size:clamp(34px,9vw,52px); line-height:1; pointer-events:none; }
    .choice-label { font-size:clamp(11px,2.8vw,16px); font-weight:bold; pointer-events:none; text-align:center; line-height:1.1; }

    .c-green  { background:linear-gradient(145deg,#c8e6c9,#4caf50); color:#1b5e20; }
    .c-blue   { background:linear-gradient(145deg,#b3e5fc,#039be5); color:#01579b; }
    .c-pink   { background:linear-gradient(145deg,#f8bbd0,#e91e63); color:#880e4f; }
    .c-yellow { background:linear-gradient(145deg,#fff9c4,#f9a825); color:#4a2000; }
    .c-purple { background:linear-gradient(145deg,#e1bee7,#8e24aa); color:#fff; }
    .c-teal   { background:linear-gradient(145deg,#b2ebf2,#00acc1); color:#006064; }

    .choice-btn.correct-flash { animation:correctPop .5s ease-out; }
    .choice-btn.wrong-shake   { animation:wrongShake .42s ease-out; }
    @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8)} 100%{transform:scale(1)} }
    @keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 60%{transform:translateX(12px)} 80%{transform:translateX(-6px)} }

    /* Sparkles */
    .sp    { position:fixed; pointer-events:none; z-index:50; animation:spOut .75s ease-out forwards; }
    @keyframes spOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.5);opacity:0} }
    .sp-dot { position:fixed; pointer-events:none; z-index:50; border-radius:50%; animation:dotFly .8s ease-out forwards; }
    @keyframes dotFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0} }

    /* Overlays */
    .overlay {
      position:fixed; inset:0; z-index:99;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:clamp(10px,2.5vw,16px);
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .overlay.show { opacity:1; pointer-events:all; }

    /* Tier overlay */
    #tier-overlay { background:rgba(0,0,0,.72); }
    #to-icon  { font-size:clamp(60px,16vw,96px); }
    #to-title { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-shadow:0 0 20px #ff9800; text-align:center; }
    #to-sub   { font-size:clamp(15px,4vw,22px); color:#fff; text-align:center; padding:0 24px; }
    .ov-btn {
      margin-top:6px; padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,4.8vw,26px); border-radius:50px; border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00; font-weight:bold; cursor:pointer;
      font-family:inherit; box-shadow:0 4px 16px rgba(255,180,0,.5);
      touch-action:manipulation;
    }

    /* Celebrate overlay */
    #cel-overlay { background:rgba(0,0,0,.7); }
    #cel-emoji   { font-size:clamp(72px,18vw,110px); line-height:1; animation:celBounce .5s ease-out; }
    @keyframes celBounce { 0%{transform:scale(.3)} 65%{transform:scale(1.18)} 100%{transform:scale(1)} }
    #cel-label   { font-size:clamp(22px,5.5vw,38px); color:#ffd700; text-align:center; padding:0 20px; text-shadow:0 0 18px rgba(255,215,0,.55); }
    #cel-fact    { font-size:clamp(14px,3.5vw,20px); color:#a5d6a7; text-align:center; padding:0 24px; line-height:1.35; }

    /* Win overlay */
    #win-overlay { background:linear-gradient(160deg,#1a237e 0%,#4a148c 50%,#1b5e20 100%); }
    #win-crown   { font-size:clamp(72px,18vw,110px); animation:crowBounce 1.1s ease-in-out infinite; }
    @keyframes crowBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    #win-title { font-size:clamp(26px,7vw,46px); color:#ffd700; text-shadow:0 0 24px #ff9800; text-align:center; }
    #win-sub   { font-size:clamp(15px,4vw,22px); color:#f8bbd0; text-align:center; padding:0 24px; }
    #win-score { font-size:clamp(20px,5.5vw,32px); color:#ffd700; font-weight:bold; text-align:center; }

    /* Confetti */
    .confetti {
      position:fixed; pointer-events:none; z-index:101; border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall {
      0%  { top:-20px; opacity:1; transform:rotate(0deg); }
      100%{ top:110vh; opacity:.2; transform:rotate(var(--cr,360deg)); }
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="tier-badge" class="tier-easy">🌱 Easy</div>
    <div id="score-label">⭐ 0</div>
    <div id="round-label">1 / 9</div>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>

  <div id="stage-card">
    <div id="from-wrap">
      <div id="from-emoji">🥚</div>
      <div id="from-name">Butterfly Egg</div>
    </div>
    <div id="arrow-wrap">
      <div id="arrow-txt">➡️</div>
      <div id="question-mark">?</div>
    </div>
  </div>

  <div id="prompt">What comes next? 🦋</div>
  <div id="choices" class="cols-2"></div>

  <!-- Tier overlay -->
  <div class="overlay" id="tier-overlay">
    <div id="to-icon">🦋</div>
    <div id="to-title">Level Up!</div>
    <div id="to-sub">More magic changes ahead!</div>
    <button class="ov-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
  </div>

  <!-- Celebrate overlay -->
  <div class="overlay" id="cel-overlay">
    <div id="cel-emoji">🦋</div>
    <div id="cel-label">Butterfly! 🦋</div>
    <div id="cel-fact">Amazing transformation!</div>
    <button class="ov-btn" onclick="nextRound()">Next ➡️</button>
  </div>

  <!-- Win overlay -->
  <div class="overlay" id="win-overlay">
    <div id="win-crown">🦋</div>
    <div id="win-title">Nature Expert! 🌱</div>
    <div id="win-sub">You know how living things grow! ✨</div>
    <div id="win-score">⭐ 0 / 9</div>
    <button class="ov-btn" onclick="startGame()">Play Again 🌸</button>
  </div>

<script>
'use strict';

// ── Audio ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(f, type, dur, vol, delay) {
  delay = delay || 0; vol = vol || 0.15;
  try {
    var c = getAudio(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type || 'sine'; o.frequency.value = f;
    var t0 = c.currentTime + delay;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  } catch(e) {}
}
function playCorrect()   { [523,659,784,1047].forEach(function(f,i){ tone(f,'sine',0.18,0.18,i*0.07); }); }
function playWrong()     { tone(260,'sawtooth',0.18,0.12); setTimeout(function(){ tone(210,'sawtooth',0.14,0.09); },160); }
function playCelebrate() { [523,587,659,698,784,880,1047].forEach(function(f,i){ tone(f,'sine',0.22,0.17,i*0.065); }); }
function playTierUp()    { [392,494,587,784,1047].forEach(function(f,i){ tone(f,'triangle',0.25,0.18,i*0.09); }); }
function playWin()       { [523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,'sine',0.28,0.2,i*0.1); }); }

// ── Life-cycle data ────────────────────────────────────────────────────────────
// Each entry: { from, fromName, to, toName, fact, wrong: [{e, n}, …] }

var EASY = [
  { from:'🥚', fromName:'Butterfly Egg',  to:'🐛', toName:'Caterpillar', fact:'A tiny caterpillar hatches from the egg! 🐛',         wrong:[{e:'🦋',n:'Butterfly'}] },
  { from:'🐛', fromName:'Caterpillar',     to:'🫘', toName:'Chrysalis',   fact:'The caterpillar wraps itself in a cosy case! 🫘',     wrong:[{e:'🥚',n:'Egg'}] },
  { from:'🌰', fromName:'Seed',            to:'🌱', toName:'Sprout',      fact:'A tiny green shoot pushes up from the seed! 🌱',      wrong:[{e:'🌸',n:'Flower'}] },
  { from:'🌱', fromName:'Sprout',          to:'🌸', toName:'Flower',      fact:'The sprout grows tall and blooms into a flower! 🌸',  wrong:[{e:'🌰',n:'Seed'}] },
  { from:'🥚', fromName:'Frog Egg',        to:'🐟', toName:'Tadpole',     fact:'A little tadpole swims out of the frog egg! 🐟',      wrong:[{e:'🐸',n:'Frog'}] },
  { from:'🐣', fromName:'Hatching Egg',    to:'🐥', toName:'Baby Chick',  fact:'Crack! A fluffy yellow chick pops out! 🐥',           wrong:[{e:'🥚',n:'Egg'}] },
];

var MEDIUM = [
  { from:'🫘', fromName:'Chrysalis',       to:'🦋', toName:'Butterfly',   fact:'After resting, a beautiful butterfly emerges! 🦋',    wrong:[{e:'🥚',n:'Egg'},{e:'🐛',n:'Caterpillar'}] },
  { from:'🐟', fromName:'Tadpole',         to:'🐸', toName:'Frog',        fact:'The tadpole grows legs and becomes a frog! 🐸',       wrong:[{e:'🥚',n:'Egg'},{e:'🦋',n:'Butterfly'}] },
  { from:'🥚', fromName:'Chick Egg',       to:'🐣', toName:'Hatching',    fact:'The shell cracks open as the chick pushes out! 🐣',   wrong:[{e:'🐔',n:'Hen'},{e:'🐥',n:'Baby Chick'}] },
  { from:'🐥', fromName:'Baby Chick',      to:'🐔', toName:'Hen',         fact:'The fluffy chick grows up to be a hen! 🐔',           wrong:[{e:'🥚',n:'Egg'},{e:'🐣',n:'Hatching'}] },
  { from:'🌸', fromName:'Flower',          to:'🌰', toName:'Seed',        fact:'When petals fall, seeds form so new plants can grow! 🌱',wrong:[{e:'🌱',n:'Sprout'},{e:'🍃',n:'Leaf'}] },
  { from:'🥚', fromName:'Butterfly Egg',   to:'🐛', toName:'Caterpillar', fact:'A hungry caterpillar hatches and starts eating! 🐛',  wrong:[{e:'🦋',n:'Butterfly'},{e:'🫘',n:'Chrysalis'}] },
];

var HARD = [
  { from:'🐛', fromName:'Caterpillar',     to:'🫘', toName:'Chrysalis',   fact:'Inside the chrysalis, the caterpillar transforms! 🦋', wrong:[{e:'🥚',n:'Egg'},{e:'🦋',n:'Butterfly'},{e:'🐸',n:'Frog'}] },
  { from:'🥚', fromName:'Frog Egg',        to:'🐟', toName:'Tadpole',     fact:'Tadpoles breathe underwater using gills! 🐟',          wrong:[{e:'🐸',n:'Frog'},{e:'🦋',n:'Butterfly'},{e:'🐔',n:'Hen'}] },
  { from:'🌰', fromName:'Seed',            to:'🌱', toName:'Sprout',      fact:'Seeds need water, soil and sunlight to sprout! 🌞',    wrong:[{e:'🌸',n:'Flower'},{e:'🍃',n:'Leaf'},{e:'🌿',n:'Plant'}] },
  { from:'🫘', fromName:'Chrysalis',       to:'🦋', toName:'Butterfly',   fact:'Butterflies taste things with their feet! 👣',         wrong:[{e:'🐛',n:'Caterpillar'},{e:'🥚',n:'Egg'},{e:'🌸',n:'Flower'}] },
  { from:'🐣', fromName:'Hatching Egg',    to:'🐥', toName:'Baby Chick',  fact:'A chick uses a special egg tooth to break its shell! 🥚',wrong:[{e:'🐔',n:'Hen'},{e:'🥚',n:'Egg'},{e:'🐸',n:'Frog'}] },
  { from:'🌱', fromName:'Sprout',          to:'🌸', toName:'Flower',      fact:'Bees visit flowers to collect sweet nectar! 🐝',       wrong:[{e:'🌰',n:'Seed'},{e:'🍂',n:'Leaf'},{e:'🌵',n:'Cactus'}] },
];

var TIER_INFO = [
  { label:'🌱 Easy',   cls:'tier-easy',   numChoices:2, icon:'🌿', title:'Moving to Medium!', sub:'3 choices now — what grows next? 🦋' },
  { label:'🌸 Medium', cls:'tier-medium', numChoices:3, icon:'💫', title:'Almost there!',     sub:'4 choices — think carefully! 🌱' },
  { label:'⭐ Hard',   cls:'tier-hard',   numChoices:4 },
];
var TOTAL = 9;

var PROMPTS = [
  'What comes next? 🦋',
  'What grows next? 🌱',
  'What happens after? ✨',
  'Tap what comes next! 🌟',
  'Help it grow — what\'s next? 🌸',
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var SLOT_COLS = ['c-green','c-blue','c-pink','c-yellow','c-purple','c-teal'];

// ── State ─────────────────────────────────────────────────────────────────────
var round = 0, locked = false, roundPlan = [], score = 0;

function buildPlan() {
  var e = shuffle(EASY).slice(0,3);
  var m = shuffle(MEDIUM).slice(0,3);
  var h = shuffle(HARD).slice(0,3);
  return e.concat(m).concat(h);
}

function getTierIdx(r) { return r <= 3 ? 0 : r <= 6 ? 1 : 2; }

// ── Background ────────────────────────────────────────────────────────────────
(function initBg() {
  var icons = ['🦋','🌸','🐛','🌱','🥚','🐸','🌰','✨','🌿','💫','🐣','🐥'];
  for (var i = 0; i < 12; i++) {
    var el = document.createElement('div');
    el.className = 'bg-float';
    el.textContent = icons[i % icons.length];
    el.style.left = (3 + Math.random() * 94) + 'vw';
    el.style.animationDuration = (10 + Math.random() * 14) + 's';
    el.style.animationDelay = -(Math.random() * 20) + 's';
    document.body.appendChild(el);
  }
})();

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  ['win-overlay','cel-overlay','tier-overlay'].forEach(function(id) {
    document.getElementById(id).classList.remove('show');
  });
  round = 0; score = 0;
  document.getElementById('score-label').textContent = '⭐ 0';
  document.getElementById('progress-fill').style.width = '0%';
  roundPlan = buildPlan();
  nextRound();
}

function nextRound() {
  document.getElementById('cel-overlay').classList.remove('show');
  if (round >= TOTAL) { endGame(); return; }

  var prevTier = getTierIdx(round);
  round++;
  locked = false;
  updateHUD();

  var newTier = getTierIdx(round);
  if (round > 1 && newTier !== prevTier) {
    showTierOverlay(newTier);
  } else {
    showQuestion();
  }
}

function showTierOverlay(tIdx) {
  var ti = TIER_INFO[tIdx - 1];
  document.getElementById('to-icon').textContent  = ti.icon;
  document.getElementById('to-title').textContent = ti.title;
  document.getElementById('to-sub').textContent   = ti.sub;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();
  confetti(42);
}

function resumeFromTier() {
  document.getElementById('tier-overlay').classList.remove('show');
  showQuestion();
}

function updateHUD() {
  var tIdx = getTierIdx(round);
  var ti   = TIER_INFO[tIdx];
  var badge = document.getElementById('tier-badge');
  badge.textContent = ti.label;
  badge.className   = ti.cls;
  document.getElementById('round-label').textContent = round + ' / ' + TOTAL;
  document.getElementById('progress-fill').style.width = ((round - 1) / TOTAL * 100) + '%';
  document.getElementById('score-label').textContent = '⭐ ' + score;
  document.getElementById('prompt').textContent = PROMPTS[(round - 1) % PROMPTS.length];
}

function showQuestion() {
  var tIdx = getTierIdx(round);
  var sc   = roundPlan[round - 1];

  var card = document.getElementById('stage-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');
  document.getElementById('from-emoji').textContent = sc.from;
  document.getElementById('from-name').textContent  = sc.fromName;

  var count    = TIER_INFO[tIdx].numChoices;
  var allWrong = sc.wrong.slice(0, count - 1);
  var opts     = shuffle([{ e:sc.to, n:sc.toName, correct:true }].concat(
    allWrong.map(function(w){ return { e:w.e, n:w.n, correct:false }; })
  ));

  var choicesEl = document.getElementById('choices');
  choicesEl.className = count === 4 ? 'cols-4' : 'cols-' + count;
  choicesEl.innerHTML = '';
  opts.forEach(function(opt, idx) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn ' + SLOT_COLS[idx % SLOT_COLS.length];
    btn.innerHTML = '<span class="choice-icon">' + opt.e + '</span>'
                  + '<span class="choice-label">' + opt.n + '</span>';
    (function(o){ btn.addEventListener('pointerdown', function(){ handleTap(btn, o, sc); }); })(opt);
    choicesEl.appendChild(btn);
  });
}

// ── Tap handling ──────────────────────────────────────────────────────────────
function handleTap(btn, opt, sc) {
  if (locked) return;
  if (opt.correct) {
    locked = true;
    score++;
    document.getElementById('score-label').textContent = '⭐ ' + score;
    btn.classList.add('correct-flash');
    playCorrect();
    sparkleBurst(btn);
    setTimeout(function() {
      btn.classList.remove('correct-flash');
      showCelebrate(sc);
    }, 500);
  } else {
    btn.classList.add('wrong-shake');
    playWrong();
    setTimeout(function() { btn.classList.remove('wrong-shake'); }, 450);
  }
}

function showCelebrate(sc) {
  document.getElementById('cel-emoji').textContent = sc.to;
  document.getElementById('cel-label').textContent = sc.toName + '! 🌟';
  document.getElementById('cel-fact').textContent  = sc.fact;
  document.getElementById('cel-overlay').classList.add('show');
  playCelebrate();
  confetti(28);
}

function endGame() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('win-score').textContent = '⭐ ' + score + ' / 9';
  document.getElementById('win-overlay').classList.add('show');
  playWin();
  confetti(60);
  setTimeout(function() { confetti(40); }, 700);
}

// ── Particles ─────────────────────────────────────────────────────────────────
function sparkleBurst(btn) {
  var r  = btn.getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top  + r.height / 2;
  var ems  = ['✨','💫','🌱','⭐','🦋','🌸','🌿','🐛'];
  var cols = ['#a5d6a7','#ffd700','#f48fb1','#ce93d8','#80deea','#ffab91','#fff'];
  for (var i = 0; i < 20; i++) {
    var el = document.createElement('div');
    el.className = 'sp';
    el.textContent = ems[i % ems.length];
    el.style.cssText = 'font-size:' + (18 + Math.random() * 14) + 'px;left:' + (cx + (Math.random() - .5) * 120) + 'px;top:' + (cy + (Math.random() - .5) * 100) + 'px;animation-delay:' + (Math.random() * .15) + 's;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), 900);
  }
  for (var j = 0; j < 18; j++) {
    var dot  = document.createElement('div');
    dot.className = 'sp-dot';
    var a   = Math.random() * Math.PI * 2;
    var dist = 28 + Math.random() * 80;
    var sz  = 5 + Math.random() * 10;
    dot.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (cx - sz/2) + 'px;top:' + (cy - sz/2) + 'px;background:' + cols[j % cols.length] + ';--tx:' + (Math.cos(a) * dist) + 'px;--ty:' + (Math.sin(a) * dist) + 'px;';
    document.body.appendChild(dot);
    setTimeout(function(e) { return function() { e.remove(); }; }(dot), 950);
  }
}

function confetti(count) {
  var cols = ['#a5d6a7','#ffd700','#f48fb1','#ce93d8','#80deea','#ff7043','#fff','#ffcc02'];
  for (var i = 0; i < count; i++) {
    var el  = document.createElement('div');
    el.className = 'confetti';
    var dur = 1.4 + Math.random() * 1.8;
    var sz  = 6 + Math.random() * 10;
    el.style.cssText = 'left:' + Math.random() * 100 + 'vw;width:' + sz + 'px;height:' + sz * (0.4 + Math.random() * 0.7) + 'px;background:' + cols[i % cols.length] + ';animation-duration:' + dur + 's;animation-delay:' + Math.random() * .5 + 's;--cr:' + ((Math.random() - .5) * 720) + 'deg;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), (dur + 0.6) * 1000 + 200);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
startGame();
</script>
