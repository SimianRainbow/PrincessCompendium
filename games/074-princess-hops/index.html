<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Hops! 🐸</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#e8f5e9 0%,#f3e5f5 50%,#e3f2fd 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-gem{
      position:fixed;pointer-events:none;opacity:.09;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite;z-index:0;
    }
    @keyframes bgFloat{
      0%{transform:translateY(110vh) rotate(0)}
      100%{transform:translateY(-15vh) rotate(360deg)}
    }

    /* ── Header ── */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{
      font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;
      color:#fff;font-weight:bold;border:2px solid rgba(255,255,255,.38);
      transition:background .4s;
    }
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000 !important;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(50,120,50,.8);position:relative;z-index:1;}
    #score-row  {font-size:clamp(16px,4vw,22px);letter-spacing:1px;position:relative;z-index:1;}

    /* ── Progress bar ── */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(50,150,80,.15);border-radius:99px;
      margin:clamp(7px,1.8vw,11px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#66bb6a,#ab47bc);
      border-radius:99px;transition:width .4s ease;width:0%;
    }

    /* ── Prompt ── */
    #prompt{
      font-size:clamp(16px,4.2vw,24px);color:#1b5e20;
      text-align:center;padding:0 16px;
      margin:clamp(10px,2.5vw,16px) 0 clamp(6px,1.5vw,10px);
      position:relative;z-index:1;line-height:1.35;
    }

    /* ── Stone path ── */
    #stone-path{
      display:flex;align-items:center;justify-content:center;
      gap:0;
      padding:clamp(8px,2vw,14px) clamp(12px,3vw,20px);
      position:relative;z-index:1;
      width:100%;
    }
    .stone{
      width:clamp(54px,13.5vw,72px);
      height:clamp(54px,13.5vw,72px);
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(14px,3.5vw,22px);
      color:#fff;
      text-shadow:0 2px 4px rgba(0,0,0,.35);
      box-shadow:0 4px 14px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35);
      flex-shrink:0;
      transition:transform .2s;
    }
    .stone.missing{
      background:linear-gradient(135deg,#ffd700,#ff9800) !important;
      animation:stonePulse 1.2s ease-in-out infinite;
      border:3px solid rgba(255,255,255,.55);
      color:#5d2e00;
      text-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    @keyframes stonePulse{
      0%,100%{transform:scale(1);box-shadow:0 4px 14px rgba(255,180,0,.4);}
      50%{transform:scale(1.1);box-shadow:0 0 32px rgba(255,215,0,.85);}
    }
    .stone.filled-in{
      background:linear-gradient(135deg,#ffd700,#ff9800) !important;
      animation:fillPop .5s ease-out forwards;
      color:#5d2e00;
      text-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    @keyframes fillPop{
      0%{transform:scale(.5);opacity:.5}
      60%{transform:scale(1.2)}
      100%{transform:scale(1);opacity:1}
    }
    .conn{
      width:clamp(8px,2vw,14px);
      height:3px;
      background:linear-gradient(90deg,rgba(100,180,100,.4),rgba(100,180,100,.7));
      border-radius:2px;
      flex-shrink:0;
      align-self:center;
    }

    /* ── Choice buttons ── */
    #choices{
      display:flex;gap:clamp(10px,2.5vw,18px);
      padding:0 clamp(12px,3vw,22px);
      width:100%;justify-content:center;
      position:relative;z-index:1;
      flex-wrap:wrap;
      margin-top:clamp(6px,1.5vw,12px);
    }
    .choice-btn{
      min-width:clamp(90px,22vw,130px);min-height:clamp(90px,22vw,120px);
      border-radius:24px;border:none;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;
      box-shadow:0 5px 20px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);
      transition:transform .1s;touch-action:manipulation;
      flex:1;max-width:clamp(100px,27vw,150px);
    }
    .choice-btn:active{transform:scale(.9);}
    .choice-btn .num{
      font-size:clamp(30px,8vw,52px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1;
    }
    .choice-btn .hop-icon{font-size:clamp(14px,3.5vw,20px);}
    .choice-btn.correct-flash{animation:correctPop .5s ease-out;}
    @keyframes correctPop{
      0%{transform:scale(1)}
      40%{transform:scale(1.16);box-shadow:0 0 40px rgba(255,215,0,.9);}
      100%{transform:scale(1)}
    }
    .choice-btn.wrong-shake{animation:wrongShake .42s ease-out;}
    @keyframes wrongShake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-12px)}
      60%{transform:translateX(12px)}
    }

    /* ── Sparkles ── */
    .sparkle{
      position:fixed;pointer-events:none;z-index:90;
      font-size:clamp(14px,3.5vw,22px);
      animation:sparkleOut ease-out forwards;
    }
    @keyframes sparkleOut{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1}
      50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
      100%{transform:translate(-50%,-50%) scale(.1);opacity:0}
    }
    .confetti-p{
      position:fixed;pointer-events:none;z-index:90;border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall{0%{top:-20px;opacity:1}100%{top:110vh;opacity:.1}}

    /* ── Celebrate overlay ── */
    #celebrate{
      position:fixed;inset:0;z-index:80;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(8px,2vw,14px);
      background:rgba(240,255,245,.94);
    }
    #celebrate.show{display:flex;}
    #cel-big{font-size:clamp(60px,16vw,96px);animation:bigPop .4s ease-out;}
    @keyframes bigPop{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
    #cel-seq{
      font-size:clamp(18px,4.8vw,32px);color:#1b5e20;
      text-align:center;padding:0 16px;line-height:1.5;
      text-shadow:0 0 12px rgba(50,150,50,.2);
    }
    #cel-fact{
      font-size:clamp(13px,3.2vw,18px);color:#4a148c;
      text-align:center;padding:0 20px;
      font-style:italic;margin:0;line-height:1.4;
    }
    #cel-msg{font-size:clamp(16px,4.2vw,26px);color:#880e4f;text-align:center;padding:0 16px;}
    #next-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px);
      font-size:clamp(20px,5.5vw,30px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;touch-action:manipulation;
      box-shadow:0 6px 22px rgba(255,180,0,.45);
    }

    /* ── Tier overlay ── */
    #tier-overlay{
      position:fixed;inset:0;z-index:85;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;
      background:rgba(0,0,0,.67);
    }
    #tier-overlay.show{display:flex;}
    #to-icon {font-size:clamp(60px,16vw,96px);}
    #to-title{font-size:clamp(26px,7vw,46px);color:#ffd700;text-shadow:0 0 20px #ff9800;text-align:center;padding:0 16px;}
    #to-sub  {font-size:clamp(16px,4.5vw,24px);color:#fff;text-align:center;padding:0 24px;}
    #to-btn  {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(20px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00;font-family:inherit;cursor:pointer;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;
    }

    /* ── Win overlay ── */
    #win-overlay{
      position:fixed;inset:0;z-index:90;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(12px,3vw,20px);
      background:linear-gradient(160deg,#1b5e20 0%,#4a148c 100%);
    }
    #win-overlay.show{display:flex;}
    #win-emoji{font-size:clamp(72px,18vw,110px);animation:startBob 2.4s ease-in-out infinite;}
    @keyframes startBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    #win-title{font-size:clamp(28px,7.5vw,52px);color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.7);text-align:center;padding:0 20px;}
    #win-sub  {font-size:clamp(16px,4.5vw,24px);color:rgba(255,255,255,.85);text-align:center;}
    #play-again-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,64px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;
      box-shadow:0 6px 24px rgba(255,180,0,.5);touch-action:manipulation;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 By 2s</div>
  <div id="round-label">1 / 18</div>
  <div id="score-row">0 ⭐</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="prompt">Count by 2s — which stone is hiding? 🐸</div>
<div id="stone-path"></div>
<div id="choices"></div>

<div id="celebrate">
  <div id="cel-big">🐸</div>
  <div id="cel-seq">2 → 4 → 6 → 8 → 10</div>
  <div id="cel-fact">Skip counting is counting the fast way! ✨</div>
  <div id="cel-msg">Amazing! 🌟</div>
  <button id="next-btn" onclick="doNext()">Next ➡️</button>
</div>

<div id="tier-overlay">
  <div id="to-icon">🐸</div>
  <div id="to-title">Skip by 5s now!</div>
  <div id="to-sub">Time to hop by 5s — you're amazing! 💎</div>
  <button id="to-btn" onclick="resumeFromTier()">Keep hopping! ➡️</button>
</div>

<div id="win-overlay">
  <div id="win-emoji">🏆</div>
  <div id="win-title">Skip Count Champion! 🐸</div>
  <div id="win-sub">You found every missing stone! 🌟</div>
  <button id="play-again-btn" onclick="restartGame()">Play Again 🔄</button>
</div>

<script>
  // Each question: start number, step size, which of 5 stones is missing (0-4)
  var EASY_POOL = [   // by 2s
    {start:2,  step:2, missing:2},  // 2,4,?,8,10 → 6
    {start:4,  step:2, missing:3},  // 4,6,8,?,12 → 10
    {start:2,  step:2, missing:1},  // 2,?,6,8,10 → 4
    {start:6,  step:2, missing:2},  // 6,8,?,12,14 → 10
    {start:10, step:2, missing:3},  // 10,12,14,?,18 → 16
    {start:4,  step:2, missing:4},  // 4,6,8,10,? → 12
    {start:8,  step:2, missing:2},  // 8,10,?,14,16 → 12
    {start:12, step:2, missing:1},  // 12,?,16,18,20 → 14
    {start:2,  step:2, missing:3},  // 2,4,6,?,10 → 8
  ];
  var MED_POOL = [    // by 5s
    {start:5,  step:5, missing:2},  // 5,10,?,20,25 → 15
    {start:10, step:5, missing:3},  // 10,15,20,?,30 → 25
    {start:5,  step:5, missing:1},  // 5,?,15,20,25 → 10
    {start:20, step:5, missing:2},  // 20,25,?,35,40 → 30
    {start:25, step:5, missing:3},  // 25,30,35,?,45 → 40
    {start:15, step:5, missing:4},  // 15,20,25,30,? → 35
    {start:10, step:5, missing:1},  // 10,?,20,25,30 → 15
    {start:30, step:5, missing:2},  // 30,35,?,45,50 → 40
    {start:5,  step:5, missing:4},  // 5,10,15,20,? → 25
  ];
  var HARD_POOL = [   // by 10s
    {start:10, step:10, missing:2}, // 10,20,?,40,50 → 30
    {start:20, step:10, missing:3}, // 20,30,40,?,60 → 50
    {start:10, step:10, missing:1}, // 10,?,30,40,50 → 20
    {start:30, step:10, missing:2}, // 30,40,?,60,70 → 50
    {start:40, step:10, missing:3}, // 40,50,60,?,80 → 70
    {start:20, step:10, missing:4}, // 20,30,40,50,? → 60
    {start:50, step:10, missing:2}, // 50,60,?,80,90 → 70
    {start:30, step:10, missing:1}, // 30,?,50,60,70 → 40
    {start:60, step:10, missing:2}, // 60,70,?,90,100 → 80
  ];

  var STONE_COLORS = [
    'linear-gradient(135deg,#f48fb1,#c2185b)',
    'linear-gradient(135deg,#ce93d8,#7b1fa2)',
    'linear-gradient(135deg,#80cbc4,#00695c)',
    'linear-gradient(135deg,#ffb74d,#e65100)',
    'linear-gradient(135deg,#a5d6a7,#2e7d32)',
  ];

  var BTN_COLORS = [
    'linear-gradient(135deg,#f48fb1,#c2185b)',
    'linear-gradient(135deg,#81d4fa,#01579b)',
    'linear-gradient(135deg,#a5d6a7,#1b5e20)',
  ];

  var TIER_INFO = [
    {label:'🌱 By 2s',  cls:'tier-easy',   icon:'🐸', title:'Skip by 5s now!', sub:'Time to hop by 5s — you\'re amazing! 💎'},
    {label:'⭐ By 5s',  cls:'tier-medium', icon:'✨', title:'Count by 10s!',   sub:'Biggest hops yet — count by 10s! 👑'},
    {label:'👑 By 10s', cls:'tier-hard',   icon:'👑', title:'Skip Count Star!', sub:'All done! You\'re a champion! 🎉'},
  ];

  var PROMPTS = [
    ['Count by 2s — which stone is hiding? 🐸',
     'Princess hops by 2! Tap the missing number! 💎',
     'Skip hop! 2, 4, 6... what\'s the gap? ✨',
     'Each jump is +2! Which stone is missing? 👑',
     'By 2s... find the hidden stepping stone! 🌸'],
    ['Count by 5s — which stone is hiding? 🌷',
     'Princess hops by 5! Tap the missing number! 💎',
     'Skip hop! 5, 10, 15... what\'s the gap? ✨',
     'Each jump is +5! Which stone is missing? 👑',
     'By 5s... find the hidden stepping stone! 🌸'],
    ['Count by 10s — which stone is hiding? 🌟',
     'Princess hops by 10! Tap the missing number! 💎',
     'Skip hop! 10, 20, 30... what\'s the gap? ✨',
     'Each jump is +10! Which stone is missing? 👑',
     'By 10s... find the hidden stepping stone! 🌸'],
  ];

  var FACTS_BY2 = [
    'Counting by 2s is called skip counting! ✨',
    'Even numbers all end in 0, 2, 4, 6 or 8! 🌟',
    'Counting by 2s is how we count pairs of shoes! 👟',
    'We skip count by 2s to count animals\' legs! 🦋',
    'Skip counting helps us count super fast! 🚀',
  ];
  var FACTS_BY5 = [
    'We skip count by 5s when counting nickels! 🪙',
    'A hand has 5 fingers — count by 5s! 🖐',
    'A pentagon has 5 sides! ⭐',
    'Clock hands move by 5s around the face! 🕐',
    'Counting by 5s is like magic speedwork! ⚡',
  ];
  var FACTS_BY10 = [
    'We have 10 fingers and 10 toes! 👐',
    'Counting by 10s is the fastest skip count! 🚀',
    'A decade is 10 years long! 📅',
    'Our whole number system is built on 10! 🔢',
    '10, 20, 30 — skip counting by 10s is easy! ✨',
  ];

  var MSGS=['Amazing! 🌟','Brilliant! 💫','You did it! 👑','Wonderful! 🌈','Superstar! 💖','Perfect! ✨'];

  var rounds=[], cur=0, score=0, locked=false, promptVariant=0;

  // ── Audio ─────────────────────────────────────────────────────────────
  var audioCtx=null;
  function au(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
  function tone(f,type,d,v){
    v=v||0.15;
    try{
      var c=au(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
      o.start();o.stop(c.currentTime+d);
    }catch(e){}
  }
  function playCorrect()  {[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.2,.18);},i*75);});}
  function playWrong()    {tone(200,'sawtooth',.22,.12);}
  function playTierUp()   {[392,494,587,784,988].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.28,.17);},i*90);});}
  function playCelebrate(){[523,587,659,784,880,1047,1319].forEach(function(f,i){setTimeout(function(){tone(f,'sine',.25,.16);},i*60);});}

  // ── Shuffle ──────────────────────────────────────────────────────────
  function shuffle(a){
    var b=a.slice();
    for(var i=b.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=b[i];b[i]=b[j];b[j]=t;}
    return b;
  }

  // ── Get stone numbers ─────────────────────────────────────────────────
  function getStones(q){
    var s=[];
    for(var i=0;i<5;i++) s.push(q.start+i*q.step);
    return s;
  }

  // ── Distractors ──────────────────────────────────────────────────────
  function getDistractors(answer, step){
    var pool=[];
    for(var d=-2;d<=2;d++){
      if(d!==0){
        var v=answer+d*step;
        if(v>0) pool.push(v);
      }
    }
    pool=shuffle(pool);
    return pool.slice(0,2);
  }

  // ── Build stone path ──────────────────────────────────────────────────
  function buildStonePath(q){
    var stones=getStones(q);
    var path=document.getElementById('stone-path');
    path.innerHTML='';
    for(var i=0;i<5;i++){
      if(i>0){
        var conn=document.createElement('div');
        conn.className='conn';
        path.appendChild(conn);
      }
      var s=document.createElement('div');
      s.className='stone';
      s.id='stone-'+i;
      if(i===q.missing){
        s.classList.add('missing');
        s.textContent='?';
      } else {
        s.style.background=STONE_COLORS[i];
        s.textContent=stones[i];
      }
      path.appendChild(s);
    }
  }

  function fillMissingStone(q){
    var stones=getStones(q);
    var el=document.getElementById('stone-'+q.missing);
    if(el){
      el.classList.remove('missing');
      el.classList.add('filled-in');
      el.style.animationPlayState='running';
      el.textContent=stones[q.missing];
    }
  }

  // ── HUD ───────────────────────────────────────────────────────────────
  function updateHUD(){
    document.getElementById('score-row').textContent=score+' ⭐';
    document.getElementById('progress-fill').style.width=((cur/18)*100)+'%';
    document.getElementById('round-label').textContent=(cur+1)+' / 18';
  }

  // ── Pick rounds ───────────────────────────────────────────────────────
  function pickRounds(){
    var e=shuffle(EASY_POOL).slice(0,6);
    var m=shuffle(MED_POOL).slice(0,6);
    var h=shuffle(HARD_POOL).slice(0,6);
    return e.concat(m).concat(h);
  }

  // ── Show round ────────────────────────────────────────────────────────
  function showRound(idx){
    locked=false;
    cur=idx;
    updateHUD();

    var q=rounds[idx];
    var tIdx=Math.floor(idx/6);
    var ti=TIER_INFO[tIdx];
    var answer=q.start+q.missing*q.step;

    var badge=document.getElementById('tier-badge');
    badge.textContent=ti.label; badge.className='tier-badge '+ti.cls;

    document.getElementById('prompt').textContent=PROMPTS[tIdx][promptVariant%5];
    buildStonePath(q);

    var distractors=getDistractors(answer, q.step);
    var opts=shuffle([answer].concat(distractors));

    var choicesDiv=document.getElementById('choices');
    choicesDiv.innerHTML='';
    opts.forEach(function(n, colorIdx){
      var btn=document.createElement('button');
      btn.className='choice-btn';
      btn.style.background=BTN_COLORS[colorIdx%BTN_COLORS.length];
      btn.innerHTML='<span class="num">'+n+'</span><span class="hop-icon">🐸</span>';
      (function(chosen){
        btn.addEventListener('pointerdown', function(){ handleTap(btn, chosen, answer, q); });
      })(n);
      choicesDiv.appendChild(btn);
    });
  }

  // ── Handle tap ────────────────────────────────────────────────────────
  function handleTap(btn, chosen, answer, q){
    if(locked) return;
    if(chosen===answer){
      locked=true;
      btn.classList.add('correct-flash');
      playCorrect();
      score++;
      fillMissingStone(q);
      var rect=btn.getBoundingClientRect();
      sparkleBurst(rect.left+rect.width/2, rect.top+rect.height/2);
      setTimeout(function(){ showCelebrate(q); }, 520);
    } else {
      btn.classList.add('wrong-shake');
      playWrong();
      setTimeout(function(){ btn.classList.remove('wrong-shake'); },420);
    }
  }

  // ── Sparkles ──────────────────────────────────────────────────────────
  function sparkleBurst(x,y){
    var ems=['✨','🐸','⭐','💚','🌸','👑','💫','🌟','🍀','💎'];
    for(var i=0;i<22;i++){
      var el=document.createElement('span');
      el.className='sparkle';
      el.textContent=ems[i%ems.length];
      var angle=(i/22)*Math.PI*2;
      var dist=55+Math.random()*95;
      el.style.left=(x+Math.cos(angle)*dist)+'px';
      el.style.top=(y+Math.sin(angle)*dist)+'px';
      el.style.animationDelay=(Math.random()*.15)+'s';
      el.style.animationDuration=(.75+Math.random()*.4)+'s';
      document.body.appendChild(el);
      setTimeout((function(e){return function(){e.remove();};})(el),1200);
    }
  }

  function confettiBurst(n){
    var cols=['#ffd700','#ff69b4','#b39ddb','#80cbc4','#66bb6a','#da70d6','#fff','#f48fb1'];
    for(var i=0;i<n;i++){
      var el=document.createElement('div'); el.className='confetti-p';
      var sz=8+Math.random()*8;
      el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz+'px;'
        +'background:'+cols[i%cols.length]+';'
        +'animation-duration:'+(1.2+Math.random()*1.6)+'s;animation-delay:'+Math.random()*.4+'s;';
      document.body.appendChild(el);
      setTimeout((function(e){return function(){e.remove();};})(el),2900);
    }
  }

  // ── Celebrate overlay ─────────────────────────────────────────────────
  function showCelebrate(q){
    var stones=getStones(q);
    var tIdx=Math.floor(cur/6);
    var seqStr=stones.join(' → ');
    var factsList=tIdx===0 ? FACTS_BY2 : tIdx===1 ? FACTS_BY5 : FACTS_BY10;
    var fact=factsList[promptVariant%factsList.length];
    var icons=['🐸','✨','👑'];

    document.getElementById('cel-big').textContent=icons[tIdx];
    document.getElementById('cel-seq').textContent=seqStr;
    document.getElementById('cel-fact').textContent=fact;
    document.getElementById('cel-msg').textContent=MSGS[Math.floor(Math.random()*MSGS.length)];
    promptVariant++;
    document.getElementById('celebrate').classList.add('show');
    playCelebrate();
    confettiBurst(30);
  }

  function doNext(){
    document.getElementById('celebrate').classList.remove('show');
    advanceRound();
  }

  // ── Advance round ─────────────────────────────────────────────────────
  function advanceRound(){
    var was=cur;
    var next=was+1;
    if(next>=rounds.length){ showWin(); return; }
    var prevTier=Math.floor(was/6);
    var newTier =Math.floor(next/6);
    if(newTier!==prevTier){
      playTierUp(); confettiBurst(42);
      var ti=TIER_INFO[prevTier];
      document.getElementById('to-icon').textContent=ti.icon;
      document.getElementById('to-title').textContent=ti.title;
      document.getElementById('to-sub').textContent=ti.sub;
      document.getElementById('tier-overlay').classList.add('show');
    } else {
      showRound(next);
    }
    cur=next;
  }

  function resumeFromTier(){
    document.getElementById('tier-overlay').classList.remove('show');
    showRound(cur);
  }

  // ── Win ───────────────────────────────────────────────────────────────
  function showWin(){
    document.getElementById('progress-fill').style.width='100%';
    document.getElementById('win-sub').textContent=score+' / 18 ⭐ — You found every missing stone!';
    document.getElementById('win-overlay').classList.add('show');
    playCelebrate();
    confettiBurst(60);
    setTimeout(function(){ confettiBurst(42); },600);
  }

  // ── Background gems ───────────────────────────────────────────────────
  function makeBg(){
    var items=['🐸','✨','👑','🌸','💚','⭐','💫','🌿','🌟','🔮','🍀','💎'];
    for(var i=0;i<12;i++){
      var el=document.createElement('div'); el.className='bg-gem';
      el.textContent=items[i%items.length];
      el.style.left=(5+Math.random()*90)+'vw';
      el.style.animationDuration=(9+Math.random()*14)+'s';
      el.style.animationDelay=-(Math.random()*16)+'s';
      document.body.appendChild(el);
    }
  }

  // ── Restart ───────────────────────────────────────────────────────────
  function restartGame(){
    document.getElementById('win-overlay').classList.remove('show');
    score=0; cur=0; promptVariant=0;
    rounds=pickRounds();
    updateHUD();
    showRound(0);
  }

  // ── Init ──────────────────────────────────────────────────────────────
  makeBg();
  rounds=pickRounds();
  updateHUD();
  showRound(0);
</script>
</body>
</html>
