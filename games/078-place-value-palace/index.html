<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Place Value Palace 🏰</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#1a0040 0%,#4a0080 45%,#002060 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-float{position:fixed;pointer-events:none;opacity:.09;font-size:clamp(16px,4vw,26px);animation:bgFloat linear infinite;z-index:0;}
    @keyframes bgFloat{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}

    /* Header */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;font-weight:bold;border:2px solid rgba(255,255,255,.35);}
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);color:#fff;}
    #score-label{font-size:clamp(14px,3.5vw,19px);color:#ffd700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.5);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(255,255,255,.85);}

    /* Progress bar */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);
      border-radius:99px;transition:width .4s ease;width:0%;
      box-shadow:0 0 8px rgba(255,215,0,.45);
    }

    /* Prompt */
    #prompt{
      font-size:clamp(17px,4.5vw,26px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
      text-align:center;padding:clamp(6px,1.5vw,10px) 20px 0;
      flex-shrink:0;position:relative;z-index:1;line-height:1.2;
    }

    /* Place-value display card */
    #pv-card{
      background:rgba(255,255,255,.11);border-radius:28px;
      border:3px solid rgba(255,215,0,.4);
      box-shadow:0 6px 28px rgba(0,0,0,.4),0 0 0 2px rgba(255,215,0,.15);
      padding:clamp(8px,2vw,16px) clamp(12px,3vw,24px);
      margin:clamp(8px,2vw,14px) clamp(14px,4vw,22px) 0;
      display:flex;align-items:flex-start;justify-content:center;gap:clamp(12px,3vw,24px);
      flex-shrink:0;position:relative;z-index:1;
      animation:cardPop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

    /* Column wrappers */
    .pv-col{display:flex;flex-direction:column;align-items:center;gap:5px;}
    .col-label{
      font-size:clamp(11px,2.8vw,15px);color:rgba(255,255,255,.7);
      letter-spacing:.5px;padding:2px 10px;border-radius:8px;
      background:rgba(255,255,255,.1);
    }
    .col-blocks{
      display:flex;flex-direction:column;gap:clamp(4px,1vw,7px);
      align-items:center;justify-content:flex-start;
      min-height:clamp(60px,15vw,90px);
    }

    /* Ten-block: a tall golden bar with 10 sparkle dots in 2×5 grid */
    .ten-block{
      width:clamp(38px,9vw,52px);
      background:linear-gradient(160deg,#ffe082,#f9a825);
      border-radius:10px;border:2px solid rgba(255,215,0,.8);
      box-shadow:0 3px 10px rgba(255,180,0,.4),inset 0 1px 0 rgba(255,255,255,.4);
      display:grid;grid-template-columns:1fr 1fr;gap:3px;
      padding:5px;
      animation:blockPop .3s cubic-bezier(.34,1.56,.64,1) both;
    }
    .ten-dot{
      width:clamp(6px,1.4vw,9px);height:clamp(6px,1.4vw,9px);
      border-radius:50%;background:rgba(90,50,0,.55);
    }
    @keyframes blockPop{from{transform:scale(0)}to{transform:scale(1)}}

    /* One-block: a single pink gem dot */
    .one-block{
      width:clamp(20px,5vw,28px);height:clamp(20px,5vw,28px);
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#f8bbd0,#e91e63);
      border:2px solid rgba(255,255,255,.5);
      box-shadow:0 2px 8px rgba(233,30,99,.4);
      animation:blockPop .3s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* Ones group (wrap) */
    .ones-grid{
      display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
      max-width:clamp(70px,18vw,100px);
    }

    /* Choices */
    #choices{
      display:flex;gap:clamp(8px,2vw,14px);
      justify-content:center;
      padding:clamp(8px,2vw,14px) clamp(12px,3vw,20px);
      width:100%;max-width:460px;flex-wrap:wrap;
      position:relative;z-index:1;
    }
    .choice-btn{
      min-width:clamp(72px,18vw,100px);
      min-height:clamp(90px,22vw,110px);
      border-radius:20px;
      border:3px solid rgba(255,215,0,.35);
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:clamp(28px,7.5vw,44px);
      font-family:inherit;
      cursor:pointer;
      touch-action:manipulation;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.18);
      transition:transform .1s;
    }
    .choice-btn:active{transform:scale(.91);}
    .choice-btn.correct{border-color:#ffd700;background:rgba(255,215,0,.22);animation:correctPop .5s ease-out;}
    .choice-btn.wrong  {animation:wobble .45s ease-out;border-color:rgba(255,80,80,.7);}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.13);box-shadow:0 0 40px rgba(255,215,0,.8)}100%{transform:scale(1)}}
    @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}60%{transform:translateX(12px)}80%{transform:translateX(-6px)}}

    /* Sparkles */
    .sp{position:fixed;pointer-events:none;z-index:50;animation:spOut .75s ease-out forwards;}
    @keyframes spOut{0%{transform:scale(0);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .sp-dot{position:fixed;pointer-events:none;z-index:50;border-radius:50%;animation:dotFly .8s ease-out forwards;}
    @keyframes dotFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0}}

    /* Overlays */
    .overlay{
      position:fixed;inset:0;z-index:99;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(10px,2.5vw,16px);opacity:0;pointer-events:none;transition:opacity .3s;
      padding:20px;
    }
    .overlay.show{opacity:1;pointer-events:all;}
    .ov-emoji{font-size:clamp(60px,16vw,96px);line-height:1;}
    .ov-title{font-size:clamp(22px,6vw,42px);color:#ffd700;text-align:center;text-shadow:0 0 20px rgba(255,215,0,.6);}
    .ov-sub  {font-size:clamp(14px,3.8vw,22px);color:#f8bbd0;text-align:center;max-width:320px;line-height:1.3;}
    .ov-fact {font-size:clamp(13px,3.2vw,18px);color:#b3e5fc;text-align:center;max-width:340px;line-height:1.4;}
    .ov-btn{
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,5vw,26px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00;font-weight:bold;cursor:pointer;font-family:inherit;
      min-height:64px;min-width:180px;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;
    }

    #tier-overlay{background:rgba(0,0,0,.75);}
    #cel-overlay {background:rgba(0,0,0,.72);}
    #win-overlay {background:linear-gradient(160deg,#1a0040 0%,#4a0080 50%,#002060 100%);}
    #win-crown   {font-size:clamp(72px,18vw,110px);animation:crowBounce 1.1s ease-in-out infinite;}
    @keyframes crowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    #win-title{font-size:clamp(26px,7vw,46px);color:#ffd700;text-shadow:0 0 24px #ff9800;text-align:center;}
    #win-score{font-size:clamp(18px,5vw,30px);color:#ffd700;font-weight:bold;text-align:center;}

    /* Confetti */
    .cf{position:fixed;pointer-events:none;z-index:101;border-radius:3px;animation:cfFall linear forwards;}
    @keyframes cfFall{0%{top:-20px;opacity:1;transform:rotate(0)}100%{top:110vh;opacity:.2;transform:rotate(var(--cr,360deg))}}
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-label">⭐ 0</div>
  <div id="round-label">1 / 9</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="prompt">What number do the gems make?</div>

<!-- Place-value display -->
<div id="pv-card">
  <div class="pv-col">
    <div class="col-label">TENS 👑</div>
    <div class="col-blocks" id="tens-blocks"></div>
  </div>
  <div class="pv-col">
    <div class="col-label">ONES 💎</div>
    <div class="ones-grid" id="ones-blocks"></div>
  </div>
</div>

<div id="choices"></div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="to-emoji">🏰</div>
  <div class="ov-title" id="to-title">Level Up!</div>
  <div class="ov-sub"   id="to-sub">Bigger numbers ahead!</div>
  <button class="ov-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
</div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji" id="cel-emoji">👑</div>
  <div class="ov-title" id="cel-title">That's right!</div>
  <div class="ov-sub"   id="cel-num"></div>
  <div class="ov-fact"  id="cel-fact"></div>
  <button class="ov-btn" onclick="nextRound()">Next ➡️</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div id="win-crown">👑</div>
  <div id="win-title">Place Value Princess! 🏰</div>
  <div class="ov-sub">You can read tens and ones! ✨</div>
  <div id="win-score">⭐ 0 / 9</div>
  <button class="ov-btn" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
'use strict';

// ── Audio ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,type,dur,vol,del){
  del=del||0;vol=vol||0.15;
  try{
    var c=getAudio(),t0=c.currentTime+del;
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function playCorrect(){[523,659,784,1047].forEach(function(f,i){tone(f,'sine',0.18,0.18,i*0.07);});}
function playWrong()  {tone(260,'sawtooth',0.18,0.12);setTimeout(function(){tone(210,'sawtooth',0.14,0.09);},160);}
function playCelebrate(){[523,587,659,698,784,880,1047].forEach(function(f,i){tone(f,'sine',0.22,0.17,i*0.065);});}
function playTierUp() {[392,494,587,784,1047].forEach(function(f,i){tone(f,'triangle',0.25,0.18,i*0.09);});}
function playWin()    {[523,659,784,1047,784,1047,1319,1047,1319,1568].forEach(function(f,i){tone(f,'sine',0.3,0.2,i*0.09);});}

// ── Game data ─────────────────────────────────────────────────────────────────
// rounds: { tens, ones, fact }  — number = tens*10 + ones

var ROUNDS_EASY = [
  {tens:1,ones:2,fact:'1 ten and 2 ones = 10 + 2 = 12! The tens digit tells us how many groups of 10! 👑'},
  {tens:1,ones:5,fact:'1 ten and 5 ones = 10 + 5 = 15! Each golden bar is worth exactly 10 gems! 💛'},
  {tens:1,ones:8,fact:'1 ten and 8 ones = 10 + 8 = 18! One group of ten, plus eight loose ones! ✨'},
  {tens:1,ones:1,fact:'1 ten and 1 one = 10 + 1 = 11! Eleven — one past ten! 👑'},
  {tens:1,ones:4,fact:'1 ten and 4 ones = 10 + 4 = 14! The left digit is tens, the right is ones! 🌟'},
  {tens:1,ones:7,fact:'1 ten and 7 ones = 10 + 7 = 17! Seventeen gems in two groups! 💎'},
];

var ROUNDS_MEDIUM = [
  {tens:2,ones:3,fact:'2 tens and 3 ones = 20 + 3 = 23! Two groups of ten plus three extras! 👑'},
  {tens:3,ones:1,fact:'3 tens and 1 one = 30 + 1 = 31! Three full groups of ten — that is a lot! 💛'},
  {tens:2,ones:6,fact:'2 tens and 6 ones = 20 + 6 = 26! Always count the tens groups first! ✨'},
  {tens:3,ones:5,fact:'3 tens and 5 ones = 30 + 5 = 35! The tens digit is 3, the ones digit is 5! 🌟'},
  {tens:2,ones:0,fact:'2 tens and 0 ones = 20 + 0 = 20! A round number — zero ones! 👑'},
  {tens:3,ones:8,fact:'3 tens and 8 ones = 30 + 8 = 38! Nearly 40 — so close! 💎'},
];

var ROUNDS_HARD = [
  {tens:4,ones:2,fact:'4 tens and 2 ones = 40 + 2 = 42! Four big groups of ten! 👑'},
  {tens:5,ones:6,fact:'5 tens and 6 ones = 50 + 6 = 56! Five groups of ten is the same as fifty! 💛'},
  {tens:6,ones:4,fact:'6 tens and 4 ones = 60 + 4 = 64! Six tens — that is sixty! ✨'},
  {tens:4,ones:8,fact:'4 tens and 8 ones = 40 + 8 = 48! Nearly fifty! 🌟'},
  {tens:5,ones:3,fact:'5 tens and 3 ones = 50 + 3 = 53! The 5 means five groups of ten! 👑'},
  {tens:6,ones:1,fact:'6 tens and 1 one = 60 + 1 = 61! Just one loose gem past sixty! 💎'},
];

var TIER_DATA = [
  {label:'🌱 Easy',  cls:'tier-easy',  pool:ROUNDS_EASY,  choices:2,
   toIcon:'🌸',toTitle:'Moving to Medium!',toSub:'Bigger numbers now — count the golden bars! 👑'},
  {label:'🌸 Medium',cls:'tier-medium',pool:ROUNDS_MEDIUM,choices:3,
   toIcon:'⭐',toTitle:'Almost there!',   toSub:'4 choices — look carefully at tens and ones! 💎'},
  {label:'⭐ Hard',  cls:'tier-hard',  pool:ROUNDS_HARD,  choices:4},
];

var PROMPTS = [
  'What number do the gems make?',
  'Count the bars and gems — what number is this? 👑',
  'How many tens and ones? Tap the number! 🌟',
  'What royal number is hiding here? ✨',
  'Read the tens and ones — tap the answer! 💎',
];

var TOTAL = 9;

// ── State ─────────────────────────────────────────────────────────────────────
var round=0, score=0, locked=false, roundPlan=[], promptIdx=0;

function getTierIdx(r){return r<=3?0:r<=6?1:2;}

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function buildPlan(){
  var plan=[];
  TIER_DATA.forEach(function(tier){
    var picks=shuffle(tier.pool).slice(0,3);
    picks.forEach(function(r){plan.push(r);});
  });
  return plan;
}

// ── Background ────────────────────────────────────────────────────────────────
(function(){
  var icons=['👑','💎','✨','⭐','🏰','💫','🌟','👑','💛','🔢','🪄','🌸','💎','✨'];
  for(var i=0;i<14;i++){
    var el=document.createElement('div');el.className='bg-float';
    el.textContent=icons[i%icons.length];
    el.style.left=(3+Math.random()*94)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*20)+'s';
    document.body.appendChild(el);
  }
})();

// ── Render helpers ────────────────────────────────────────────────────────────
function renderTenBlock(delayIdx){
  var block=document.createElement('div');block.className='ten-block';
  block.style.animationDelay=(delayIdx*60)+'ms';
  for(var i=0;i<10;i++){
    var d=document.createElement('div');d.className='ten-dot';
    block.appendChild(d);
  }
  return block;
}

function renderOneBlock(delayIdx){
  var d=document.createElement('div');d.className='one-block';
  d.style.animationDelay=(delayIdx*40)+'ms';
  return d;
}

function renderPvDisplay(rd){
  var tensEl=document.getElementById('tens-blocks');
  var onesEl=document.getElementById('ones-blocks');
  tensEl.innerHTML='';onesEl.innerHTML='';

  for(var t=0;t<rd.tens;t++){
    tensEl.appendChild(renderTenBlock(t));
  }
  for(var o=0;o<rd.ones;o++){
    onesEl.appendChild(renderOneBlock(o));
  }
  if(rd.ones===0){
    var z=document.createElement('div');
    z.style.cssText='font-size:clamp(20px,5vw,28px);color:rgba(255,255,255,.4);';
    z.textContent='—';
    onesEl.appendChild(z);
  }

  var card=document.getElementById('pv-card');
  card.style.animation='none';
  void card.offsetWidth;
  card.style.animation='cardPop .4s cubic-bezier(.34,1.56,.64,1)';
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(){
  ['win-overlay','cel-overlay','tier-overlay'].forEach(function(id){
    document.getElementById(id).classList.remove('show');
  });
  round=0;score=0;locked=false;promptIdx=0;
  document.getElementById('progress-fill').style.width='0%';
  roundPlan=buildPlan();
  nextRound();
}

function nextRound(){
  document.getElementById('cel-overlay').classList.remove('show');
  if(round>=TOTAL){endGame();return;}
  var prevTier=getTierIdx(round);
  round++;locked=false;
  var curTier=getTierIdx(round);
  updateHUD();
  if(round>1&&curTier!==prevTier){
    showTierOverlay(curTier);
  }else{
    showQuestion();
  }
}

function resumeFromTier(){
  document.getElementById('tier-overlay').classList.remove('show');
  showQuestion();
}

function updateHUD(){
  var tIdx=getTierIdx(round);
  var ti=TIER_DATA[tIdx];
  var badge=document.getElementById('tier-badge');
  badge.textContent=ti.label;badge.className=ti.cls;
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';
  if(round%2===0)promptIdx=(promptIdx+1)%PROMPTS.length;
  document.getElementById('prompt').textContent=PROMPTS[promptIdx];
}

function showTierOverlay(tIdx){
  var prev=TIER_DATA[tIdx-1];
  document.getElementById('to-emoji').textContent=prev.toIcon;
  document.getElementById('to-title').textContent=prev.toTitle;
  document.getElementById('to-sub').textContent  =prev.toSub;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();confetti(42);
}

function showQuestion(){
  var rd=roundPlan[round-1];
  var tIdx=getTierIdx(round);
  var numChoices=TIER_DATA[tIdx].choices;
  var answer=rd.tens*10+rd.ones;

  renderPvDisplay(rd);

  // Build wrong answers: plausible alternatives (swapped digits, ±1 ten, ±1 one)
  var wrongs=[];
  var swapped=rd.ones*10+rd.tens;
  if(swapped!==answer&&swapped>=10&&swapped<=69)wrongs.push(swapped);
  var alt1=answer-10;if(alt1>=10&&alt1!==answer)wrongs.push(alt1);
  var alt2=answer+10;if(alt2<=69&&alt2!==answer)wrongs.push(alt2);
  var alt3=answer-1; if(alt3>=10&&alt3!==answer)wrongs.push(alt3);
  var alt4=answer+1; if(alt4<=69&&alt4!==answer)wrongs.push(alt4);
  // dedupe
  var seen={};wrongs=wrongs.filter(function(n){if(seen[n])return false;seen[n]=true;return true;});
  var wrongChoices=shuffle(wrongs).slice(0,numChoices-1);

  var opts=shuffle([answer].concat(wrongChoices));

  var choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  opts.forEach(function(num){
    var btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=num;
    var isCorrect=(num===answer);
    (function(b,ok){
      b.addEventListener('pointerdown',function(){handleTap(b,ok,answer,rd);});
    })(btn,isCorrect);
    choicesEl.appendChild(btn);
  });
}

// ── Tap handling ──────────────────────────────────────────────────────────────
function handleTap(btn,ok,answer,rd){
  if(locked)return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true;score++;
    btn.classList.add('correct');
    playCorrect();
    var r=btn.getBoundingClientRect();
    sparkleBurst(r.left+r.width/2,r.top+r.height/2);
    setTimeout(function(){showCelebrate(answer,rd);},550);
  }else{
    btn.classList.add('wrong');
    playWrong();
    setTimeout(function(){btn.classList.remove('wrong');},460);
  }
}

function showCelebrate(answer,rd){
  var msgs=['Amazing! 🌟','You got it! 👑','Brilliant! ✨','Superstar! ⭐','Perfect! 💎'];
  document.getElementById('cel-emoji').textContent='🏰';
  document.getElementById('cel-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('cel-num').textContent=
    rd.tens+' ten'+(rd.tens!==1?'s':'')+' + '+rd.ones+' one'+(rd.ones!==1?'s':'')+' = '+answer+'!';
  document.getElementById('cel-fact').textContent=rd.fact;
  document.getElementById('cel-overlay').classList.add('show');
  playCelebrate();confetti(28);
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('progress-fill').style.width=(round/TOTAL*100)+'%';
}

function endGame(){
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('win-score').textContent='⭐ '+score+' / 9';
  document.getElementById('win-overlay').classList.add('show');
  playWin();confetti(60);setTimeout(function(){confetti(40);},700);
}

// ── Particles ─────────────────────────────────────────────────────────────────
function sparkleBurst(cx,cy){
  var ems=['✨','💫','👑','⭐','💎','🌟','🏰','🪄'];
  var cols=['#ffd700','#f48fb1','#fff','#ce93d8','#80deea','#ffab91'];
  for(var i=0;i<22;i++){
    var el=document.createElement('div');el.className='sp';
    el.textContent=ems[i%ems.length];
    el.style.cssText='font-size:'+(16+Math.random()*14)+'px;left:'+(cx+(Math.random()-.5)*130)+'px;top:'+(cy+(Math.random()-.5)*110)+'px;animation-delay:'+(Math.random()*.15)+'s;';
    document.body.appendChild(el);
    setTimeout((function(e){return function(){e.remove();};})(el),900);
  }
  for(var j=0;j<20;j++){
    var dot=document.createElement('div');dot.className='sp-dot';
    var a=Math.random()*Math.PI*2,dist=30+Math.random()*85,sz=5+Math.random()*10;
    dot.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;background:'+cols[j%cols.length]+';--tx:'+(Math.cos(a)*dist)+'px;--ty:'+(Math.sin(a)*dist)+'px;';
    document.body.appendChild(dot);
    setTimeout((function(e){return function(){e.remove();};})(dot),950);
  }
}

function confetti(count){
  var cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b3e5fc','#a5d6a7','#ff8a65'];
  for(var i=0;i<count;i++){
    var el=document.createElement('div');el.className='cf';
    var sz=6+Math.random()*10,dur=1.4+Math.random()*1.8;
    el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz*(0.4+Math.random()*.7)+'px;background:'+cols[i%cols.length]+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*.5+'s;--cr:'+((Math.random()-.5)*720)+'deg;';
    document.body.appendChild(el);
    setTimeout((function(e){return function(){e.remove();};})(el),(dur+.6)*1000+200);
  }
}

startGame();
</script>
