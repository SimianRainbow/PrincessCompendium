<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Royal Garden 🌷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background:linear-gradient(160deg,#1a3a00 0%,#2e7d32 45%,#1b5e20 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; touch-action:manipulation;
    }

    .bg-float { position:fixed; pointer-events:none; animation:bgFloat linear infinite; opacity:.12; font-size:clamp(18px,4.5vw,28px); }
    @keyframes bgFloat { 0%{transform:translateY(110vh) rotate(0deg)} 100%{transform:translateY(-15vh) rotate(360deg)} }

    /* Header */
    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.8vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0; position:relative; z-index:10;
    }
    #tier-badge { font-size:clamp(13px,3.4vw,18px); padding:5px 15px; border-radius:20px; font-weight:bold; }
    .tier-easy   { background:linear-gradient(135deg,#a5d6a7,#66bb6a); color:#1b5e20; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#ffd54f); color:#5a3000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#ab47bc); color:#fff; }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.9); }
    #score-label { font-size:clamp(16px,4vw,22px); color:#ffd700; text-shadow:0 0 10px rgba(255,215,0,.6); min-width:36px; text-align:right; }

    /* Progress bar */
    #progress-wrap { width:100%; padding:6px clamp(14px,4vw,22px) 0; flex-shrink:0; position:relative; z-index:10; }
    #progress-track { background:rgba(255,255,255,.18); border-radius:20px; height:clamp(8px,2vw,12px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#69f0ae,#ffd700); transition:width .35s ease; width:0%; }

    /* Prompt */
    #prompt-wrap {
      width:100%; text-align:center; flex-shrink:0;
      padding:clamp(10px,2.5vw,16px) 16px clamp(4px,1vw,8px);
      position:relative; z-index:10;
    }
    #prompt-text {
      font-size:clamp(20px,5.2vw,32px); color:#fff;
      text-shadow:0 2px 12px rgba(0,0,0,.55); line-height:1.25;
    }

    /* Plant diagram */
    #plant-wrap {
      flex-shrink:0; display:flex; justify-content:center; align-items:center;
      position:relative; z-index:10;
      padding:clamp(4px,1vw,10px) 20px;
      width:100%; max-width:380px;
    }
    #plant-svg { width:clamp(180px,52vw,260px); height:clamp(180px,52vw,260px); }

    /* Choices */
    #choices-row {
      flex:1; display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
      gap:clamp(8px,2.5vw,14px);
      padding:clamp(8px,2vw,14px) clamp(10px,2.5vw,16px) clamp(12px,3vw,20px);
      width:100%; max-width:480px; position:relative; z-index:10;
    }
    .choice-btn {
      width:clamp(100px,28vw,130px); height:clamp(100px,26vw,126px);
      border-radius:22px; border:3px solid rgba(255,255,255,.3);
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:5px;
      backdrop-filter:blur(4px);
      box-shadow:0 4px 22px rgba(0,0,0,.4);
      transition:transform .1s; touch-action:manipulation;
      padding:10px 6px;
    }
    .choice-btn:active { transform:scale(.9); }
    .choice-btn .cb-emoji { font-size:clamp(34px,9vw,52px); line-height:1; pointer-events:none; }
    .choice-btn .cb-name  { font-size:clamp(12px,3vw,17px); color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.55); pointer-events:none; text-align:center; font-weight:bold; }
    .choice-btn.correct { animation:cPop .5s ease-out; border-color:#ffd700; }
    @keyframes cPop { 0%{transform:scale(1)} 40%{transform:scale(1.14);box-shadow:0 0 55px rgba(255,215,0,.85)} 100%{transform:scale(1)} }
    .choice-btn.wrong   { animation:wShake .42s ease-out; background:rgba(255,60,60,.22) !important; }
    @keyframes wShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 60%{transform:translateX(12px)} }

    /* Sparkles */
    .sp    { position:fixed; pointer-events:none; z-index:50; border-radius:50%; animation:spOut .75s ease-out forwards; }
    @keyframes spOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.6);opacity:0} }
    .sp-em { position:fixed; pointer-events:none; z-index:51; font-size:clamp(18px,4.5vw,26px); animation:spFloat .9s ease-out forwards; }
    @keyframes spFloat { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-85px) scale(0);opacity:0} }

    /* Celebrate overlay */
    #cel-overlay {
      position:fixed; inset:0; background:rgba(10,30,10,.9);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
      z-index:95; opacity:0; pointer-events:none; transition:opacity .35s;
    }
    #cel-overlay.show { opacity:1; pointer-events:all; }
    #cel-icon  { font-size:clamp(68px,17vw,108px); animation:bigPop .4s ease-out; }
    @keyframes bigPop { 0%{transform:scale(.3)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
    #cel-msg   { font-size:clamp(18px,4.8vw,28px); color:#69f0ae; text-shadow:0 0 12px rgba(105,240,174,.6); }
    #cel-name  { font-size:clamp(24px,6.5vw,40px); color:#ffd700; text-align:center; text-shadow:0 0 20px rgba(255,215,0,.7); }
    #cel-fact  { font-size:clamp(13px,3.4vw,18px); color:rgba(255,255,255,.9); text-align:center;
                 padding:6px 24px; max-width:360px; line-height:1.45; background:rgba(255,255,255,.1);
                 border-radius:14px; }
    #cel-btn {
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px); font-size:clamp(18px,4.8vw,26px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#69f0ae,#ffd700);
      color:#1b5e20; font-weight:bold; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 20px rgba(105,240,174,.4); touch-action:manipulation; margin-top:4px;
    }

    /* Tier overlay */
    #tier-overlay {
      position:fixed; inset:0; background:rgba(0,20,0,.78);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      z-index:99; opacity:0; pointer-events:none; transition:opacity .4s;
    }
    #tier-overlay.show { opacity:1; pointer-events:all; }
    #to-icon  { font-size:clamp(60px,16vw,96px); }
    #to-title { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-shadow:0 0 20px rgba(255,215,0,.7); text-align:center; padding:0 20px; }
    #to-sub   { font-size:clamp(15px,4vw,22px); color:rgba(255,255,255,.9); text-align:center; padding:0 24px; }
    #to-btn {
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px); font-size:clamp(18px,4.8vw,26px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#69f0ae,#ffd700);
      color:#1b5e20; font-weight:bold; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 20px rgba(105,240,174,.4); touch-action:manipulation;
    }

    /* Win overlay */
    #win-overlay {
      position:fixed; inset:0; background:linear-gradient(160deg,#1b5e20 0%,#1a237e 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      z-index:100; opacity:0; pointer-events:none; transition:opacity .4s;
    }
    #win-overlay.show { opacity:1; pointer-events:all; }
    #win-icon  { font-size:clamp(72px,18vw,110px); animation:winBob 1.2s ease-in-out infinite; }
    @keyframes winBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    #win-title { font-size:clamp(26px,7vw,46px); color:#ffd700; text-shadow:0 0 24px rgba(255,215,0,.7); text-align:center; padding:0 20px; }
    #win-sub   { font-size:clamp(15px,4vw,22px); color:rgba(255,255,255,.9); text-align:center; }
    #win-btn {
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px); font-size:clamp(18px,4.8vw,26px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#69f0ae,#e040fb);
      color:#fff; font-weight:bold; cursor:pointer; font-family:inherit;
      box-shadow:0 4px 22px rgba(105,240,174,.4); touch-action:manipulation;
    }

    .confetti { position:fixed; pointer-events:none; z-index:101; border-radius:3px; animation:cfFall linear forwards; }
    @keyframes cfFall { 0%{top:-20px;opacity:1;transform:rotate(0deg)} 100%{top:110vh;opacity:.2;transform:rotate(720deg)} }
  </style>
</head>
<body>

  <div id="header">
    <div id="tier-badge" class="tier-easy">🌱 Easy</div>
    <div id="round-label">1 / 9</div>
    <div id="score-label"></div>
  </div>
  <div id="progress-wrap"><div id="progress-track"><div id="progress-fill"></div></div></div>

  <div id="prompt-wrap"><div id="prompt-text">Tap the LEAF! 🍃</div></div>

  <div id="plant-wrap">
    <svg id="plant-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- soil -->
      <ellipse cx="100" cy="168" rx="70" ry="16" fill="#5d4037" opacity=".7"/>
      <rect x="40" y="164" width="120" height="22" rx="6" fill="#4e342e" opacity=".6"/>
      <!-- roots -->
      <path d="M100 164 Q80 175 65 185" stroke="#795548" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M100 164 Q120 178 135 186" stroke="#795548" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M100 164 Q95 180 90 190" stroke="#795548" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- stem -->
      <path d="M100 164 Q97 130 100 80" stroke="#388e3c" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- leaves -->
      <ellipse cx="75" cy="120" rx="26" ry="13" fill="#66bb6a" transform="rotate(-30 75 120)"/>
      <ellipse cx="125" cy="105" rx="26" ry="13" fill="#4caf50" transform="rotate(30 125 105)"/>
      <!-- flower -->
      <circle cx="100" cy="58" r="18" fill="#f48fb1"/>
      <circle cx="100" cy="58" r="10" fill="#ffd700"/>
      <ellipse cx="100" cy="38" rx="8" ry="12" fill="#f48fb1"/>
      <ellipse cx="100" cy="78" rx="8" ry="12" fill="#f48fb1"/>
      <ellipse cx="80" cy="58" rx="12" ry="8" fill="#f48fb1"/>
      <ellipse cx="120" cy="58" rx="12" ry="8" fill="#f48fb1"/>
      <!-- fruit - small red apples on sides -->
      <circle cx="70" cy="138" r="9" fill="#e53935"/>
      <path d="M70 130 Q72 126 75 128" stroke="#388e3c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="130" cy="128" r="9" fill="#e53935"/>
      <path d="M130 120 Q132 116 135 118" stroke="#388e3c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- seed in soil -->
      <ellipse cx="100" cy="170" rx="9" ry="6" fill="#a1887f"/>
      <path d="M100 165 Q102 162 105 163" stroke="#8d6e63" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="choices-row"></div>

  <!-- Celebrate overlay -->
  <div id="cel-overlay">
    <div id="cel-icon">🌸</div>
    <div id="cel-msg">Amazing! 🌟</div>
    <div id="cel-name">That's the Leaf!</div>
    <div id="cel-fact">Leaves catch sunlight to make food for the plant!</div>
    <button id="cel-btn">Next Plant ➡️</button>
  </div>

  <!-- Tier overlay -->
  <div id="tier-overlay">
    <div id="to-icon">🌸</div>
    <div id="to-title">Growing Up! 🌱</div>
    <div id="to-sub">Ready to learn more plant parts?</div>
    <button id="to-btn">Keep growing! ➡️</button>
  </div>

  <!-- Win overlay -->
  <div id="win-overlay">
    <div id="win-icon">🌷</div>
    <div id="win-title">Royal Gardener! 🌷✨</div>
    <div id="win-sub">You know all the plant parts!</div>
    <button id="win-btn">Play Again 🌱</button>
  </div>

<script>
  // ── Audio ────────────────────────────────────────────────
  let audioCtx = null;
  function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function tone(f, type, d, v=.18) {
    try {
      const c=getAudio(), o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination); o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(v, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime+d);
      o.start(); o.stop(c.currentTime+d);
    } catch(e) {}
  }
  function playCorrect()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.18,.22),i*65)); }
  function playWrong()    { tone(280,'sawtooth',.16,.13); setTimeout(()=>tone(240,'sawtooth',.14,.1),160); }
  function playTierUp()   { [392,494,587,784,988].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.28,.18),i*85)); }
  function playWin()      { [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.32,.22),i*90)); }

  // ── Plant parts ──────────────────────────────────────────
  const PARTS = {
    seed:   {
      e:'🌰', n:'Seed',
      bg:'linear-gradient(135deg,#bcaaa4,#6d4c41)',
      prompts:['Tap the SEED! 🌰','Where does the plant BEGIN? 🌰','Find the tiny sleeping SEED! 🌰','Which one grows into a plant? 🌰','Tap the little SEED! 🌰'],
      facts:['A seed holds a tiny sleeping plant inside!','Seeds need water and sunshine to wake up and grow!','Seeds can travel by wind, water, or on animals!'],
    },
    root:   {
      e:'🥕', n:'Root',
      bg:'linear-gradient(135deg,#ffcc80,#bf360c)',
      prompts:['Tap the ROOT! 🥕','Which part drinks water underground? 🥕','Find the ROOT that hides in the soil! 🥕','Roots go DOWN — tap them! 🥕','Which part holds the plant in the ground? 🥕'],
      facts:['Roots drink water from the soil for the plant!','Roots keep the plant from falling over in the wind!','Carrots and potatoes are roots we love to eat!'],
    },
    stem:   {
      e:'🌿', n:'Stem',
      bg:'linear-gradient(135deg,#c8e6c9,#2e7d32)',
      prompts:['Tap the STEM! 🌿','Which part holds the plant up TALL? 🌿','Find the long STEM! 🌿','The stem carries food and water — tap it! 🌿','Which part is like a plant\'s straw? 🌿'],
      facts:['The stem carries water from the roots to the leaves!','Stems hold the plant up so it can reach the sun!','Tree trunks are thick stems!'],
    },
    leaf:   {
      e:'🍃', n:'Leaf',
      bg:'linear-gradient(135deg,#dcedc8,#558b2f)',
      prompts:['Tap the LEAF! 🍃','Which part catches SUNSHINE? 🍃','Find the green LEAF! 🍃','Leaves make food for the plant — tap one! 🍃','Which part is flat and green? 🍃'],
      facts:['Leaves catch sunlight to make food for the plant!','Leaves breathe in air that helps plants grow!','Leaves can be round, long, spiky or heart-shaped!'],
    },
    flower: {
      e:'🌸', n:'Flower',
      bg:'linear-gradient(135deg,#fce4ec,#c2185b)',
      prompts:['Tap the FLOWER! 🌸','Which part smells SO pretty? 🌸','Find the beautiful FLOWER! 🌸','Flowers make seeds — tap the flower! 🌸','Which pretty part do bees love? 🌸'],
      facts:['Flowers make seeds so new plants can grow!','Flowers attract bees and butterflies with their smell!','Flowers come in every colour of the rainbow!'],
    },
    fruit:  {
      e:'🍎', n:'Fruit',
      bg:'linear-gradient(135deg,#ffcdd2,#c62828)',
      prompts:['Tap the FRUIT! 🍎','Which part is YUMMY to eat? 🍎','Find the delicious FRUIT! 🍎','Fruits have seeds inside — tap the fruit! 🍎','Which part do we love to eat? 🍎'],
      facts:['Fruits have seeds inside to grow new plants!','We eat many fruits — apples, grapes, bananas and more!','Fruits are a plant\'s way of spreading seeds far away!'],
    },
  };

  // Tiers: which parts appear as correct answers (wrong choices come from other parts)
  const TIERS = [
    {
      label:'🌱 Easy', cls:'tier-easy',
      icon:'🌱', title:'Growing nicely! 🌱', sub:'You know Seed, Leaf and Flower — now learn the rest!',
      pool:['seed','leaf','flower'], choices:3,
    },
    {
      label:'🌿 Medium', cls:'tier-medium',
      icon:'🌿', title:'Blooming! 🌿', sub:'Now let\'s try Root, Stem and Fruit — the trickier parts!',
      pool:['root','stem','fruit'], choices:3,
    },
    {
      label:'🌸 Hard', cls:'tier-hard',
      icon:'🌸', title:'Royal Gardener! 🌸', sub:'You know ALL the plant parts — amazing!',
      pool:['seed','root','stem','leaf','flower','fruit'], choices:4,
    },
  ];

  const CEL_MSGS = ['Amazing! 🌟', 'Brilliant! 💫', 'You got it! 👑', 'Wonderful! 🌈', 'Perfect! ✨', 'Yes! 🎉', 'Super! 🌺'];

  const TOTAL = 9;
  let round = 0, score = 0, locked = false;
  let curAnswer = '', curPool = [];

  // ── Shuffle & pick ───────────────────────────────────────
  function shuffle(a) {
    const b=[...a];
    for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
    return b;
  }
  function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

  // ── HUD ──────────────────────────────────────────────────
  function updateHUD() {
    const tIdx = Math.floor(round / 3);
    const tier = TIERS[tIdx];
    const badge = document.getElementById('tier-badge');
    badge.textContent = tier.label; badge.className = 'tier-badge ' + tier.cls;
    document.getElementById('round-label').textContent = (round+1) + ' / ' + TOTAL;
    document.getElementById('progress-fill').style.width = (round / TOTAL * 100) + '%';
    document.getElementById('score-label').textContent = score > 0 ? '⭐'.repeat(Math.min(score,9)) : '';
  }

  // ── Build round ──────────────────────────────────────────
  function showRound() {
    locked = false;
    if (round >= TOTAL) { endGame(); return; }
    updateHUD();

    const tIdx = Math.floor(round / 3);
    const tier = TIERS[tIdx];

    // Pick correct answer from tier pool
    curAnswer = pick(tier.pool);

    // Build distractor pool: all part keys except correct
    const allKeys = Object.keys(PARTS);
    const distractors = shuffle(allKeys.filter(k => k !== curAnswer));
    const numWrong = tier.choices - 1;
    const wrongKeys = distractors.slice(0, numWrong);

    curPool = shuffle([curAnswer, ...wrongKeys]);

    // Prompt
    const part = PARTS[curAnswer];
    document.getElementById('prompt-text').textContent = pick(part.prompts);

    buildChoices();
  }

  function buildChoices() {
    const row = document.getElementById('choices-row');
    row.innerHTML = '';
    curPool.forEach(key => {
      const p = PARTS[key];
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.background = p.bg;
      btn.innerHTML = `<span class="cb-emoji">${p.e}</span><span class="cb-name">${p.n}</span>`;
      btn.addEventListener('pointerdown', () => handleTap(btn, key));
      row.appendChild(btn);
    });
  }

  // ── Tap handler ──────────────────────────────────────────
  function handleTap(btn, key) {
    if (locked) return;
    if (key === curAnswer) {
      locked = true;
      score++;
      btn.classList.add('correct');
      playCorrect();
      sparkleBurst(btn);
      updateHUD();
      setTimeout(() => showCelebrate(), 500);
    } else {
      btn.classList.add('wrong');
      playWrong();
      setTimeout(() => btn.classList.remove('wrong'), 450);
    }
  }

  // ── Celebrate ────────────────────────────────────────────
  function showCelebrate() {
    const p = PARTS[curAnswer];
    document.getElementById('cel-icon').textContent = p.e;
    document.getElementById('cel-msg').textContent  = pick(CEL_MSGS);
    document.getElementById('cel-name').textContent = 'That\'s the ' + p.n + '!';
    document.getElementById('cel-fact').textContent = pick(p.facts);
    document.getElementById('cel-overlay').classList.add('show');
    confetti(28);
  }

  document.getElementById('cel-btn').addEventListener('pointerdown', () => {
    document.getElementById('cel-overlay').classList.remove('show');
    advanceRound();
  });

  // ── Advance round ────────────────────────────────────────
  function advanceRound() {
    const prevTier = Math.floor(round / 3);
    round++;
    if (round >= TOTAL) { endGame(); return; }
    const newTier = Math.floor(round / 3);
    if (newTier !== prevTier) {
      showTierOverlay(prevTier);
    } else {
      showRound();
    }
  }

  function showTierOverlay(prevTier) {
    const t = TIERS[prevTier];
    document.getElementById('to-icon').textContent  = t.icon;
    document.getElementById('to-title').textContent = t.title;
    document.getElementById('to-sub').textContent   = t.sub;
    document.getElementById('tier-overlay').classList.add('show');
    playTierUp();
    confetti(42);
  }

  document.getElementById('to-btn').addEventListener('pointerdown', () => {
    document.getElementById('tier-overlay').classList.remove('show');
    showRound();
  });

  // ── End game ─────────────────────────────────────────────
  function endGame() {
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('win-sub').textContent = score + ' / 9 ⭐  You know all 6 plant parts!';
    document.getElementById('win-overlay').classList.add('show');
    playWin();
    confetti(60);
    setTimeout(() => confetti(40), 700);
  }

  document.getElementById('win-btn').addEventListener('pointerdown', () => {
    document.getElementById('win-overlay').classList.remove('show');
    round = 0; score = 0;
    showRound();
  });

  // ── Particles ────────────────────────────────────────────
  function sparkleBurst(btn) {
    const r  = btn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const cols = ['#69f0ae','#ffd700','#f48fb1','#80deea','#fff','#a5d6a7'];
    const ems  = ['✨','🌸','🌿','🍃','⭐','💫','🌱','🌷','🍀','🌺','💎','🌟'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div'); el.className='sp';
      const a=Math.random()*Math.PI*2, d=30+Math.random()*80, sz=6+Math.random()*11;
      el.style.cssText=`left:${cx+Math.cos(a)*d-sz/2}px;top:${cy+Math.sin(a)*d-sz/2}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]}`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),800);
    }
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div'); el.className='sp-em';
      el.textContent = ems[i%ems.length];
      el.style.cssText=`left:${cx+(Math.random()-.5)*120}px;top:${cy+(Math.random()-.5)*100}px;animation-delay:${Math.random()*.25}s`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),1200);
    }
  }

  function confetti(n) {
    const cols=['#69f0ae','#ffd700','#f48fb1','#80deea','#a5d6a7','#fff176','#c8e6c9','#fff'];
    for (let i=0; i<n; i++) {
      const el=document.createElement('div'); el.className='confetti';
      const sz=6+Math.random()*10;
      el.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-duration:${1.4+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),3500);
    }
  }

  // ── Background floaters ──────────────────────────────────
  function makeBg() {
    const icons = ['🌸','🌿','🍃','🌱','🌷','🍀','🌺','🦋','🐝','🌻'];
    for (let i=0; i<12; i++) {
      const el=document.createElement('div'); el.className='bg-float';
      el.textContent=icons[i%icons.length];
      el.style.left=(4+Math.random()*92)+'vw';
      el.style.animationDuration=(9+Math.random()*13)+'s';
      el.style.animationDelay=-(Math.random()*13)+'s';
      document.body.appendChild(el);
    }
  }

  makeBg();
  showRound();
</script>
</body>
</html>
