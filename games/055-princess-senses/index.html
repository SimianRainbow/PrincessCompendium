<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Senses 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background:linear-gradient(160deg,#1a0533 0%,#5e1292 55%,#c2185b 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; padding-bottom:12px;
    }

    .bg-gem { position:fixed; pointer-events:none; opacity:.11;
      font-size:clamp(16px,4vw,26px); animation:floatUp linear infinite; z-index:0; }
    @keyframes floatUp { 0%{transform:translateY(110vh) rotate(0)} 100%{transform:translateY(-15vh) rotate(360deg)} }

    /* ── Header ── */
    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #tier-badge { font-size:clamp(13px,3.2vw,18px); padding:5px 14px; border-radius:20px;
      font-weight:bold; border:2px solid rgba(255,255,255,.3); transition:background .35s; }
    .tier-easy   { background:linear-gradient(135deg,#66bb6a,#2e7d32); color:#fff; }
    .tier-medium { background:linear-gradient(135deg,#ffca28,#f57f17); color:#3e2000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#6a1b9a); color:#fff; }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.9); position:relative; z-index:1; }

    /* ── Progress bar ── */
    #progress-wrap { width:100%; padding:6px clamp(14px,4vw,22px) 0; flex-shrink:0; position:relative; z-index:1; }
    #progress-track { background:rgba(255,255,255,.18); border-radius:20px; height:clamp(8px,2vw,12px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#ffd700,#e040fb);
      transition:width .35s ease; width:0%; box-shadow:0 0 8px rgba(255,215,0,.4); }

    /* ── Scene card ── */
    #scene-wrap {
      flex-shrink:0; display:flex; flex-direction:column; align-items:center;
      padding:clamp(10px,2.5vw,18px) 16px clamp(6px,1.5vw,10px);
      position:relative; z-index:1;
    }
    #scene-card {
      background:rgba(255,255,255,.95); border-radius:28px;
      padding:clamp(10px,2.5vw,18px) clamp(20px,5vw,36px);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      box-shadow:0 6px 30px rgba(0,0,0,.28), 0 0 0 3px rgba(255,215,0,.32);
    }
    #scene-card.pop { animation:cardPop .45s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cardPop { from{transform:scale(.65);opacity:0} to{transform:scale(1);opacity:1} }
    #scene-emoji { font-size:clamp(72px,18vw,110px); line-height:1.1; }
    #scene-desc  { font-size:clamp(15px,3.8vw,22px); color:#4a148c; font-weight:bold; text-align:center; }

    #prompt {
      font-size:clamp(16px,4.2vw,22px); color:#fff;
      text-align:center; padding:0 16px;
      margin-bottom:clamp(8px,2vw,12px);
      position:relative; z-index:1; text-shadow:0 1px 4px rgba(0,0,0,.4);
    }

    /* ── Sense buttons ── */
    #choices-wrap { flex:1; display:flex; align-items:center; justify-content:center;
      padding:0 clamp(12px,3vw,22px); width:100%; position:relative; z-index:1; }
    #choices { display:grid; gap:clamp(10px,2.5vw,16px); width:100%; max-width:420px; }
    #choices.cols-2 { grid-template-columns:1fr 1fr; }
    #choices.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    #choices.cols-4 { grid-template-columns:1fr 1fr; }
    #choices.cols-5 { grid-template-columns:1fr 1fr; }

    .sense-btn {
      min-height:clamp(96px,23vw,125px);
      border-radius:24px; border:3px solid rgba(255,255,255,.32);
      background:rgba(255,255,255,.15); backdrop-filter:blur(6px);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; cursor:pointer;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2);
      transition:transform .1s; touch-action:manipulation;
    }
    .sense-btn:active { transform:scale(.92); }
    .sense-emoji { font-size:clamp(38px,10vw,56px); line-height:1; pointer-events:none; }
    .sense-label { font-size:clamp(12px,3vw,17px); color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.5);
      text-align:center; pointer-events:none; }

    .sense-btn.correct { animation:correctPop .5s ease-out; background:rgba(160,255,160,.35); border-color:#66bb6a; }
    .sense-btn.wrong   { animation:wobble .45s ease-out; background:rgba(255,100,100,.25); }
    @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8)} 100%{transform:scale(1)} }
    @keyframes wobble { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-11px)} 60%{transform:translateX(11px)} 80%{transform:translateX(-6px)} }

    /* ── Sparkles ── */
    .sp { position:fixed; pointer-events:none; z-index:50; animation:sparkOut .75s ease-out forwards; }
    @keyframes sparkOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.6);opacity:0} }

    /* ── Overlays ── */
    .overlay { position:fixed; inset:0; background:rgba(20,0,50,.88);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      z-index:99; opacity:0; pointer-events:none; transition:opacity .35s; }
    .overlay.show { opacity:1; pointer-events:all; }
    .ov-emoji { font-size:clamp(60px,17vw,100px); }
    .ov-title { font-size:clamp(24px,7vw,46px); color:#ffd700; text-align:center; padding:0 20px; }
    .ov-sub   { font-size:clamp(15px,4vw,22px); color:#f8bbd0; text-align:center; padding:0 20px; opacity:.9; }
    .btn-next {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,54px); font-size:clamp(18px,5vw,26px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00; font-weight:bold; cursor:pointer; font-family:inherit;
      min-height:64px; min-width:180px; box-shadow:0 4px 18px rgba(255,180,0,.5);
      touch-action:manipulation;
    }

    .cf { position:fixed; pointer-events:none; z-index:100; border-radius:3px;
      animation:cfFall linear forwards; }
    @keyframes cfFall { 0%{top:-20px;opacity:1;transform:rotate(0)} 100%{top:110vh;opacity:.2;transform:rotate(720deg)} }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="round-label">1 / 9</div>
</div>
<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="scene-wrap">
  <div id="scene-card">
    <div id="scene-emoji">🌈</div>
    <div id="scene-desc">A beautiful rainbow!</div>
  </div>
</div>
<div id="prompt">Which sense helps you know this? 🌟</div>
<div id="choices-wrap">
  <div id="choices" class="cols-2"></div>
</div>

<div class="overlay" id="round-overlay">
  <div class="ov-emoji" id="ov-emoji">⭐</div>
  <div class="ov-title" id="ov-title">Amazing!</div>
  <div class="ov-sub"   id="ov-sub">Ready for more?</div>
  <button class="btn-next" id="round-btn">Next Round ➡️</button>
</div>

<div class="overlay" id="end-overlay">
  <div class="ov-emoji">👑</div>
  <div class="ov-title">Sense Star! 🌸</div>
  <div class="ov-sub" id="end-sub">You know all five senses! ✨</div>
  <button class="btn-next" onclick="startGame()">Play Again 🔄</button>
</div>

<script>
// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f,type,d,v){
  v=v||.16;
  try{
    const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
    o.start(); o.stop(c.currentTime+d);
  }catch(e){}
}
function playCorrect()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.18,.2),i*70)); }
function playWrong()    { tone(260,'sawtooth',.18,.13); setTimeout(()=>tone(210,'sawtooth',.14,.1),160); }
function playTierUp()   { [523,659,784,880,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.28,.2),i*90)); }
function playFinalWin() { [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.32,.22),i*95)); }

// ── Senses dictionary ─────────────────────────────────────────────────────────
const SENSES = {
  see:   { e:'👀', n:'See',   desc:'with your EYES' },
  hear:  { e:'👂', n:'Hear',  desc:'with your EARS' },
  smell: { e:'👃', n:'Smell', desc:'with your NOSE' },
  taste: { e:'👅', n:'Taste', desc:'with your MOUTH' },
  touch: { e:'🤚', n:'Touch', desc:'with your HANDS' },
};

// ── Question pool (18 questions: 6 per tier) ──────────────────────────────────
// Each: { scene, desc, correct, wrong[] }
const POOL = [
  // EASY — see vs hear (2 choices)
  { scene:'🌈', desc:'A beautiful rainbow!',      correct:'see',  wrong:['hear','smell','taste','touch'] },
  { scene:'🐦', desc:'A bird singing sweetly',    correct:'hear', wrong:['see','smell','taste','touch'] },
  { scene:'👑', desc:'A sparkly golden crown',    correct:'see',  wrong:['hear','smell','taste','touch'] },
  { scene:'🔔', desc:'Castle bells ringing!',     correct:'hear', wrong:['see','smell','taste','touch'] },
  { scene:'🦋', desc:'A pretty butterfly',        correct:'see',  wrong:['hear','smell','taste','touch'] },
  { scene:'🎶', desc:'Princess singing a song',   correct:'hear', wrong:['see','smell','taste','touch'] },
  // MEDIUM — see / hear / smell (3 choices)
  { scene:'🌸', desc:'A flower with sweet petals', correct:'smell', wrong:['see','hear','taste','touch'] },
  { scene:'⛈️', desc:'Thunder crashing loudly!',  correct:'hear',  wrong:['see','smell','taste','touch'] },
  { scene:'🦄', desc:'A magical unicorn!',         correct:'see',   wrong:['hear','smell','taste','touch'] },
  { scene:'🍞', desc:'Freshly baked warm bread',   correct:'smell', wrong:['see','hear','taste','touch'] },
  { scene:'🎵', desc:'A beautiful royal melody',   correct:'hear',  wrong:['see','smell','touch','taste'] },
  { scene:'💐', desc:'A royal bouquet of roses',   correct:'smell', wrong:['see','hear','taste','touch'] },
  // HARD — all 5 senses (4 choices shown)
  { scene:'🍓', desc:'Sweet juicy strawberries!',  correct:'taste', wrong:['see','smell','touch','hear'] },
  { scene:'🛏️', desc:'A soft fluffy pillow',       correct:'touch', wrong:['see','hear','smell','taste'] },
  { scene:'🍰', desc:'A slice of princess cake!',  correct:'taste', wrong:['smell','see','touch','hear'] },
  { scene:'🐱', desc:'Silky soft kitten fur',      correct:'touch', wrong:['see','hear','taste','smell'] },
  { scene:'🍋', desc:'A sour lemon drop candy!',   correct:'taste', wrong:['smell','see','touch','hear'] },
  { scene:'🌊', desc:'Cool ocean waves on feet',   correct:'touch', wrong:['see','hear','smell','taste'] },
];

const TIERS = [
  { label:'🌱 Easy',   cls:'tier-easy',   indices:[0,1,2,3,4,5],      choices:2 },
  { label:'🌸 Medium', cls:'tier-medium', indices:[6,7,8,9,10,11],    choices:3 },
  { label:'🌺 Hard',   cls:'tier-hard',   indices:[12,13,14,15,16,17],choices:4 },
];
const TOTAL=9;

let round=0, locked=false, currentQ=null, gameOrder=[];

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function getTierIdx(r){ return r<=3?0:r<=6?1:2; }

function startGame(){
  document.getElementById('end-overlay').classList.remove('show');
  document.getElementById('round-overlay').classList.remove('show');
  round=0; locked=false;
  gameOrder=[
    ...shuffle(TIERS[0].indices).slice(0,3),
    ...shuffle(TIERS[1].indices).slice(0,3),
    ...shuffle(TIERS[2].indices).slice(0,3),
  ];
  makeBgGems();
  nextRound();
}

function nextRound(){
  document.getElementById('round-overlay').classList.remove('show');
  if(round>=TOTAL){ endGame(); return; }
  round++; locked=false;
  updateHUD();

  const qIdx=gameOrder[round-1];
  currentQ=POOL[qIdx];
  const tierIdx=getTierIdx(round);
  const tier=TIERS[tierIdx];

  // Scene card
  const card=document.getElementById('scene-card');
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.add('pop');
  document.getElementById('scene-emoji').textContent=currentQ.scene;
  document.getElementById('scene-desc').textContent=currentQ.desc;

  // Build choices: correct sense + (tier.choices-1) random wrong senses
  const wrongPool=shuffle(currentQ.wrong).slice(0,tier.choices-1);
  const allKeys=shuffle([currentQ.correct,...wrongPool]);

  const grid=document.getElementById('choices');
  grid.className='cols-'+tier.choices;
  grid.innerHTML='';
  allKeys.forEach(key=>{
    const s=SENSES[key];
    const btn=document.createElement('button');
    btn.className='sense-btn';
    btn.innerHTML='<span class="sense-emoji">'+s.e+'</span><span class="sense-label">'+s.n+'</span>';
    btn.addEventListener('pointerdown',()=>handleTap(btn,key===currentQ.correct,key));
    grid.appendChild(btn);
  });
}

function handleTap(btn,ok,chosenKey){
  if(locked) return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true;
    btn.classList.add('correct');
    playCorrect();
    const r=btn.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
    setTimeout(()=>{ btn.classList.remove('correct'); showRoundOverlay(); },550);
  } else {
    btn.classList.add('wrong');
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),450);
  }
}

function showRoundOverlay(){
  const tierIdx=getTierIdx(round);
  const nextTierIdx=getTierIdx(round+1);
  const isTierEnd=(round<TOTAL && nextTierIdx>tierIdx);

  if(isTierEnd){
    playTierUp(); confetti(42);
    const next=TIERS[nextTierIdx];
    document.getElementById('ov-emoji').textContent='🎉';
    document.getElementById('ov-title').textContent='Level up! ✨';
    document.getElementById('ov-sub').textContent=next.label+' starts — new senses to discover!';
  } else {
    const correct=SENSES[currentQ.correct];
    const msgs=['Amazing! 🌟','You got it! 👑','Brilliant! ✨','Yes! 💎','Wonderful! 🌸','Perfect! 🎀'];
    document.getElementById('ov-emoji').textContent=correct.e;
    document.getElementById('ov-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('ov-sub').textContent='You '+correct.n.toLowerCase()+' it '+correct.desc+'! 🌟';
  }

  document.getElementById('round-btn').onclick=nextRound;
  document.getElementById('round-overlay').classList.add('show');
}

function endGame(){
  document.getElementById('end-overlay').classList.add('show');
  playFinalWin(); confetti(60); setTimeout(()=>confetti(42),700);
}

function updateHUD(){
  const tierIdx=getTierIdx(round);
  const tier=TIERS[tierIdx];
  const badge=document.getElementById('tier-badge');
  badge.textContent=tier.label; badge.className=tier.cls;
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';
}

// ── Particles ─────────────────────────────────────────────────────────────────
function burst(cx,cy){
  const cols=['#ffd700','#f48fb1','#fff','#ce93d8','#e040fb','#80deea'];
  const icons=['✨','💫','⭐','🌟','👀','👂','👃','👅','🤚'];
  for(let i=0;i<18;i++){
    const el=document.createElement('div'); el.className='sp';
    const a=Math.random()*Math.PI*2, dist=30+Math.random()*80, sz=7+Math.random()*10;
    if(i<5){
      el.style.cssText='left:'+(cx+Math.cos(a)*dist)+'px;top:'+(cy+Math.sin(a)*dist)+'px;font-size:'+(18+Math.random()*10)+'px;background:none;border-radius:0;';
      el.textContent=icons[i%icons.length];
    } else {
      el.style.cssText='left:'+(cx+Math.cos(a)*dist-sz/2)+'px;top:'+(cy+Math.sin(a)*dist-sz/2)+'px;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';border-radius:50%;';
    }
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }
}

function confetti(count){
  const cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b2ebf2','#a5d6a7','#ff8a65'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='cf';
    const sz=6+Math.random()*10;
    el.style.cssText='left:'+Math.random()*100+'vw;top:-20px;width:'+sz+'px;height:'+sz+'px;background:'+cols[i%cols.length]+';animation-duration:'+(1.4+Math.random()*2)+'s;animation-delay:'+Math.random()*.5+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}

function makeBgGems(){
  document.querySelectorAll('.bg-gem').forEach(e=>e.remove());
  const icons=['👀','👂','👃','👅','🤚','✨','💫','🌸','⭐','🌟'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div'); el.className='bg-gem';
    el.textContent=icons[i%icons.length];
    el.style.left=(4+Math.random()*92)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*14)+'s';
    document.body.appendChild(el);
  }
}

startGame();
</script>
</body>
</html>
