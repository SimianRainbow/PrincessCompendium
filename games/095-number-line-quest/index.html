<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Number Line Quest ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#0d003a 0%,#2d006b 45%,#001a50 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-float{position:fixed;pointer-events:none;opacity:.08;font-size:clamp(16px,4vw,26px);animation:bgFloat linear infinite;z-index:0;}
    @keyframes bgFloat{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}

    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;font-weight:bold;border:2px solid rgba(255,255,255,.35);}
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);color:#fff;}
    #score-label{font-size:clamp(14px,3.5vw,19px);color:#ffd700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.5);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(255,255,255,.85);}

    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);
      border-radius:99px;transition:width .4s ease;width:0%;
      box-shadow:0 0 8px rgba(255,215,0,.45);
    }

    #prompt{
      font-size:clamp(17px,4.5vw,26px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
      text-align:center;padding:clamp(8px,2vw,14px) 20px 0;
      flex-shrink:0;position:relative;z-index:1;line-height:1.2;
    }

    /* Number line */
    #number-line-wrap{
      display:flex;align-items:center;justify-content:center;
      padding:clamp(10px,3vw,20px) clamp(12px,3vw,20px) 0;
      position:relative;z-index:1;flex-shrink:0;
      width:100%;max-width:500px;
    }
    #number-line{
      display:flex;align-items:center;justify-content:center;
      gap:0;
      background:rgba(255,255,255,.07);
      border-radius:24px;border:2px solid rgba(255,215,0,.3);
      padding:clamp(10px,2.5vw,18px) clamp(14px,3.5vw,22px);
      box-shadow:0 6px 24px rgba(0,0,0,.35);
    }
    .nl-box{
      width:clamp(48px,13vw,66px);
      height:clamp(48px,13vw,66px);
      border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(20px,5.5vw,30px);
      flex-shrink:0;
    }
    .nl-box.filled{
      background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
      border:2px solid rgba(255,215,0,.45);
      color:#fff;
      box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);
    }
    .nl-box.missing{
      background:rgba(255,215,0,.12);
      border:3px dashed rgba(255,215,0,.8);
      color:#ffd700;
      font-size:clamp(22px,6vw,32px);
      animation:missingPulse 1.3s ease-in-out infinite;
    }
    @keyframes missingPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0);}
      50%{box-shadow:0 0 18px 5px rgba(255,215,0,.35);}
    }
    .nl-connector{
      width:clamp(6px,2vw,14px);
      height:3px;
      background:rgba(255,215,0,.3);
      flex-shrink:0;
      border-radius:2px;
    }

    /* Choices */
    #choices{
      display:flex;gap:clamp(8px,2vw,14px);
      justify-content:center;
      padding:clamp(10px,2.5vw,16px) clamp(12px,3vw,20px);
      width:100%;max-width:460px;flex-wrap:wrap;
      position:relative;z-index:1;
    }
    .choice-btn{
      min-width:clamp(76px,19vw,104px);
      min-height:clamp(90px,22vw,110px);
      border-radius:20px;
      border:3px solid rgba(255,215,0,.35);
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:clamp(28px,8vw,46px);
      font-family:inherit;
      cursor:pointer;
      touch-action:manipulation;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.18);
      transition:transform .1s;
    }
    .choice-btn:active{transform:scale(.91);}
    .choice-btn.correct{border-color:#ffd700;background:rgba(255,215,0,.22);animation:correctPop .5s ease-out;}
    .choice-btn.wrong  {animation:wobble .45s ease-out;border-color:rgba(255,80,80,.7);}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.13);box-shadow:0 0 40px rgba(255,215,0,.8)}100%{transform:scale(1)}}
    @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}60%{transform:translateX(12px)}80%{transform:translateX(-6px)}}

    /* Sparkles */
    .sp{position:fixed;pointer-events:none;z-index:50;animation:spOut .75s ease-out forwards;}
    @keyframes spOut{0%{transform:scale(0);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .sp-dot{position:fixed;pointer-events:none;z-index:50;border-radius:50%;animation:dotFly .8s ease-out forwards;}
    @keyframes dotFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0}}

    /* Overlays */
    .overlay{
      position:fixed;inset:0;z-index:99;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(10px,2.5vw,16px);opacity:0;pointer-events:none;transition:opacity .3s;
      padding:20px;
    }
    .overlay.show{opacity:1;pointer-events:all;}
    .ov-emoji{font-size:clamp(60px,15vw,90px);line-height:1;}
    .ov-title{font-size:clamp(22px,6vw,40px);color:#ffd700;text-align:center;text-shadow:0 0 20px rgba(255,215,0,.6);}
    .ov-sub  {font-size:clamp(14px,3.8vw,22px);color:#f8bbd0;text-align:center;max-width:320px;line-height:1.3;}
    .ov-seq  {font-size:clamp(18px,5vw,28px);color:#ffd700;text-align:center;letter-spacing:2px;font-weight:bold;}
    .ov-fact {font-size:clamp(13px,3.2vw,18px);color:#b3e5fc;text-align:center;max-width:340px;line-height:1.4;}
    .ov-btn{
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,5vw,26px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00;font-weight:bold;cursor:pointer;font-family:inherit;
      min-height:64px;min-width:180px;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;
    }
    #tier-overlay{background:rgba(0,0,0,.78);}
    #cel-overlay {background:rgba(0,0,0,.75);}
    #win-overlay {background:linear-gradient(160deg,#0d003a 0%,#2d006b 50%,#001a50 100%);}
    #win-crown   {font-size:clamp(72px,18vw,110px);animation:crowBounce 1.1s ease-in-out infinite;}
    @keyframes crowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    #win-title{font-size:clamp(26px,7vw,44px);color:#ffd700;text-shadow:0 0 24px #ff9800;text-align:center;}
    #win-score{font-size:clamp(18px,5vw,30px);color:#ffd700;font-weight:bold;text-align:center;}

    .cf{position:fixed;pointer-events:none;z-index:101;border-radius:3px;animation:cfFall linear forwards;}
    @keyframes cfFall{0%{top:-20px;opacity:1;transform:rotate(0)}100%{top:110vh;opacity:.2;transform:rotate(var(--cr,360deg))}}
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-label">⭐ 0</div>
  <div id="round-label">1 / 12</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="prompt">Which number is hiding? ✨</div>

<div id="number-line-wrap">
  <div id="number-line"></div>
</div>

<div id="choices"></div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="to-emoji">✨</div>
  <div class="ov-title" id="to-title">Level Up!</div>
  <div class="ov-sub"   id="to-sub">Bigger numbers ahead!</div>
  <button class="ov-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
</div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji">👑</div>
  <div class="ov-title" id="cel-title">That's right!</div>
  <div class="ov-seq"   id="cel-seq"></div>
  <div class="ov-fact"  id="cel-fact"></div>
  <button class="ov-btn" onclick="nextRound()">Next ➡️</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div id="win-crown">👑</div>
  <div id="win-title">Number Line Princess! 🔢</div>
  <div class="ov-sub">You can read the number line! ✨</div>
  <div id="win-score">⭐ 0 / 12</div>
  <button class="ov-btn" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
'use strict';

var audioCtx = null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,type,dur,vol,del){
  del=del||0;vol=vol||0.15;
  try{
    var c=getAudio(),t0=c.currentTime+del;
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function playCorrect(){[523,659,784,1047].forEach(function(f,i){tone(f,'sine',0.18,0.18,i*0.07);});}
function playWrong()  {tone(260,'sawtooth',0.18,0.12);setTimeout(function(){tone(210,'sawtooth',0.14,0.09);},160);}
function playCelebrate(){[523,587,659,698,784,880,1047].forEach(function(f,i){tone(f,'sine',0.22,0.17,i*0.065);});}
function playTierUp() {[392,494,587,784,1047].forEach(function(f,i){tone(f,'triangle',0.25,0.18,i*0.09);});}
function playWin()    {[523,659,784,1047,784,1047,1319,1047,1319,1568].forEach(function(f,i){tone(f,'sine',0.3,0.2,i*0.09);});}

// ── Game data ─────────────────────────────────────────────────────────────────
// nums: array of 5 numbers where null = the missing number
// choices: how many answer buttons to show

var ROUNDS_EASY = [
  {nums:[null,2,3,4,5], answer:1, fact:'1 is the very first number — every count begins here! 🌟'},
  {nums:[1,null,3,4,5], answer:2, fact:'2 is a pair! Two eyes, two hands — 2 is lovely! 👑'},
  {nums:[1,2,null,4,5], answer:3, fact:'3 is magic — like morning, noon and night! ✨'},
  {nums:[1,2,3,null,5], answer:4, fact:'4 makes a square — four sides, four corners! 💎'},
  {nums:[1,2,3,4,null], answer:5, fact:'5 is a whole hand of fingers! Give me five! 🌸'},
  {nums:[2,null,4,5,6], answer:3, fact:'3 fits right between 2 and 4 on the line! 👑'},
  {nums:[3,4,null,6,7], answer:5, fact:'5 high-fives! Five fingers on one hand! ✨'},
  {nums:[4,5,null,7,8], answer:6, fact:'6 is a half-dozen — like six eggs in a carton! 💫'},
];

var ROUNDS_MEDIUM = [
  {nums:[5,null,7,8,9], answer:6, fact:'6 sits right between 5 and 7 on the number line! 👑'},
  {nums:[6,7,null,9,10], answer:8, fact:'8 is two groups of four — count on from 7! ✨'},
  {nums:[3,null,5,6,7], answer:4, fact:'4 comes right after 3 — just one more step! 🌟'},
  {nums:[4,5,null,7,8], answer:6, fact:'6 is two threes added together — 3+3=6! 💎'},
  {nums:[7,null,9,10,11], answer:8, fact:'8 is after 7 and before 9 — keep counting! 🌸'},
  {nums:[2,3,null,5,6], answer:4, fact:'4 fits between 3 and 5 — always one more! 👑'},
  {nums:[null,6,7,8,9], answer:5, fact:'5 starts the second half of our counting! ✨'},
  {nums:[8,null,10,11,12], answer:9, fact:'9 is just one less than ten — almost at ten! 💫'},
];

var ROUNDS_HARD = [
  {nums:[null,12,13,14,15], answer:11, fact:'11 is ten and one more — the very first teen! 👑'},
  {nums:[10,11,null,13,14], answer:12, fact:'12 makes a dozen — 12 eggs, 12 months in a year! 💎'},
  {nums:[13,null,15,16,17], answer:14, fact:'14 is ten plus four — count on four from ten! ✨'},
  {nums:[15,16,null,18,19], answer:17, fact:'17 is ten plus seven — a teen number! 🌟'},
  {nums:[11,12,13,null,15], answer:14, fact:'14 fits right between 13 and 15! 🌸'},
  {nums:[null,14,15,16,17], answer:13, fact:'13 is ten plus three — just past a dozen! 👑'},
  {nums:[16,17,null,19,20], answer:18, fact:'18 is two nines — or ten plus eight! ✨'},
  {nums:[12,null,14,15,16], answer:13, fact:'13 — a baker\'s dozen has thirteen! 💫'},
];

var TIER_DATA = [
  {label:'🌱 Easy',  cls:'tier-easy',  pool:ROUNDS_EASY,  choices:2,
   toIcon:'🌸',toTitle:'Moving to Medium!',toSub:'Bigger numbers on the line now! 👑'},
  {label:'🌸 Medium',cls:'tier-medium',pool:ROUNDS_MEDIUM,choices:3,
   toIcon:'⭐',toTitle:'Almost there!',   toSub:'Three choices — look carefully at the line! 💎'},
  {label:'⭐ Hard',  cls:'tier-hard',  pool:ROUNDS_HARD,  choices:4},
];

var PROMPTS = [
  'Which number is hiding? ✨',
  'Find the missing number! 👑',
  'What number goes here? 🌟',
  'Help the princess find the missing gem! 💎',
  'Which number fits on the line? 🌸',
];

var TOTAL = 12;

var round=0, score=0, locked=false, roundPlan=[], promptIdx=0;

function getTierIdx(r){return r<=4?0:r<=8?1:2;}

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function buildPlan(){
  var plan=[];
  TIER_DATA.forEach(function(td){
    shuffle(td.pool).slice(0,4).forEach(function(r){plan.push(r);});
  });
  return plan;
}

(function(){
  var icons=['🔢','✨','⭐','👑','💫','🌟','💎','🌸','🔢','✨','👑','⭐','💫','🌟','💎','🌸','🔢'];
  for(var i=0;i<16;i++){
    var el=document.createElement('div');el.className='bg-float';
    el.textContent=icons[i%icons.length];
    el.style.left=(3+Math.random()*94)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*20)+'s';
    document.body.appendChild(el);
  }
})();

function renderNumberLine(nums){
  var nl=document.getElementById('number-line');
  nl.innerHTML='';
  nums.forEach(function(n,i){
    if(i>0){
      var conn=document.createElement('div');conn.className='nl-connector';
      nl.appendChild(conn);
    }
    var box=document.createElement('div');
    if(n===null){
      box.className='nl-box missing';
      box.textContent='✨';
    }else{
      box.className='nl-box filled';
      box.textContent=n;
    }
    nl.appendChild(box);
  });
}

function startGame(){
  ['win-overlay','cel-overlay','tier-overlay'].forEach(function(id){
    document.getElementById(id).classList.remove('show');
  });
  round=0;score=0;locked=false;promptIdx=0;
  document.getElementById('progress-fill').style.width='0%';
  roundPlan=buildPlan();
  nextRound();
}

function nextRound(){
  document.getElementById('cel-overlay').classList.remove('show');
  if(round>=TOTAL){endGame();return;}
  var prevTier=getTierIdx(round);
  round++;locked=false;
  var curTier=getTierIdx(round);
  updateHUD();
  if(round>1&&curTier!==prevTier){
    showTierOverlay(curTier);
  }else{
    showQuestion();
  }
}

function resumeFromTier(){
  document.getElementById('tier-overlay').classList.remove('show');
  showQuestion();
}

function updateHUD(){
  var tIdx=getTierIdx(round);
  var ti=TIER_DATA[tIdx];
  var badge=document.getElementById('tier-badge');
  badge.textContent=ti.label;badge.className='';badge.className=ti.cls;
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';
  if(round%2===0)promptIdx=(promptIdx+1)%PROMPTS.length;
  document.getElementById('prompt').textContent=PROMPTS[promptIdx];
}

function showTierOverlay(tIdx){
  var prev=TIER_DATA[tIdx-1];
  document.getElementById('to-emoji').textContent=prev.toIcon;
  document.getElementById('to-title').textContent=prev.toTitle;
  document.getElementById('to-sub').textContent=prev.toSub;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();confetti(42);
}

function showQuestion(){
  var rd=roundPlan[round-1];
  var tIdx=getTierIdx(round);
  var numChoices=TIER_DATA[tIdx].choices;
  var answer=rd.answer;
  var shown=rd.nums.filter(function(n){return n!==null;});

  renderNumberLine(rd.nums);

  // Build wrong answers: adjacent numbers not already shown in line
  var candidates=[];
  for(var d=1;d<=5;d++){
    var lo=answer-d, hi=answer+d;
    if(lo>=0&&shown.indexOf(lo)===-1&&candidates.indexOf(lo)===-1)candidates.push(lo);
    if(hi<=25&&shown.indexOf(hi)===-1&&candidates.indexOf(hi)===-1)candidates.push(hi);
  }
  var wrongChoices=shuffle(candidates).slice(0,numChoices-1);
  var opts=shuffle([answer].concat(wrongChoices));

  var choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  opts.forEach(function(num){
    var btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=num;
    var isCorrect=(num===answer);
    (function(b,ok){
      b.addEventListener('pointerdown',function(){handleTap(b,ok,answer,rd);});
    })(btn,isCorrect);
    choicesEl.appendChild(btn);
  });
}

function handleTap(btn,ok,answer,rd){
  if(locked)return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true;score++;
    btn.classList.add('correct');
    playCorrect();
    var r=btn.getBoundingClientRect();
    sparkleBurst(r.left+r.width/2,r.top+r.height/2);
    setTimeout(function(){showCelebrate(answer,rd);},550);
  }else{
    btn.classList.add('wrong');
    playWrong();
    setTimeout(function(){btn.classList.remove('wrong');},460);
  }
}

function showCelebrate(answer,rd){
  var msgs=['Amazing! 🌟','You got it! 👑','Brilliant! ✨','Superstar! ⭐','Perfect! 💎'];
  document.getElementById('cel-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];

  // Build sequence display: show the answer slot filled in
  var gapIdx=rd.nums.indexOf(null);
  var prev=gapIdx>0?rd.nums[gapIdx-1]:null;
  var nxt=gapIdx<rd.nums.length-1?rd.nums[gapIdx+1]:null;
  var seq='';
  if(prev!==null&&nxt!==null){seq=prev+' → '+answer+' → '+nxt;}
  else if(prev!==null)       {seq=prev+' → '+answer;}
  else                       {seq=answer+' → '+nxt;}
  document.getElementById('cel-seq').textContent=seq+' ✨';
  document.getElementById('cel-fact').textContent=rd.fact;

  document.getElementById('cel-overlay').classList.add('show');
  playCelebrate();confetti(28);
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('progress-fill').style.width=(round/TOTAL*100)+'%';
}

function endGame(){
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('win-score').textContent='⭐ '+score+' / '+TOTAL;
  document.getElementById('win-overlay').classList.add('show');
  playWin();confetti(60);setTimeout(function(){confetti(40);},700);
}

function sparkleBurst(cx,cy){
  var ems=['✨','💫','👑','⭐','💎','🌟','🔢','🌸'];
  var cols=['#ffd700','#f48fb1','#fff','#ce93d8','#80deea','#ffab91'];
  for(var i=0;i<26;i++){
    var el=document.createElement('div');el.className='sp';
    el.textContent=ems[i%ems.length];
    el.style.cssText='font-size:'+(16+Math.random()*14)+'px;left:'+(cx+(Math.random()-.5)*140)+'px;top:'+(cy+(Math.random()-.5)*120)+'px;animation-delay:'+(Math.random()*.15)+'s;';
    document.body.appendChild(el);
    setTimeout((function(e){return function(){e.remove();};})(el),900);
  }
  for(var j=0;j<22;j++){
    var dot=document.createElement('div');dot.className='sp-dot';
    var a=Math.random()*Math.PI*2,dist=30+Math.random()*90,sz=5+Math.random()*10;
    dot.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;background:'+cols[j%cols.length]+';--tx:'+(Math.cos(a)*dist)+'px;--ty:'+(Math.sin(a)*dist)+'px;';
    document.body.appendChild(dot);
    setTimeout((function(e){return function(){e.remove();};})(dot),950);
  }
}

function confetti(count){
  var cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b3e5fc','#a5d6a7','#ff8a65'];
  for(var i=0;i<count;i++){
    var el=document.createElement('div');el.className='cf';
    var sz=6+Math.random()*10,dur=1.4+Math.random()*1.8;
    el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz*(0.4+Math.random()*.7)+'px;background:'+cols[i%cols.length]+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*.5+'s;--cr:'+((Math.random()-.5)*720)+'deg;';
    document.body.appendChild(el);
    setTimeout((function(e){return function(){e.remove();};})(el),(dur+.6)*1000+200);
  }
}

startGame();
</script>
