<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Coin Kingdom 🪙</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#1a0a2e 0%,#3a0d6b 50%,#6a1b9a 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:8px;
    }

    .bg-coin{
      position:fixed;pointer-events:none;opacity:.10;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite;z-index:0;
    }
    @keyframes bgFloat{
      0%{transform:translateY(110vh) rotate(0)}
      100%{transform:translateY(-15vh) rotate(360deg)}
    }

    /* ── Header ── */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{
      font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;
      color:#fff;font-weight:bold;border:2px solid rgba(255,255,255,.38);
      transition:background .4s;
    }
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);}
    #score-display{font-size:clamp(15px,3.8vw,22px);color:#ffd700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.5);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(255,200,255,.9);position:relative;z-index:1;}

    /* ── Progress bar ── */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);
      border-radius:99px;transition:width .4s ease;width:0%;
    }

    /* ── Question card ── */
    #question-card{
      background:rgba(255,255,255,.93);border-radius:28px;
      padding:clamp(8px,2vw,14px) clamp(18px,5vw,32px);
      display:flex;flex-direction:column;align-items:center;gap:4px;
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 3px rgba(255,215,0,.3);
      margin:clamp(8px,2vw,14px) clamp(14px,4vw,22px) 0;
      position:relative;z-index:1;flex-shrink:0;
      animation:cardIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardIn{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
    #q-prompt{font-size:clamp(13px,3.3vw,19px);color:#6a1b9a;text-align:center;}
    #q-coin-name{font-size:clamp(26px,7vw,46px);color:#4a148c;font-weight:bold;letter-spacing:2px;}
    #q-hint{font-size:clamp(13px,3.2vw,17px);color:#7b1fa2;text-align:center;opacity:.85;}

    /* ── Coin grid ── */
    #coin-grid{
      display:grid;
      gap:clamp(8px,2vw,14px);
      padding:clamp(8px,2vw,14px) clamp(12px,3vw,20px);
      width:100%;max-width:480px;
      position:relative;z-index:1;flex-shrink:0;
    }
    .grid-2{grid-template-columns:repeat(2,1fr);}
    .grid-3{grid-template-columns:repeat(3,1fr);}
    .grid-4{grid-template-columns:repeat(2,1fr);}

    .coin-btn{
      min-height:clamp(100px,26vw,140px);
      border-radius:22px;border:3px solid rgba(255,255,255,.25);
      cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:6px;padding:10px 6px;
      box-shadow:0 4px 18px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.28);
      transition:transform .1s;touch-action:manipulation;
      background:rgba(255,255,255,.13);backdrop-filter:blur(4px);
    }
    .coin-btn:active{transform:scale(.9);}
    .coin-btn .btn-label{
      font-size:clamp(13px,3.2vw,18px);color:#fff;
      font-weight:bold;text-shadow:0 2px 6px rgba(0,0,0,.55);
      text-align:center;line-height:1.1;
    }
    .coin-btn .btn-value{
      font-size:clamp(11px,2.6vw,14px);color:rgba(255,240,200,.85);
      text-align:center;
    }
    .coin-btn.correct-flash{animation:correctPop .5s ease-out;border-color:#ffd700;background:rgba(255,215,0,.28);}
    @keyframes correctPop{
      0%{transform:scale(1)}
      40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8);}
      100%{transform:scale(1)}
    }
    .coin-btn.wrong-shake{animation:wrongShake .42s ease-out;}
    @keyframes wrongShake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      60%{transform:translateX(10px)}
    }

    /* ── Sparkles ── */
    .sparkle{
      position:fixed;pointer-events:none;z-index:90;
      font-size:clamp(14px,3.5vw,22px);
      animation:sparkOut ease-out forwards;
    }
    @keyframes sparkOut{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1}
      50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
      100%{transform:translate(-50%,-50%) scale(.1);opacity:0}
    }
    .spark-dot{
      position:fixed;pointer-events:none;z-index:90;border-radius:50%;
      animation:dotFly ease-out forwards;
    }
    @keyframes dotFly{
      0%{transform:translate(0,0) scale(1);opacity:1}
      100%{transform:translate(var(--tx),var(--ty)) scale(.05);opacity:0}
    }
    .confetti-p{
      position:fixed;pointer-events:none;z-index:90;border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall{0%{top:-20px;opacity:1}100%{top:110vh;opacity:.1}}

    /* ── Celebrate overlay ── */
    #celebrate{
      position:fixed;inset:0;z-index:80;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(10px,2.5vw,18px);
      background:rgba(30,0,60,.88);
    }
    #celebrate.show{display:flex;}
    #cel-coin{width:clamp(100px,26vw,150px);height:clamp(100px,26vw,150px);}
    #cel-name{font-size:clamp(28px,7.5vw,54px);color:#ffd700;text-align:center;text-shadow:0 0 18px rgba(255,215,0,.5);}
    #cel-fact{font-size:clamp(14px,3.8vw,22px);color:rgba(255,255,255,.88);text-align:center;padding:0 20px;max-width:360px;}
    #cel-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;touch-action:manipulation;
      box-shadow:0 6px 22px rgba(255,180,0,.45);min-height:60px;
    }

    /* ── Tier overlay ── */
    #tier-overlay{
      position:fixed;inset:0;z-index:85;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;
      background:rgba(0,0,0,.72);
    }
    #tier-overlay.show{display:flex;}
    #to-icon {font-size:clamp(60px,16vw,96px);}
    #to-title{font-size:clamp(26px,7vw,48px);color:#ffd700;text-shadow:0 0 20px #ff9800;text-align:center;padding:0 20px;}
    #to-sub  {font-size:clamp(15px,4.2vw,22px);color:#fff;text-align:center;padding:0 24px;}
    #to-btn  {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,5vw,26px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00;font-family:inherit;cursor:pointer;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;min-height:60px;
    }

    /* ── Win overlay ── */
    #win-overlay{
      position:fixed;inset:0;z-index:90;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(12px,3vw,20px);
      background:linear-gradient(160deg,#4a0080 0%,#1a0033 100%);
    }
    #win-overlay.show{display:flex;}
    #win-emoji{font-size:clamp(72px,18vw,110px);animation:wBob 2.4s ease-in-out infinite;}
    @keyframes wBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    #win-title{font-size:clamp(28px,7.5vw,56px);color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.7);text-align:center;padding:0 20px;}
    #win-sub  {font-size:clamp(16px,4.2vw,24px);color:rgba(255,255,255,.85);text-align:center;padding:0 20px;}
    #win-btn  {
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,64px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);color:#5d2e00;
      font-family:inherit;cursor:pointer;
      box-shadow:0 6px 24px rgba(255,180,0,.5);touch-action:manipulation;min-height:60px;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌸 Easy</div>
  <div id="score-display">0 ⭐</div>
  <div id="round-label">1 / 9</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="question-card">
  <div id="q-prompt">Find the coin! 🪙</div>
  <div id="q-coin-name">PENNY</div>
  <div id="q-hint">the brown coin · 1¢</div>
</div>

<div id="coin-grid" class="grid-2"></div>

<!-- Celebrate overlay -->
<div id="celebrate">
  <svg id="cel-coin" viewBox="0 0 100 100"></svg>
  <div id="cel-name">Penny!</div>
  <div id="cel-fact">A penny is worth 1 cent!</div>
  <button id="cel-btn" onclick="doNext()">Next ➡️</button>
</div>

<!-- Tier overlay -->
<div id="tier-overlay">
  <div id="to-icon">🪙</div>
  <div id="to-title">New Coin Unlocked!</div>
  <div id="to-sub">More royal coins to discover! ✨</div>
  <button id="to-btn" onclick="resumeTier()">Let's go! ➡️</button>
</div>

<!-- Win overlay -->
<div id="win-overlay">
  <div id="win-emoji">🪙</div>
  <div id="win-title">Coin Royal! 👑</div>
  <div id="win-sub">You know all the royal coins! ✨</div>
  <button id="win-btn" onclick="restartGame()">Play Again 🌸</button>
</div>

<script>
  // ── Audio ────────────────────────────────────────────────────────────────────
  var audioCtx = null;
  function au() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
  function tone(f, type, d, v) {
    v = v || 0.15;
    try {
      var c = au(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
      o.start(); o.stop(c.currentTime + d);
    } catch(e) {}
  }
  function playCorrect()  { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,'sine',.2,.18); }, i*70); }); }
  function playWrong()    { tone(220,'sawtooth',.2,.12); }
  function playTierUp()   { [392,494,587,784,988,1175].forEach(function(f,i){ setTimeout(function(){ tone(f,'triangle',.28,.17); }, i*85); }); }
  function playCelebrate(){ [523,587,659,784,880,1047,1319].forEach(function(f,i){ setTimeout(function(){ tone(f,'sine',.25,.16); }, i*65); }); }

  // ── Coin SVG ──────────────────────────────────────────────────────────────────
  function coinSVG(type) {
    var r, fill1, fill2, edgeCol, textCol, valueText, edgeDetails;
    if (type === 'penny') {
      r=42; fill1='#e8a060'; fill2='#7a3800'; edgeCol='#5c2800'; textCol='rgba(80,30,0,.85)';
      valueText='1¢'; edgeDetails='';
    } else if (type === 'nickel') {
      r=40; fill1='#e8e8e8'; fill2='#888'; edgeCol='#555'; textCol='rgba(40,40,40,.8)';
      valueText='5¢'; edgeDetails='';
    } else if (type === 'dime') {
      r=34; fill1='#efefef'; fill2='#999'; edgeCol='#666'; textCol='rgba(40,40,40,.8)';
      valueText='10¢'; edgeDetails='';
    } else {
      r=46; fill1='#e0e0e0'; fill2='#777'; edgeCol='#444'; textCol='rgba(40,40,40,.8)';
      valueText='25¢'; edgeDetails='';
    }
    var id = type.substring(0,2) + 'g';
    return '<defs>'
      + '<radialGradient id="' + id + '" cx="35%" cy="30%" r="70%">'
      + '<stop offset="0%" stop-color="' + fill1 + '"/>'
      + '<stop offset="100%" stop-color="' + fill2 + '"/>'
      + '</radialGradient></defs>'
      + '<circle cx="50" cy="50" r="' + (r+2) + '" fill="' + edgeCol + '"/>'
      + '<circle cx="50" cy="50" r="' + r + '" fill="url(#' + id + ')"/>'
      + '<circle cx="50" cy="50" r="' + (r-5) + '" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'
      + '<circle cx="50" cy="50" r="' + (r-9) + '" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="1"/>'
      + '<text x="50" y="47" text-anchor="middle" font-family="Fredoka One,sans-serif" font-size="' + (r>40?17:15) + '" font-weight="bold" fill="' + textCol + '">' + valueText + '</text>'
      + '<ellipse cx="42" cy="36" rx="' + Math.round(r*.18) + '" ry="' + Math.round(r*.1) + '" fill="rgba(255,255,255,.28)" transform="rotate(-25 42 36)"/>';
  }

  // ── Coin data ─────────────────────────────────────────────────────────────────
  var COINS = {
    penny:   { name:'PENNY',   value:'1¢',  hint:'the brown coin',      color:'#7a3800', light:'#b87333' },
    nickel:  { name:'NICKEL',  value:'5¢',  hint:'medium silver coin',  color:'#555',    light:'#aaa' },
    dime:    { name:'DIME',    value:'10¢', hint:'the tiny silver coin', color:'#555',    light:'#ccc' },
    quarter: { name:'QUARTER', value:'25¢', hint:'the big silver coin',  color:'#444',    light:'#aaa' },
  };

  var FACTS = {
    penny:   ['A penny is worth 1 cent — the only brown coin! 🟫',
              '100 pennies make one dollar! 💰',
              'The penny is named after an old British coin! 🏰'],
    nickel:  ['A nickel is worth 5 cents — that\'s 5 pennies! 🔄',
              'The nickel is the thickest of all the coins! 💪',
              '20 nickels make one dollar! 🪙'],
    dime:    ['A dime is the SMALLEST coin but worth 10 cents! 😲',
              'The dime is worth MORE than a nickel even though it\'s tinier! 🤯',
              '10 dimes make one dollar! 💰'],
    quarter: ['A quarter is worth 25 cents — the biggest value coin! 👑',
              '4 quarters make one whole dollar! 🎉',
              'The quarter is the biggest and heaviest coin! ⚖️'],
  };

  var PROMPTS = [
    'Find the coin! 🪙',
    'Tap the right coin! ✨',
    'Which coin is it? 👑',
    'Point to the coin! 💎',
    'Spot the royal coin! 🌟',
  ];
  var promptIdx = 0;

  var TIER_INFO = [
    { label:'🌸 Easy',   cls:'tier-easy',   coins:['penny','quarter'],             icon:'🪙', title:'More Coins!', sub:'Now look for nickel and dime! 🪙' },
    { label:'💎 Medium', cls:'tier-medium', coins:['penny','nickel','dime'],        icon:'💎', title:'Final Challenge!', sub:'All four royal coins appear! 👑' },
    { label:'⭐ Hard',   cls:'tier-hard',   coins:['penny','nickel','dime','quarter'], icon:'👑', title:'Coin Royal!', sub:'' },
  ];

  var ROUND_LIST = [
    { coin:'penny',   tier:0 },
    { coin:'quarter', tier:0 },
    { coin:'penny',   tier:0 },
    { coin:'nickel',  tier:1 },
    { coin:'penny',   tier:1 },
    { coin:'dime',    tier:1 },
    { coin:'quarter', tier:2 },
    { coin:'dime',    tier:2 },
    { coin:'nickel',  tier:2 },
  ];

  var TOTAL = 9;
  var rounds = [], cur = 0, score = 0, locked = false;

  // ── Shuffle ───────────────────────────────────────────────────────────────────
  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length-1; i > 0; i--) {
      var j = 0|Math.random()*(i+1), t = b[i]; b[i]=b[j]; b[j]=t;
    }
    return b;
  }

  function buildRounds() {
    var out = [];
    // Shuffle within each tier
    var easy   = shuffle(ROUND_LIST.filter(function(r){ return r.tier===0; }));
    var medium = shuffle(ROUND_LIST.filter(function(r){ return r.tier===1; }));
    var hard   = shuffle(ROUND_LIST.filter(function(r){ return r.tier===2; }));
    return easy.concat(medium).concat(hard);
  }

  // ── Render HUD ────────────────────────────────────────────────────────────────
  function updateHUD() {
    var tIdx = rounds[cur] ? rounds[cur].tier : 2;
    var ti = TIER_INFO[tIdx];
    var badge = document.getElementById('tier-badge');
    badge.textContent = ti.label;
    badge.className   = ti.cls;
    document.getElementById('round-label').textContent = (cur+1) + ' / ' + TOTAL;
    document.getElementById('progress-fill').style.width = (cur / TOTAL * 100) + '%';
    document.getElementById('score-display').textContent = score + ' ⭐';
  }

  // ── Show question ──────────────────────────────────────────────────────────────
  function showRound(idx) {
    locked = false;
    cur = idx;
    updateHUD();

    var r = rounds[idx];
    var c = COINS[r.coin];
    var tier = TIER_INFO[r.tier];

    var card = document.getElementById('question-card');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = '';

    document.getElementById('q-prompt').textContent = PROMPTS[promptIdx % PROMPTS.length];
    promptIdx++;
    document.getElementById('q-coin-name').textContent = c.name;
    document.getElementById('q-hint').textContent = c.hint + ' · ' + c.value;

    var grid = document.getElementById('coin-grid');
    var n = tier.coins.length;
    grid.className = n === 2 ? 'grid-2' : n === 3 ? 'grid-3' : 'grid-4';
    grid.innerHTML = '';

    var choiceOrder = shuffle(tier.coins.slice());
    choiceOrder.forEach(function(coinKey) {
      var cd = COINS[coinKey];
      var btn = document.createElement('button');
      btn.className = 'coin-btn';

      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 100 100');
      svg.style.cssText = 'width:clamp(54px,14vw,78px);height:clamp(54px,14vw,78px);flex-shrink:0;';
      svg.innerHTML = coinSVG(coinKey);

      var lbl = document.createElement('span');
      lbl.className = 'btn-label';
      lbl.textContent = cd.name;

      var val = document.createElement('span');
      val.className = 'btn-value';
      val.textContent = cd.value;

      btn.appendChild(svg);
      btn.appendChild(lbl);
      btn.appendChild(val);
      (function(ck){ btn.addEventListener('pointerdown', function(){ handleTap(btn, ck); }); })(coinKey);
      grid.appendChild(btn);
    });
  }

  // ── Handle tap ────────────────────────────────────────────────────────────────
  function handleTap(btn, coinKey) {
    if (locked) return;
    var r = rounds[cur];
    if (coinKey === r.coin) {
      locked = true;
      btn.classList.add('correct-flash');
      playCorrect();
      score++;
      var rect = btn.getBoundingClientRect();
      sparkleBurst(rect.left + rect.width/2, rect.top + rect.height/2);
      setTimeout(function(){ showCelebrate(r.coin); }, 450);
    } else {
      btn.classList.add('wrong-shake');
      playWrong();
      setTimeout(function(){ btn.classList.remove('wrong-shake'); }, 430);
    }
  }

  // ── Celebrate overlay ─────────────────────────────────────────────────────────
  function showCelebrate(coinKey) {
    var c = COINS[coinKey];
    document.getElementById('cel-coin').innerHTML = coinSVG(coinKey);
    document.getElementById('cel-name').textContent = c.name + '!';
    var facts = FACTS[coinKey];
    document.getElementById('cel-fact').textContent = facts[0|Math.random()*facts.length];
    document.getElementById('celebrate').classList.add('show');
    playCelebrate();
    confettiBurst(28);
  }

  function doNext() {
    document.getElementById('celebrate').classList.remove('show');
    var next = cur + 1;
    if (next >= TOTAL) { showWin(); return; }
    var prevTier = rounds[cur].tier;
    var nextTier = rounds[next].tier;
    if (nextTier !== prevTier) {
      showTierOverlay(prevTier);
    } else {
      showRound(next);
    }
  }

  // ── Tier overlay ──────────────────────────────────────────────────────────────
  function showTierOverlay(completedTier) {
    var next = TIER_INFO[completedTier + 1];
    document.getElementById('to-icon').textContent  = next.icon;
    document.getElementById('to-title').textContent = next.title;
    document.getElementById('to-sub').textContent   = next.sub;
    document.getElementById('tier-overlay').classList.add('show');
    playTierUp();
    confettiBurst(42);
  }

  function resumeTier() {
    document.getElementById('tier-overlay').classList.remove('show');
    showRound(cur + 1);
  }

  // ── Win ───────────────────────────────────────────────────────────────────────
  function showWin() {
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('score-display').textContent = score + ' ⭐';
    document.getElementById('win-sub').textContent = score + ' / 9 ⭐ — You know all the royal coins!';
    document.getElementById('win-overlay').classList.add('show');
    playCelebrate();
    confettiBurst(60);
    setTimeout(function(){ confettiBurst(42); }, 700);
  }

  // ── Particles ──────────────────────────────────────────────────────────────────
  function sparkleBurst(x, y) {
    var ems  = ['✨','💫','⭐','🪙','🌟','👑','💎'];
    var cols = ['#ffd700','#f48fb1','#ce93d8','#80deea','#a5d6a7','#ffab91','#fff'];
    for (var i = 0; i < 20; i++) {
      var el = document.createElement('span');
      el.className = 'sparkle';
      el.textContent = ems[i % ems.length];
      var angle = (i / 20) * Math.PI * 2;
      var dist  = 50 + Math.random() * 90;
      el.style.left = (x + Math.cos(angle) * dist) + 'px';
      el.style.top  = (y + Math.sin(angle) * dist) + 'px';
      el.style.animationDelay    = (Math.random() * .14) + 's';
      el.style.animationDuration = (.7 + Math.random() * .35) + 's';
      document.body.appendChild(el);
      setTimeout((function(e){ return function(){ e.remove(); }; })(el), 1200);
    }
    for (var j = 0; j < 10; j++) {
      var dot = document.createElement('div');
      dot.className = 'spark-dot';
      var a2 = Math.random() * Math.PI * 2;
      var d2 = 20 + Math.random() * 60;
      var sz = 5 + Math.random() * 9;
      dot.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;'
        + 'background:'+cols[j%cols.length]+';'
        + '--tx:'+(Math.cos(a2)*d2)+'px;--ty:'+(Math.sin(a2)*d2)+'px;'
        + 'animation-duration:'+(0.6+Math.random()*.3)+'s;';
      document.body.appendChild(dot);
      setTimeout((function(e){ return function(){ e.remove(); }; })(dot), 1000);
    }
  }

  function confettiBurst(n) {
    var cols = ['#ffd700','#f48fb1','#ce93d8','#80deea','#a5d6a7','#ffab91','#e040fb','#fff'];
    for (var i = 0; i < n; i++) {
      var el  = document.createElement('div');
      el.className = 'confetti-p';
      var dur = 1.3 + Math.random() * 1.8;
      var sz  = 6 + Math.random() * 9;
      el.style.cssText = 'left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz*(0.4+Math.random()*0.7)+'px;'
        + 'background:'+cols[i%cols.length]+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*.45+'s;';
      document.body.appendChild(el);
      setTimeout((function(e){ return function(){ e.remove(); }; })(el), (dur + 0.6) * 1000 + 200);
    }
  }

  // ── Background floaters ───────────────────────────────────────────────────────
  function makeBg() {
    var items = ['🪙','✨','💰','⭐','💫','👑','💎','🌟','🟡','🟠'];
    for (var i = 0; i < 12; i++) {
      var el = document.createElement('div');
      el.className = 'bg-coin';
      el.textContent = items[i % items.length];
      el.style.left = (5 + Math.random() * 90) + 'vw';
      el.style.animationDuration = (9 + Math.random() * 14) + 's';
      el.style.animationDelay    = -(Math.random() * 18) + 's';
      document.body.appendChild(el);
    }
  }

  // ── Restart ───────────────────────────────────────────────────────────────────
  function restartGame() {
    document.getElementById('win-overlay').classList.remove('show');
    document.getElementById('tier-overlay').classList.remove('show');
    document.getElementById('celebrate').classList.remove('show');
    score = 0; cur = 0; promptIdx = 0;
    rounds = buildRounds();
    document.getElementById('progress-fill').style.width = '0%';
    showRound(0);
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  makeBg();
  rounds = buildRounds();
  showRound(0);
</script>
</body>
</html>
