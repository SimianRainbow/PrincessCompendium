<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Farm Magic 🌾</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#1b4332 0%,#2d6a4f 50%,#52b788 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:10px;
    }

    .bg-float{
      position:fixed;pointer-events:none;opacity:.12;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite;z-index:0;
    }
    @keyframes bgFloat{
      0%{transform:translateY(110vh) rotate(0)}
      100%{transform:translateY(-15vh) rotate(360deg)}
    }

    /* ── Header ── */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{
      font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;
      color:#fff;font-weight:bold;border:2px solid rgba(255,255,255,.38);
      transition:background .4s;
    }
    .tier-easy  {background:linear-gradient(135deg,#52b788,#1b4332);}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#f4a261,#e76f51);}
    #score-display{font-size:clamp(15px,3.8vw,22px);color:#ffd700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.5);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(220,255,210,.9);position:relative;z-index:1;}

    /* ── Progress bar ── */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.18);border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#52b788);
      border-radius:99px;transition:width .4s ease;width:0%;
    }

    /* ── Question card ── */
    #question-card{
      background:rgba(255,255,255,.95);border-radius:28px;
      padding:clamp(10px,2.5vw,16px) clamp(20px,5vw,36px);
      display:flex;flex-direction:column;align-items:center;gap:5px;
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 3px rgba(255,215,0,.25);
      margin:clamp(8px,2vw,14px) clamp(14px,4vw,22px) 0;
      position:relative;z-index:1;flex-shrink:0;
      animation:cardIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardIn{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
    #q-prompt{
      font-size:clamp(14px,3.5vw,20px);
      color:#2d6a4f;text-align:center;
    }
    #q-food{
      font-size:clamp(56px,15vw,88px);
      line-height:1.1;text-align:center;
    }
    #q-name{
      font-size:clamp(24px,6.5vw,40px);
      font-weight:bold;letter-spacing:2px;
      background:linear-gradient(135deg,#2d6a4f,#52b788,#ffd700);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
      text-align:center;
    }

    /* ── Choice grid ── */
    #choice-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:clamp(10px,2.5vw,16px);
      padding:clamp(8px,2vw,14px) clamp(14px,3.5vw,22px);
      width:100%;max-width:420px;
      position:relative;z-index:1;flex-shrink:0;
    }

    .choice-btn{
      min-height:clamp(90px,24vw,120px);
      border-radius:22px;border:3px solid rgba(255,255,255,.3);
      cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;padding:8px 6px;
      touch-action:manipulation;
      transition:transform .1s;
      box-shadow:0 5px 20px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.28);
    }
    .choice-btn:active{transform:scale(.88);}
    .choice-btn .src-icon{
      font-size:clamp(32px,9vw,52px);
      line-height:1;
    }
    .choice-btn .src-name{
      font-size:clamp(11px,2.8vw,16px);
      color:#fff;text-align:center;
      text-shadow:0 1px 4px rgba(0,0,0,.5);
      line-height:1.2;
    }
    .choice-btn.correct-flash{animation:correctPop .5s ease-out;border-color:#ffd700;background:rgba(255,215,0,.35)!important;}
    @keyframes correctPop{
      0%{transform:scale(1)}
      40%{transform:scale(1.16);box-shadow:0 0 40px rgba(255,215,0,.8);}
      100%{transform:scale(1)}
    }
    .choice-btn.wrong-shake{animation:wrongShake .42s ease-out;}
    @keyframes wrongShake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      60%{transform:translateX(10px)}
    }

    /* ── Sparkles ── */
    .sparkle{
      position:fixed;pointer-events:none;z-index:90;
      font-size:clamp(14px,3.5vw,22px);
      animation:sparkOut ease-out forwards;
    }
    @keyframes sparkOut{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1}
      50%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
      100%{transform:translate(-50%,-50%) scale(.1);opacity:0}
    }
    .spark-dot{
      position:fixed;pointer-events:none;z-index:90;border-radius:50%;
      animation:dotFly ease-out forwards;
    }
    @keyframes dotFly{
      0%{transform:translate(0,0) scale(1);opacity:1}
      100%{transform:translate(var(--tx),var(--ty)) scale(.05);opacity:0}
    }
    .confetti-p{
      position:fixed;pointer-events:none;z-index:90;border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall{0%{top:-20px;opacity:1}100%{top:110vh;opacity:.1}}

    /* ── Celebrate overlay ── */
    #celebrate{
      position:fixed;inset:0;z-index:80;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(8px,2vw,14px);
      background:rgba(10,40,10,.92);
    }
    #celebrate.show{display:flex;}
    #cel-food{font-size:clamp(56px,14vw,88px);line-height:1;}
    #cel-arrow{font-size:clamp(24px,6vw,36px);color:#ffd700;}
    #cel-src{font-size:clamp(32px,9vw,52px);color:#ffd700;text-align:center;}
    #cel-title{
      font-size:clamp(28px,7.5vw,46px);font-weight:bold;
      background:linear-gradient(135deg,#ffd700,#52b788,#ffd700);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;text-align:center;
    }
    #cel-fact{font-size:clamp(14px,3.6vw,20px);color:rgba(255,255,255,.88);text-align:center;padding:0 22px;max-width:340px;}
    #cel-btn{
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,60px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#f57f17);color:#3e2000;
      font-family:inherit;cursor:pointer;touch-action:manipulation;
      box-shadow:0 6px 22px rgba(255,180,0,.45);min-height:60px;
    }

    /* ── Tier overlay ── */
    #tier-overlay{
      position:fixed;inset:0;z-index:85;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;
      background:rgba(0,0,0,.78);
    }
    #tier-overlay.show{display:flex;}
    #to-icon {font-size:clamp(60px,16vw,96px);}
    #to-title{font-size:clamp(26px,7vw,48px);color:#ffd700;text-shadow:0 0 20px #ff9800;text-align:center;padding:0 20px;}
    #to-sub  {font-size:clamp(15px,4.2vw,22px);color:#fff;text-align:center;padding:0 24px;}
    #to-btn  {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,5vw,26px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#f57f17);
      color:#3e2000;font-family:inherit;cursor:pointer;
      box-shadow:0 4px 16px rgba(255,180,0,.5);touch-action:manipulation;min-height:60px;
    }

    /* ── Win overlay ── */
    #win-overlay{
      position:fixed;inset:0;z-index:90;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;gap:clamp(12px,3vw,20px);
      background:linear-gradient(160deg,#1b4332 0%,#081c15 100%);
    }
    #win-overlay.show{display:flex;}
    #win-emoji{font-size:clamp(72px,18vw,110px);animation:wBob 2.4s ease-in-out infinite;}
    @keyframes wBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    #win-title{font-size:clamp(28px,7.5vw,56px);color:#ffd700;text-shadow:0 0 24px rgba(255,215,0,.7);text-align:center;padding:0 20px;}
    #win-sub  {font-size:clamp(16px,4.2vw,24px);color:rgba(255,255,255,.85);text-align:center;padding:0 20px;}
    #win-btn  {
      padding:clamp(14px,4vw,20px) clamp(36px,9vw,64px);
      font-size:clamp(18px,5vw,28px);border-radius:50px;border:none;
      background:linear-gradient(135deg,#ffd700,#f57f17);color:#3e2000;
      font-family:inherit;cursor:pointer;
      box-shadow:0 6px 24px rgba(255,180,0,.5);touch-action:manipulation;min-height:60px;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-display">0 ⭐</div>
  <div id="round-label">1 / 18</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="question-card">
  <div id="q-prompt">Where does it come from? 🌾</div>
  <div id="q-food">🥛</div>
  <div id="q-name">MILK</div>
</div>

<div id="choice-grid"></div>

<!-- Celebrate overlay -->
<div id="celebrate">
  <div id="cel-food">🥛</div>
  <div id="cel-arrow">⬇️ comes from</div>
  <div id="cel-src">🐄 Cow!</div>
  <div id="cel-title">Amazing! 🌟</div>
  <div id="cel-fact">Cows make milk by eating lots of fresh green grass!</div>
  <button id="cel-btn" onclick="doNext()">Next ➡️</button>
</div>

<!-- Tier overlay -->
<div id="tier-overlay">
  <div id="to-icon">🌟</div>
  <div id="to-title">Great Farmer!</div>
  <div id="to-sub">More farm secrets coming up! 🌾</div>
  <button id="to-btn" onclick="resumeTier()">Let's go! ➡️</button>
</div>

<!-- Win overlay -->
<div id="win-overlay">
  <div id="win-emoji">🌾</div>
  <div id="win-title">Farm Expert! 👑</div>
  <div id="win-sub">You know where everything comes from!</div>
  <button id="win-btn" onclick="restartGame()">Play Again 🌸</button>
</div>

<script>
  // ── Audio ─────────────────────────────────────────────────────────────────────
  var audioCtx=null;
  function au(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function tone(f,type,d,v){
    v=v||0.15;
    try{
      var c=au(),o=c.createOscillator(),g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
      o.start(); o.stop(c.currentTime+d);
    }catch(e){}
  }
  function playCorrect()  { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f,'sine',.2,.18); },i*70); }); }
  function playWrong()    { tone(220,'sawtooth',.2,.12); }
  function playTierUp()   { [392,494,587,784,988,1175].forEach(function(f,i){ setTimeout(function(){ tone(f,'triangle',.28,.17); },i*85); }); }
  function playCelebrate(){ [523,587,659,784,880,1047,1319].forEach(function(f,i){ setTimeout(function(){ tone(f,'sine',.25,.16); },i*65); }); }

  // ── Data ──────────────────────────────────────────────────────────────────────
  var POOL = [
    // tier 0 — Easy: familiar everyday foods
    { food:'🥛', name:'MILK',         tier:0, src:'🐄', srcName:'Cow',
      fact:'Cows eat lots of fresh green grass, then their bodies make creamy milk! 🐄🌿' },
    { food:'🥚', name:'EGGS',         tier:0, src:'🐔', srcName:'Chicken',
      fact:'Hens lay eggs every single day — a princess breakfast treat! 🐔🌅' },
    { food:'🍯', name:'HONEY',        tier:0, src:'🐝', srcName:'Bee',
      fact:'Busy bees collect flower nectar and turn it into golden sweet honey! 🐝🌺' },
    { food:'🍎', name:'APPLE',        tier:0, src:'🌳', srcName:'Tree',
      fact:'Apple trees take several years to grow before making their first fruit! 🌳✨' },
    { food:'🧶', name:'WOOL',         tier:0, src:'🐑', srcName:'Sheep',
      fact:'A sheep grows a warm fluffy coat of wool that gets cut once a year! 🐑✂️' },
    { food:'🥕', name:'CARROT',       tier:0, src:'🌱', srcName:'Ground',
      fact:'Carrots grow underground — their orange tops poke up when ready to pick! 🥕🌱' },

    // tier 1 — Medium: a little more thought needed
    { food:'🧈', name:'BUTTER',       tier:1, src:'🐄', srcName:'Cow',
      fact:'Butter is made by stirring cream from cow\'s milk very quickly — it turns solid! 🧈🐄' },
    { food:'🍞', name:'BREAD',        tier:1, src:'🌾', srcName:'Wheat',
      fact:'Wheat seeds grow into tall stalks — the grains are ground into flour for bread! 🌾🍞' },
    { food:'🧀', name:'CHEESE',       tier:1, src:'🐄', srcName:'Cow',
      fact:'Cheese is made from milk — different cheeses take days, months or even years to age! 🧀✨' },
    { food:'🍊', name:'ORANGE JUICE', tier:1, src:'🍊', srcName:'Orange Tree',
      fact:'One orange tree can make hundreds of oranges every season! 🍊🌳' },
    { food:'🍓', name:'STRAWBERRY',   tier:1, src:'🌿', srcName:'Plant',
      fact:'Strawberry plants spread by sending out little runners across the ground! 🍓🌿' },
    { food:'🍫', name:'CHOCOLATE',    tier:1, src:'🌱', srcName:'Cacao Tree',
      fact:'Chocolate comes from cacao beans that grow in pods on tropical trees! 🍫🌴' },

    // tier 2 — Hard: less obvious origins
    { food:'🍬', name:'SUGAR',        tier:2, src:'🌾', srcName:'Sugarcane',
      fact:'Sugarcane is a very tall grass — the sweet juice inside makes sugar! 🌾🍬' },
    { food:'📄', name:'PAPER',        tier:2, src:'🌲', srcName:'Tree',
      fact:'Paper is made from wood pulp — one tree can make thousands of sheets of paper! 🌲📄' },
    { food:'👕', name:'COTTON',       tier:2, src:'🌸', srcName:'Cotton Plant',
      fact:'Cotton plants grow fluffy white bolls — they are picked and spun into thread! 🌸👕' },
    { food:'🍁', name:'MAPLE SYRUP',  tier:2, src:'🍁', srcName:'Maple Tree',
      fact:'Maple syrup comes from the sap of maple trees, collected in early spring! 🍁🌳' },
    { food:'🫒', name:'OLIVE OIL',    tier:2, src:'🌿', srcName:'Olive Tree',
      fact:'Olive trees can live for thousands of years and still make olives! 🌿🫒' },
    { food:'🧵', name:'SILK',         tier:2, src:'🐛', srcName:'Silkworm',
      fact:'Tiny silkworm caterpillars spin silk threads to make their cocoon — so clever! 🐛✨' },
  ];

  var SOURCES = {
    '🐄 Cow'       :['🐝 Bee','🌳 Tree','🐑 Sheep','🌾 Wheat'],
    '🐔 Chicken'   :['🐄 Cow','🐑 Sheep','🌱 Ground','🐝 Bee'],
    '🐝 Bee'       :['🐄 Cow','🐔 Chicken','🌳 Tree','🌾 Wheat'],
    '🌳 Tree'      :['🐄 Cow','🐝 Bee','🌱 Ground','🐔 Chicken'],
    '🐑 Sheep'     :['🐄 Cow','🌳 Tree','🐔 Chicken','🐝 Bee'],
    '🌱 Ground'    :['🐄 Cow','🐝 Bee','🌳 Tree','🐔 Chicken'],
    '🌾 Wheat'     :['🐄 Cow','🌳 Tree','🐝 Bee','🐔 Chicken'],
    '🍊 Orange Tree':['🐄 Cow','🌾 Wheat','🐝 Bee','🌳 Tree'],
    '🌿 Plant'     :['🐄 Cow','🌾 Wheat','🐝 Bee','🐔 Chicken'],
    '🌱 Cacao Tree':['🐄 Cow','🌾 Wheat','🌳 Tree','🐝 Bee'],
    '🌲 Tree'      :['🌾 Sugarcane','🌸 Cotton Plant','🐛 Silkworm','🌿 Olive Tree'],
    '🌸 Cotton Plant':['🌲 Tree','🌾 Sugarcane','🐛 Silkworm','🍁 Maple Tree'],
    '🍁 Maple Tree':['🌲 Tree','🌾 Sugarcane','🌸 Cotton Plant','🌿 Olive Tree'],
    '🌿 Olive Tree':['🌲 Tree','🍁 Maple Tree','🌸 Cotton Plant','🌾 Sugarcane'],
    '🐛 Silkworm'  :['🌲 Tree','🌾 Sugarcane','🌸 Cotton Plant','🌿 Olive Tree'],
  };

  // ── Make distractor pool from other tier items ─────────────────────────────
  function getWrongSrcs(item, tierItems, count){
    var key=item.src+' '+item.srcName;
    // prefer pre-defined distractors if available
    if(SOURCES[key]) return shuffle(SOURCES[key]).slice(0,count);
    // fallback: use other items from same tier
    var others=tierItems.filter(function(p){ return p!==item; });
    var seen={};
    var out=[];
    shuffle(others).forEach(function(p){
      var label=p.src+' '+p.srcName;
      if(!seen[label] && label!==key && out.length<count){ seen[label]=1; out.push(label); }
    });
    // pad with generic sources if needed
    var fallbacks=['🌳 Tree','🐄 Cow','🐝 Bee','🌾 Wheat','🐔 Chicken','🌱 Ground'];
    fallbacks.forEach(function(f){
      if(out.length<count && !seen[f] && f!==key){ seen[f]=1; out.push(f); }
    });
    return out.slice(0,count);
  }

  var TIER_INFO = [
    { label:'🌱 Easy',   cls:'tier-easy',
      icon:'🌟', title:'Farm Explorer!', sub:'More amazing food secrets coming up! 🌾' },
    { label:'🍃 Medium', cls:'tier-medium',
      icon:'🌾', title:'Growing Strong!', sub:'Hard farm secrets — you\'ve got this! 🌟' },
    { label:'🌻 Hard',   cls:'tier-hard',
      icon:'👑', title:'Farm Master!',    sub:'' },
  ];

  var PROMPTS = [
    'Where does it come from? 🌾',
    'Which friend makes this? 🐾',
    'Tap where this comes from! ✨',
    'Who gives us this? 🌱',
    'Which plant or animal makes this? 🌟',
    'Help Princess find the source! 👑',
  ];

  var PRAISE = ['Amazing! 🌟','Brilliant! 💫','You got it! 👑','Wonderful! 🌈','Perfect! ✨','Great job! 💎','So smart! 🌸','Superstar! ⭐'];

  // ── Shuffle ───────────────────────────────────────────────────────────────────
  function shuffle(a){
    var b=a.slice();
    for(var i=b.length-1;i>0;i--){
      var j=0|Math.random()*(i+1), t=b[i]; b[i]=b[j]; b[j]=t;
    }
    return b;
  }

  // ── Build round list ──────────────────────────────────────────────────────────
  function buildRounds(){
    var out=[];
    [0,1,2].forEach(function(t){
      var pool=shuffle(POOL.filter(function(p){ return p.tier===t; })).slice(0,6);
      pool.forEach(function(p){ out.push(p); });
    });
    return out;
  }

  // ── State ─────────────────────────────────────────────────────────────────────
  var rounds=[], cur=0, score=0, locked=false;

  // ── HUD ───────────────────────────────────────────────────────────────────────
  function updateHUD(){
    var r=rounds[cur]||rounds[rounds.length-1];
    var ti=TIER_INFO[r.tier];
    var badge=document.getElementById('tier-badge');
    badge.textContent=ti.label; badge.className='tier-badge '+ti.cls;
    document.getElementById('score-display').textContent=score+' ⭐';
    document.getElementById('round-label').textContent=(cur+1)+' / 18';
    document.getElementById('progress-fill').style.width=((cur/18)*100)+'%';
  }

  // ── Button colors ─────────────────────────────────────────────────────────────
  var BTN_COLORS=[
    'linear-gradient(135deg,#2d6a4f,#1b4332)',
    'linear-gradient(135deg,#52b788,#2d6a4f)',
    'linear-gradient(135deg,#f4a261,#e76f51)',
    'linear-gradient(135deg,#e9c46a,#f4a261)',
    'linear-gradient(135deg,#264653,#2a9d8f)',
    'linear-gradient(135deg,#8ecae6,#219ebc)',
    'linear-gradient(135deg,#e63946,#a8dadc)',
    'linear-gradient(135deg,#606c38,#283618)',
  ];

  // ── Show round ────────────────────────────────────────────────────────────────
  function showRound(idx){
    locked=false; cur=idx;
    updateHUD();

    var r=rounds[idx];
    var card=document.getElementById('question-card');
    card.style.animation='none'; void card.offsetWidth; card.style.animation='';

    document.getElementById('q-prompt').textContent=PROMPTS[0|Math.random()*PROMPTS.length];
    document.getElementById('q-food').textContent=r.food;
    document.getElementById('q-name').textContent=r.name;

    var tierItems=POOL.filter(function(p){ return p.tier===r.tier; });
    var wrongs=getWrongSrcs(r, tierItems, 2);
    var correct=r.src+' '+r.srcName;
    var choices=shuffle([correct].concat(wrongs));

    var grid=document.getElementById('choice-grid');
    grid.innerHTML='';

    var colorOrder=shuffle(BTN_COLORS.slice());
    choices.forEach(function(srcLabel, i){
      var parts=srcLabel.match(/^(\S+)\s(.+)$/);
      var icon=parts?parts[1]:srcLabel;
      var name=parts?parts[2]:srcLabel;

      var btn=document.createElement('button');
      btn.className='choice-btn';
      btn.style.background=colorOrder[i%colorOrder.length];

      var iconEl=document.createElement('div');
      iconEl.className='src-icon';
      iconEl.textContent=icon;

      var nameEl=document.createElement('div');
      nameEl.className='src-name';
      nameEl.textContent=name;

      btn.appendChild(iconEl);
      btn.appendChild(nameEl);
      (function(lbl){ btn.addEventListener('pointerdown',function(){ handleTap(btn,lbl,correct); }); })(srcLabel);
      grid.appendChild(btn);
    });
  }

  // ── Handle tap ────────────────────────────────────────────────────────────────
  function handleTap(btn, chosen, correct){
    if(locked) return;
    var r=rounds[cur];
    if(chosen===correct){
      locked=true;
      btn.classList.add('correct-flash');
      playCorrect(); score++;
      var rect=btn.getBoundingClientRect();
      sparkleBurst(rect.left+rect.width/2, rect.top+rect.height/2);
      setTimeout(function(){
        btn.classList.remove('correct-flash');
        showCelebrate(r);
      },450);
    } else {
      btn.classList.add('wrong-shake'); playWrong();
      setTimeout(function(){ btn.classList.remove('wrong-shake'); },430);
    }
  }

  // ── Celebrate overlay ─────────────────────────────────────────────────────────
  function showCelebrate(r){
    document.getElementById('cel-food').textContent=r.food;
    document.getElementById('cel-src').textContent=r.src+' '+r.srcName+'!';
    document.getElementById('cel-title').textContent=PRAISE[0|Math.random()*PRAISE.length];
    document.getElementById('cel-fact').textContent=r.fact;
    document.getElementById('celebrate').classList.add('show');
    playCelebrate();
    confettiBurst(28);
  }

  function doNext(){
    document.getElementById('celebrate').classList.remove('show');
    var next=cur+1;
    if(next>=18){ showWin(); return; }
    if(rounds[next].tier!==rounds[cur].tier){
      showTierOverlay(rounds[cur].tier);
    } else {
      showRound(next);
    }
  }

  // ── Tier overlay ──────────────────────────────────────────────────────────────
  function showTierOverlay(completedTier){
    var next=TIER_INFO[completedTier+1]||TIER_INFO[2];
    document.getElementById('to-icon').textContent=next.icon;
    document.getElementById('to-title').textContent=next.title;
    document.getElementById('to-sub').textContent=next.sub;
    document.getElementById('tier-overlay').classList.add('show');
    playTierUp(); confettiBurst(42);
  }

  function resumeTier(){
    document.getElementById('tier-overlay').classList.remove('show');
    showRound(cur+1);
  }

  // ── Win ───────────────────────────────────────────────────────────────────────
  function showWin(){
    document.getElementById('progress-fill').style.width='100%';
    document.getElementById('win-sub').textContent=score+' / 18 ⭐ — You know where everything comes from! 🌾';
    document.getElementById('win-overlay').classList.add('show');
    playCelebrate(); confettiBurst(60);
    setTimeout(function(){ confettiBurst(42); },700);
  }

  // ── Particles ─────────────────────────────────────────────────────────────────
  function sparkleBurst(x,y){
    var ems=['✨','💫','⭐','🌾','🌟','🌱','🐾','🌸'];
    var cols=['#ffd700','#52b788','#f4a261','#e9c46a','#80deea','#a5d6a7','#fff'];
    for(var i=0;i<22;i++){
      var el=document.createElement('span'); el.className='sparkle';
      el.textContent=ems[i%ems.length];
      var angle=(i/22)*Math.PI*2, dist=50+Math.random()*90;
      el.style.left=(x+Math.cos(angle)*dist)+'px';
      el.style.top=(y+Math.sin(angle)*dist)+'px';
      el.style.animationDelay=(Math.random()*.14)+'s';
      el.style.animationDuration=(.7+Math.random()*.35)+'s';
      document.body.appendChild(el);
      setTimeout((function(e){ return function(){ e.remove(); }; })(el),1200);
    }
    for(var j=0;j<12;j++){
      var dot=document.createElement('div'); dot.className='spark-dot';
      var a2=Math.random()*Math.PI*2, d2=20+Math.random()*60, sz=5+Math.random()*9;
      dot.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;'
        +'background:'+cols[j%cols.length]+';'
        +'--tx:'+(Math.cos(a2)*d2)+'px;--ty:'+(Math.sin(a2)*d2)+'px;'
        +'animation-duration:'+(0.6+Math.random()*.3)+'s;';
      document.body.appendChild(dot);
      setTimeout((function(e){ return function(){ e.remove(); }; })(dot),1000);
    }
  }

  function confettiBurst(n){
    var cols=['#ffd700','#52b788','#f4a261','#e9c46a','#80deea','#a5d6a7','#e040fb','#fff'];
    for(var i=0;i<n;i++){
      var el=document.createElement('div'); el.className='confetti-p';
      var dur=1.3+Math.random()*1.8, sz=6+Math.random()*9;
      el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz*(0.4+Math.random()*0.7)+'px;'
        +'background:'+cols[i%cols.length]+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*.45+'s;';
      document.body.appendChild(el);
      setTimeout((function(e){ return function(){ e.remove(); }; })(el),(dur+0.6)*1000+200);
    }
  }

  // ── Background ────────────────────────────────────────────────────────────────
  function makeBg(){
    var items=['🌾','🐄','🐝','🌱','🍎','🥛','🐔','🌳','🐑','🍯','🌿','🥚','🍞','🧀'];
    for(var i=0;i<14;i++){
      var el=document.createElement('div'); el.className='bg-float';
      el.textContent=items[i%items.length];
      el.style.left=(5+Math.random()*90)+'vw';
      el.style.animationDuration=(9+Math.random()*14)+'s';
      el.style.animationDelay=-(Math.random()*18)+'s';
      document.body.appendChild(el);
    }
  }

  // ── Restart ───────────────────────────────────────────────────────────────────
  function restartGame(){
    document.getElementById('win-overlay').classList.remove('show');
    document.getElementById('tier-overlay').classList.remove('show');
    document.getElementById('celebrate').classList.remove('show');
    score=0; cur=0;
    rounds=buildRounds();
    document.getElementById('progress-fill').style.width='0%';
    showRound(0);
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  makeBg();
  rounds=buildRounds();
  showRound(0);
</script>
</body>
</html>
