<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Alphabet March 🔤</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background: linear-gradient(160deg, #1a237e 0%, #283593 30%, #6a1b9a 70%, #7b1fa2 100%);
      font-family: 'Fredoka One', Georgia, serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; touch-action:manipulation;
    }

    .bg-icon {
      position:fixed; pointer-events:none; opacity:.08;
      font-size:clamp(18px,4.5vw,28px);
      animation:bgFloat linear infinite; z-index:0;
    }
    @keyframes bgFloat {
      0%   { transform:translateY(110vh) rotate(0deg); }
      100% { transform:translateY(-15vh) rotate(360deg); }
    }

    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #tier-badge {
      font-size:clamp(13px,3.2vw,18px); padding:5px 14px;
      border-radius:20px; font-weight:bold;
    }
    .tier-easy   { background:linear-gradient(135deg,#b3e5fc,#039be5); color:#01579b; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#ffd54f); color:#5a3000; }
    .tier-hard   { background:linear-gradient(135deg,#f48fb1,#e91e63); color:#fff; }
    #score-label { font-size:clamp(13px,3.2vw,17px); color:#ffd700; font-weight:bold; }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.9); }

    #progress-wrap { width:100%; padding:6px clamp(14px,4vw,22px) 0; flex-shrink:0; z-index:1; position:relative; }
    #progress-track { background:rgba(255,255,255,.18); border-radius:20px; height:clamp(8px,2vw,12px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#80d8ff,#ffd700); transition:width .35s ease; width:0%; box-shadow:0 0 8px rgba(128,216,255,.55); }

    #prompt {
      font-size:clamp(17px,4.5vw,26px); color:#e1bee7;
      text-shadow:0 2px 8px rgba(0,0,0,.5);
      text-align:center; padding:clamp(6px,1.5vw,10px) 16px 0;
      flex-shrink:0; position:relative; z-index:1; line-height:1.2;
    }

    /* ── Question card ─────────────────────────────────────────────── */
    #question-card {
      background:rgba(255,255,255,.11); border-radius:28px;
      padding:clamp(12px,3vw,22px) clamp(10px,3vw,24px);
      display:flex; flex-direction:column; align-items:center; gap:4px;
      box-shadow:0 8px 32px rgba(0,0,0,.3), 0 0 0 3px rgba(179,229,252,.25);
      margin:clamp(8px,2vw,14px) clamp(12px,3vw,20px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #question-card.pop-in { animation:cardPop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cardPop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }

    .letter-parade {
      display:flex; align-items:center; justify-content:center;
      gap:clamp(6px,1.8vw,14px); flex-wrap:nowrap;
    }

    .lbox {
      width:clamp(64px,17vw,92px); height:clamp(64px,17vw,92px);
      border-radius:18px;
      background:linear-gradient(145deg,#e8eaf6,#c5cae9);
      box-shadow:0 4px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      position:relative; flex-shrink:0;
    }
    .lbox .crown-dec {
      position:absolute; top:-13px; left:50%; transform:translateX(-50%);
      font-size:clamp(12px,3vw,18px); line-height:1;
    }
    .lbox .lchar {
      font-size:clamp(30px,8vw,50px); color:#283593; line-height:1; font-weight:bold;
    }
    .lbox.qbox {
      background:linear-gradient(145deg,#fff9c4,#ffe082);
      box-shadow:0 4px 16px rgba(0,0,0,.25), 0 0 0 3px rgba(255,193,7,.5), inset 0 2px 0 rgba(255,255,255,.6);
      animation:qPulse 1.4s ease-in-out infinite;
    }
    @keyframes qPulse {
      0%,100% { transform:scale(1); box-shadow:0 4px 16px rgba(0,0,0,.25),0 0 0 3px rgba(255,193,7,.5),inset 0 2px 0 rgba(255,255,255,.6); }
      50%     { transform:scale(1.08); box-shadow:0 4px 24px rgba(0,0,0,.3),0 0 0 5px rgba(255,193,7,.8),inset 0 2px 0 rgba(255,255,255,.6); }
    }
    .lbox.qbox .lchar { font-size:clamp(28px,7vw,44px); color:#f57f17; }

    /* smaller boxes for Hard (4 in a row) */
    .lbox.sm {
      width:clamp(55px,13.5vw,76px); height:clamp(55px,13.5vw,76px);
    }
    .lbox.sm .lchar { font-size:clamp(24px,6.5vw,42px); }
    .lbox.sm.qbox .lchar { font-size:clamp(22px,6vw,38px); }
    .lbox.sm .crown-dec { top:-11px; font-size:clamp(10px,2.5vw,15px); }

    .arrow-sym {
      font-size:clamp(22px,6vw,38px); color:rgba(255,255,255,.75); flex-shrink:0;
    }

    /* ── Choices ─────────────────────────────────────────────────── */
    #choices {
      display:grid; gap:clamp(10px,2.5vw,14px);
      padding:clamp(8px,2vw,12px) clamp(12px,3vw,20px) clamp(10px,2.5vw,16px);
      width:100%; max-width:460px; flex-shrink:0; position:relative; z-index:1;
    }
    #choices.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    #choices.cols-2x2 { grid-template-columns:1fr 1fr; }

    .choice-btn {
      min-height:clamp(90px,22vw,118px);
      border-radius:22px; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:clamp(38px,10vw,58px); font-weight:bold;
      box-shadow:0 4px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3);
      transition:transform .1s; touch-action:manipulation; line-height:1;
    }
    .choice-btn:active { transform:scale(.91); }

    .c-blue   { background:linear-gradient(145deg,#b3e5fc,#039be5); color:#01579b; }
    .c-pink   { background:linear-gradient(145deg,#f8bbd0,#e91e63); color:#880e4f; }
    .c-yellow { background:linear-gradient(145deg,#fff9c4,#f9a825); color:#4a2000; }
    .c-purple { background:linear-gradient(145deg,#e1bee7,#8e24aa); color:#fff; }
    .c-green  { background:linear-gradient(145deg,#c8e6c9,#43a047); color:#1b5e20; }
    .c-teal   { background:linear-gradient(145deg,#b2ebf2,#00acc1); color:#006064; }

    .choice-btn.correct-flash { animation:correctPop .5s ease-out; }
    .choice-btn.wrong-flash   { animation:wrongShake .42s ease-out; }
    @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8)} 100%{transform:scale(1)} }
    @keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 60%{transform:translateX(12px)} 80%{transform:translateX(-6px)} }

    /* ── Sparkles ───────────────────────────────────────────────── */
    .sp    { position:fixed; pointer-events:none; z-index:50; animation:spOut .75s ease-out forwards; }
    @keyframes spOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.5);opacity:0} }
    .sp-dot { position:fixed; pointer-events:none; z-index:50; border-radius:50%; animation:dotFly .8s ease-out forwards; }
    @keyframes dotFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0} }

    /* ── Overlays ───────────────────────────────────────────────── */
    .overlay {
      position:fixed; inset:0; z-index:99;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:clamp(10px,2.5vw,16px);
      opacity:0; pointer-events:none; transition:opacity .35s;
    }
    .overlay.show { opacity:1; pointer-events:all; }

    #tier-overlay { background:rgba(0,0,0,.72); }
    #to-icon  { font-size:clamp(60px,16vw,96px); }
    #to-title { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-shadow:0 0 20px #ff9800; text-align:center; }
    #to-sub   { font-size:clamp(15px,4vw,22px); color:#fff; text-align:center; padding:0 24px; }
    .ov-btn {
      margin-top:6px; padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,4.8vw,26px); border-radius:50px; border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00; font-weight:bold; cursor:pointer;
      font-family:inherit; box-shadow:0 4px 16px rgba(255,180,0,.5);
      touch-action:manipulation;
    }

    #cel-overlay { background:rgba(0,0,0,.70); }
    #cel-letter  {
      width:clamp(110px,28vw,160px); height:clamp(110px,28vw,160px);
      border-radius:28px; background:linear-gradient(145deg,#e8eaf6,#c5cae9);
      box-shadow:0 6px 28px rgba(0,0,0,.3), 0 0 0 5px rgba(255,215,0,.6);
      display:flex; align-items:center; justify-content:center;
      font-size:clamp(60px,16vw,100px); color:#283593; line-height:1; font-weight:bold;
      animation:celBounce .5s ease-out;
    }
    @keyframes celBounce { 0%{transform:scale(.3)} 65%{transform:scale(1.18)} 100%{transform:scale(1)} }
    #cel-label { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-align:center; padding:0 20px; text-shadow:0 0 18px rgba(255,215,0,.55); }
    #cel-fact  { font-size:clamp(14px,3.6vw,20px); color:#e1bee7; text-align:center; padding:0 24px; line-height:1.35; }

    #win-overlay { background:linear-gradient(160deg,#1a237e 0%,#6a1b9a 100%); }
    #win-crown   { font-size:clamp(72px,18vw,110px); animation:crowBounce 1.1s ease-in-out infinite; }
    @keyframes crowBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    #win-title { font-size:clamp(26px,7vw,46px); color:#ffd700; text-shadow:0 0 24px #ff9800; text-align:center; }
    #win-sub   { font-size:clamp(15px,4vw,22px); color:#e1bee7; text-align:center; padding:0 24px; }
    #win-score { font-size:clamp(20px,5vw,32px); color:#80d8ff; font-weight:bold; }

    .confetti {
      position:fixed; pointer-events:none; z-index:101; border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall {
      0%  { top:-20px; opacity:1; transform:rotate(0deg); }
      100%{ top:110vh; opacity:.2; transform:rotate(var(--cr,360deg)); }
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="tier-badge" class="tier-easy">🌱 Easy</div>
    <div id="score-label">⭐ 0</div>
    <div id="round-label">1 / 9</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>

  <div id="prompt">Which letter comes next? 🔤</div>

  <div id="question-card">
    <div class="letter-parade" id="parade"></div>
  </div>

  <div id="choices" class="cols-3"></div>

  <!-- Tier transition overlay -->
  <div class="overlay" id="tier-overlay">
    <div id="to-icon">⭐</div>
    <div id="to-title">Amazing!</div>
    <div id="to-sub">Ready for the next challenge?</div>
    <button class="ov-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
  </div>

  <!-- Per-round celebrate overlay -->
  <div class="overlay" id="cel-overlay">
    <div id="cel-letter">B</div>
    <div id="cel-label">That's B!</div>
    <div id="cel-fact">🐝 Butterfly starts with B!</div>
    <button class="ov-btn" onclick="nextRound()">Next ➡️</button>
  </div>

  <!-- Win overlay -->
  <div class="overlay" id="win-overlay">
    <div id="win-crown">👑</div>
    <div id="win-title">Alphabet Princess! 🔤</div>
    <div id="win-sub">You know the whole alphabet march! ✨</div>
    <div id="win-score"></div>
    <button class="ov-btn" onclick="startGame()">Play Again 🌸</button>
  </div>

<script>
'use strict';

// ── Audio ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(f, type, dur, vol, delay) {
  delay = delay || 0; vol = vol || 0.15;
  try {
    var c = getAudio(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type || 'sine'; o.frequency.value = f;
    var t0 = c.currentTime + delay;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  } catch(e) {}
}
function playCorrect()   { [523,659,784,1047].forEach(function(f,i){ tone(f,'sine',0.18,0.18,i*0.07); }); }
function playWrong()     { tone(260,'sawtooth',0.18,0.12); setTimeout(function(){ tone(210,'sawtooth',0.14,0.09); },160); }
function playCelebrate() { [523,587,659,698,784,880,1047].forEach(function(f,i){ tone(f,'sine',0.22,0.17,i*0.065); }); }
function playTierUp()    { [392,494,587,784,1047].forEach(function(f,i){ tone(f,'triangle',0.25,0.18,i*0.09); }); }
function playWin()       { [523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,'sine',0.28,0.2,i*0.1); }); }

// ── Letter fun facts ──────────────────────────────────────────────────────────
var LETTER_FACTS = {
  'A':'🍎 Apple starts with A!',
  'B':'🦋 Butterfly starts with B!',
  'C':'🏰 Castle starts with C!',
  'D':'💃 Dance starts with D!',
  'E':'🐘 Elephant starts with E!',
  'F':'🌸 Flower starts with F!',
  'G':'💎 Gem starts with G!',
  'H':'❤️ Heart starts with H!',
  'I':'🍦 Ice cream starts with I!',
  'J':'👑 Jewel starts with J!',
  'K':'🔑 Key starts with K!',
  'L':'🦁 Lion starts with L!',
  'M':'🌙 Moon starts with M!',
  'N':'🌈 Nature starts with N!',
  'O':'🦉 Owl starts with O!',
  'P':'🦄 Princess starts with P!',
  'Q':'👸 Queen starts with Q!',
  'R':'🌹 Rose starts with R!',
  'S':'⭐ Star starts with S!',
  'T':'🌷 Tulip starts with T!',
  'U':'🦄 Unicorn starts with U!',
  'V':'🔮 Violet starts with V!',
  'W':'🌊 Wave starts with W!',
  'X':'🎵 Xylophone starts with X!',
  'Y':'💛 Yellow starts with Y!',
  'Z':'🦓 Zebra starts with Z!',
};

// ── Scenario pools ────────────────────────────────────────────────────────────
// type:'after'  — what comes AFTER q?
// type:'before' — what comes BEFORE q?
// type:'gap'    — sequence of 4 letters with '?' at index 2
var EASY = [
  { type:'after',  q:'A', answer:'B', wrongs:['C','D'] },
  { type:'after',  q:'C', answer:'D', wrongs:['B','E'] },
  { type:'after',  q:'E', answer:'F', wrongs:['D','G'] },
  { type:'after',  q:'G', answer:'H', wrongs:['F','I'] },
  { type:'after',  q:'I', answer:'J', wrongs:['H','K'] },
  { type:'after',  q:'K', answer:'L', wrongs:['J','M'] },
];

var MEDIUM = [
  { type:'before', q:'D', answer:'C', wrongs:['E','B'] },
  { type:'before', q:'F', answer:'E', wrongs:['G','D'] },
  { type:'before', q:'H', answer:'G', wrongs:['I','F'] },
  { type:'before', q:'J', answer:'I', wrongs:['K','H'] },
  { type:'before', q:'L', answer:'K', wrongs:['M','J'] },
  { type:'before', q:'N', answer:'M', wrongs:['O','L'] },
];

var HARD = [
  { type:'gap', seq:['A','B','?','D'], answer:'C', wrongs:['E','F','A'] },
  { type:'gap', seq:['D','E','?','G'], answer:'F', wrongs:['H','C','B'] },
  { type:'gap', seq:['H','I','?','K'], answer:'J', wrongs:['L','G','M'] },
  { type:'gap', seq:['L','M','?','O'], answer:'N', wrongs:['P','K','Q'] },
  { type:'gap', seq:['P','Q','?','S'], answer:'R', wrongs:['T','O','U'] },
  { type:'gap', seq:['T','U','?','W'], answer:'V', wrongs:['X','S','Y'] },
];

var TIER_INFO = [
  { label:'🌱 Easy',   cls:'tier-easy',   icon:'🌟', title:'Great job!',   sub:'Now — what comes BEFORE? ➡️', choiceCols:3 },
  { label:'🌸 Medium', cls:'tier-medium', icon:'💫', title:'Wonderful!',   sub:'4 choices — fill in the gap! 🔤', choiceCols:3 },
  { label:'⭐ Hard',   cls:'tier-hard',   choiceCols:4 },
];
var TOTAL = 9;

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var SLOT_COLS = ['c-blue','c-pink','c-yellow','c-purple','c-green','c-teal'];

// ── State ─────────────────────────────────────────────────────────────────────
var round = 0, score = 0, locked = false, currentQ = null, roundPlan = [];

function buildPlan() {
  return shuffle(EASY).slice(0,3)
    .concat(shuffle(MEDIUM).slice(0,3))
    .concat(shuffle(HARD).slice(0,3));
}

function getTierIdx(r) { return r <= 3 ? 0 : r <= 6 ? 1 : 2; }

// ── Background letters ────────────────────────────────────────────────────────
(function initBg() {
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var icons   = letters.concat(['👑','✨','⭐','🌸','🔤','🌟','💫','🔡']);
  for (var i = 0; i < 16; i++) {
    var el = document.createElement('div');
    el.className = 'bg-icon';
    el.textContent = icons[i % icons.length];
    el.style.left = (3 + Math.random() * 94) + 'vw';
    el.style.animationDuration = (12 + Math.random() * 14) + 's';
    el.style.animationDelay = -(Math.random() * 22) + 's';
    document.body.appendChild(el);
  }
})();

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('cel-overlay').classList.remove('show');
  document.getElementById('tier-overlay').classList.remove('show');
  round = 0; score = 0;
  document.getElementById('score-label').textContent = '⭐ 0';
  document.getElementById('progress-fill').style.width = '0%';
  roundPlan = buildPlan();
  nextRound();
}

function nextRound() {
  document.getElementById('cel-overlay').classList.remove('show');
  if (round >= TOTAL) { endGame(); return; }

  var prevTier = getTierIdx(round);
  round++;
  locked = false;
  updateHUD();

  var newTier = getTierIdx(round);
  if (round > 1 && newTier !== prevTier) {
    showTierOverlay(newTier);
  } else {
    showQuestion();
  }
}

function showTierOverlay(tIdx) {
  var ti = TIER_INFO[tIdx - 1];
  document.getElementById('to-icon').textContent  = ti.icon;
  document.getElementById('to-title').textContent = ti.title;
  document.getElementById('to-sub').textContent   = ti.sub;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();
  confetti(42);
}

function resumeFromTier() {
  document.getElementById('tier-overlay').classList.remove('show');
  showQuestion();
}

function updateHUD() {
  var tIdx  = getTierIdx(round);
  var ti    = TIER_INFO[tIdx];
  var badge = document.getElementById('tier-badge');
  badge.textContent = ti.label;
  badge.className   = ti.cls;
  document.getElementById('round-label').textContent = round + ' / ' + TOTAL;
  document.getElementById('progress-fill').style.width = ((round - 1) / TOTAL * 100) + '%';
}

function makeLetterBox(ch, isSmall) {
  var isQ = (ch === '?');
  var box = document.createElement('div');
  box.className = 'lbox' + (isSmall ? ' sm' : '') + (isQ ? ' qbox' : '');
  if (!isQ) {
    var crown = document.createElement('span');
    crown.className = 'crown-dec';
    crown.textContent = '👑';
    box.appendChild(crown);
  }
  var lchar = document.createElement('span');
  lchar.className = 'lchar';
  lchar.textContent = isQ ? '?' : ch;
  box.appendChild(lchar);
  return box;
}

function makeArrow() {
  var s = document.createElement('span');
  s.className = 'arrow-sym';
  s.textContent = '→';
  return s;
}

function showQuestion() {
  var tIdx = getTierIdx(round);
  var q    = roundPlan[round - 1];
  currentQ = q;

  var prompts;
  if (q.type === 'after') {
    prompts = ['Which letter comes AFTER? 🔤','What comes NEXT? 🔤','Which letter marches after? 👑','Tap the letter that comes AFTER! ✨'];
  } else if (q.type === 'before') {
    prompts = ['Which letter comes BEFORE? 🔤','What comes BEFORE? 👑','Which letter marches before? ✨','Tap the letter that comes BEFORE! 🔤'];
  } else {
    prompts = ['Which letter is MISSING? 🔤','Fill in the gap! ✨','Find the missing letter! 👑','Which letter belongs in the gap? 🌟'];
  }
  document.getElementById('prompt').textContent = prompts[Math.floor(Math.random() * prompts.length)];

  var card = document.getElementById('question-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');

  var parade = document.getElementById('parade');
  parade.innerHTML = '';
  var isSmall = (q.type === 'gap');

  if (q.type === 'after') {
    parade.appendChild(makeLetterBox(q.q, false));
    parade.appendChild(makeArrow());
    parade.appendChild(makeLetterBox('?', false));
  } else if (q.type === 'before') {
    parade.appendChild(makeLetterBox('?', false));
    parade.appendChild(makeArrow());
    parade.appendChild(makeLetterBox(q.q, false));
  } else {
    q.seq.forEach(function(ch) {
      parade.appendChild(makeLetterBox(ch, true));
    });
  }

  // Build answer choices
  var allChoices;
  if (q.type === 'gap') {
    allChoices = shuffle([q.answer].concat(q.wrongs.slice(0,3)));
  } else {
    allChoices = shuffle([q.answer].concat(q.wrongs.slice(0,2)));
  }

  var choicesEl = document.getElementById('choices');
  var ti = TIER_INFO[tIdx];
  choicesEl.className = (allChoices.length === 4) ? 'cols-2x2' : 'cols-3';
  choicesEl.innerHTML = '';

  allChoices.forEach(function(ch, idx) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn ' + SLOT_COLS[idx % SLOT_COLS.length];
    btn.textContent = ch;
    var isCorrect = (ch === q.answer);
    btn.addEventListener('pointerdown', function() { handleTap(btn, isCorrect, ch); });
    choicesEl.appendChild(btn);
  });
}

// ── Tap handling ──────────────────────────────────────────────────────────────
function handleTap(btn, isCorrect, ch) {
  if (locked) return;
  if (isCorrect) {
    locked = true;
    score++;
    document.getElementById('score-label').textContent = '⭐ ' + score;
    btn.classList.add('correct-flash');
    playCorrect();
    sparkleBurst(btn);
    setTimeout(function() {
      btn.classList.remove('correct-flash');
      showCelebrate(ch);
    }, 500);
  } else {
    btn.classList.add('wrong-flash');
    playWrong();
    setTimeout(function() { btn.classList.remove('wrong-flash'); }, 450);
  }
}

function showCelebrate(ch) {
  document.getElementById('cel-letter').textContent = ch;
  document.getElementById('cel-label').textContent  = 'That\'s ' + ch + '! 🎉';
  document.getElementById('cel-fact').textContent   = LETTER_FACTS[ch] || (ch + ' is in the royal alphabet!');
  document.getElementById('cel-overlay').classList.add('show');
  playCelebrate();
  confetti(30);
}

function endGame() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('win-score').textContent = 'Score: ' + score + ' / ' + TOTAL + ' ⭐';
  document.getElementById('win-overlay').classList.add('show');
  playWin();
  confetti(60);
  setTimeout(function() { confetti(40); }, 700);
}

// ── Particles ─────────────────────────────────────────────────────────────────
function sparkleBurst(btn) {
  var r  = btn.getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top  + r.height / 2;
  var ems  = ['✨','💫','⭐','👑','🌟','🔤','🌸','💎','🎉','🌈','💖','🔡','🏆','🎀','🌺','💜'];
  var cols = ['#80d8ff','#ffd700','#f48fb1','#ce93d8','#a5d6a7','#ffab91','#fff','#b39ddb'];
  for (var i = 0; i < 18; i++) {
    var el = document.createElement('div');
    el.className = 'sp';
    el.textContent = ems[i % ems.length];
    el.style.cssText = 'font-size:' + (16 + Math.random() * 14) + 'px;left:' + (cx + (Math.random() - .5) * 120) + 'px;top:' + (cy + (Math.random() - .5) * 100) + 'px;animation-delay:' + (Math.random() * .15) + 's;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), 900);
  }
  for (var j = 0; j < 20; j++) {
    var dot = document.createElement('div');
    dot.className = 'sp-dot';
    var a    = Math.random() * Math.PI * 2;
    var dist = 28 + Math.random() * 80;
    var sz   = 5 + Math.random() * 10;
    dot.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (cx - sz/2) + 'px;top:' + (cy - sz/2) + 'px;background:' + cols[j % cols.length] + ';--tx:' + (Math.cos(a) * dist) + 'px;--ty:' + (Math.sin(a) * dist) + 'px;';
    document.body.appendChild(dot);
    setTimeout(function(e) { return function() { e.remove(); }; }(dot), 950);
  }
}

function confetti(count) {
  var cols = ['#80d8ff','#ffd700','#f48fb1','#ce93d8','#a5d6a7','#ffab91','#fff','#b39ddb'];
  for (var i = 0; i < count; i++) {
    var el  = document.createElement('div');
    el.className = 'confetti';
    var dur = 1.4 + Math.random() * 1.8;
    var sz  = 6 + Math.random() * 10;
    el.style.cssText = 'left:' + Math.random() * 100 + 'vw;width:' + sz + 'px;height:' + sz * (0.4 + Math.random() * 0.7) + 'px;background:' + cols[i % cols.length] + ';animation-duration:' + dur + 's;animation-delay:' + Math.random() * .5 + 's;--cr:' + ((Math.random() - .5) * 720) + 'deg;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), (dur + 0.6) * 1000 + 200);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
startGame();
</script>
