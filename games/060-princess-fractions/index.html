<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Fractions 🍰</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background:linear-gradient(160deg,#1a0028 0%,#7b1fa2 55%,#e91e63 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; padding-bottom:12px;
    }

    .bg-gem { position:fixed; pointer-events:none; animation:floatUp linear infinite; opacity:.13; font-size:clamp(14px,3.5vw,22px); }
    @keyframes floatUp { 0%{transform:translateY(110vh) rotate(0)} 100%{transform:translateY(-15vh) rotate(360deg)} }

    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0; flex-shrink:0;
    }
    #tier-badge { font-size:clamp(13px,3.2vw,18px); padding:5px 15px; border-radius:20px; font-weight:bold; }
    .tier-easy   { background:linear-gradient(135deg,#a5d6a7,#66bb6a); color:#1b5e20; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#ffd54f); color:#5a3000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#ab47bc); color:#fff; }
    #score-display { font-size:clamp(14px,3.5vw,20px); color:#ffd700; text-shadow:0 0 8px rgba(255,215,0,.5); }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.9); }

    #progress-wrap { width:100%; padding:6px clamp(14px,4vw,22px) 0; flex-shrink:0; }
    #progress-track { background:rgba(255,255,255,.18); border-radius:20px; height:clamp(8px,2vw,12px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#ffd700,#e040fb); transition:width .35s ease; width:0%; box-shadow:0 0 8px rgba(255,215,0,.45); }

    #prompt-wrap {
      flex-shrink:0; padding:clamp(10px,3vw,18px) 16px clamp(4px,1.5vw,8px); text-align:center;
    }
    #princess-emoji { font-size:clamp(36px,10vw,54px); display:block; margin-bottom:4px; }
    #prompt-text {
      font-size:clamp(17px,5vw,30px); color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.45);
      padding:0 12px; line-height:1.2;
    }

    #choices-wrap {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:0 clamp(10px,3vw,20px); width:100%;
    }
    #choices {
      display:grid; gap:clamp(10px,2.5vw,18px);
      width:100%; max-width:420px;
    }
    #choices.cols-2 { grid-template-columns:1fr 1fr; }
    #choices.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    #choices.cols-4 { grid-template-columns:1fr 1fr; }

    .choice-btn {
      border-radius:22px; border:3px solid rgba(255,255,255,.38);
      background:rgba(255,255,255,.16);
      backdrop-filter:blur(6px);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; cursor:pointer; padding:clamp(8px,2vw,14px) 6px;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2);
      transition:transform .1s; touch-action:manipulation;
      min-height:clamp(90px,22vw,130px);
    }
    .choice-btn:active { transform:scale(.92); }

    .cake-wrap {
      width:clamp(60px,16vw,90px); height:clamp(60px,16vw,90px);
      pointer-events:none;
    }
    .cols-3 .cake-wrap { width:clamp(52px,13vw,76px); height:clamp(52px,13vw,76px); }
    .cols-4 .cake-wrap { width:clamp(48px,12vw,70px); height:clamp(48px,12vw,70px); }

    .piece-dots { font-size:clamp(11px,2.8vw,16px); pointer-events:none; line-height:1.1; }

    .choice-btn.correct { animation:correctPop .5s ease-out; background:rgba(160,255,160,.35); border-color:#66bb6a; }
    .choice-btn.wrong   { animation:wobble .45s ease-out; background:rgba(255,100,100,.25); }
    @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8)} 100%{transform:scale(1)} }
    @keyframes wobble { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-11px)} 60%{transform:translateX(11px)} 80%{transform:translateX(-6px)} }

    .sp { position:fixed; pointer-events:none; z-index:50; animation:sparkOut .75s ease-out forwards; }
    @keyframes sparkOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.6);opacity:0} }

    .overlay {
      position:fixed; inset:0; background:rgba(20,0,50,.88);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      z-index:99; opacity:0; pointer-events:none; transition:opacity .35s;
    }
    .overlay.show { opacity:1; pointer-events:all; }
    .ov-emoji { font-size:clamp(60px,17vw,100px); }
    .ov-title { font-size:clamp(24px,7vw,46px); color:#ffd700; text-align:center; padding:0 20px; }
    .ov-sub   { font-size:clamp(15px,4vw,22px); color:#f8bbd0; text-align:center; padding:0 20px; opacity:.9; }
    .ov-score { font-size:clamp(20px,5.5vw,32px); color:#ffd700; }
    .btn-next {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,54px); font-size:clamp(18px,5vw,26px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00; font-weight:bold; cursor:pointer; font-family:inherit;
      min-height:64px; min-width:180px; box-shadow:0 4px 18px rgba(255,180,0,.5);
    }
    .cf { position:fixed; pointer-events:none; z-index:100; border-radius:3px; animation:cfFall linear forwards; }
    @keyframes cfFall { 0%{top:-20px;opacity:1;transform:rotate(0)} 100%{top:110vh;opacity:.2;transform:rotate(720deg)} }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-display">0 ⭐</div>
  <div id="round-label">1 / 9</div>
</div>
<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="prompt-wrap">
  <span id="princess-emoji">👸</span>
  <div id="prompt-text">Which cake is cut in half? ✌️</div>
</div>

<div id="choices-wrap">
  <div id="choices" class="cols-2"></div>
</div>

<div class="overlay" id="round-overlay">
  <div class="ov-emoji" id="ov-emoji">🍰</div>
  <div class="ov-title" id="ov-title">Wonderful!</div>
  <div class="ov-sub"   id="ov-sub">Ready for more?</div>
  <button class="btn-next" id="round-btn">Next Round ➡️</button>
</div>

<div class="overlay" id="end-overlay">
  <div class="ov-emoji">👑</div>
  <div class="ov-title">Fraction Princess! 🍰</div>
  <div class="ov-sub">You know how to share! ✨</div>
  <div class="ov-score" id="final-score">0 ⭐</div>
  <button class="btn-next" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(f,type,d,v=.16){
  try{
    const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
    o.start(); o.stop(c.currentTime+d);
  }catch(e){}
}
function playCorrect()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.18,.2),i*70)); }
function playWrong()    { tone(260,'sawtooth',.18,.13); setTimeout(()=>tone(210,'sawtooth',.14,.1),160); }
function playTierUp()   { [523,659,784,880,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.28,.2),i*90)); }
function playFinalWin() { [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.32,.22),i*95)); }

// SVG cake generator — draws a circle divided into 'den' equal slices
function polarXY(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function slicePath(cx, cy, r, startDeg, endDeg) {
  const [x1,y1] = polarXY(cx,cy,r,startDeg);
  const [x2,y2] = polarXY(cx,cy,r,endDeg);
  const large = (endDeg - startDeg) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r},0,${large},1,${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}

// Pastel slice colours cycling per piece
const SLICE_COLORS = ['#ff4081','#f06292','#e91e63','#f48fb1','#ad1457','#ff80ab'];
const PLATE_COLOR  = '#fff9e6';

function makeCakeSVG(den) {
  const cx=50, cy=50, r=40;
  let body = `<circle cx="${cx}" cy="${cy}" r="47" fill="${PLATE_COLOR}" stroke="#ffd700" stroke-width="1.5"/>`;

  if (den === 1) {
    // Whole cake — solid with subtle swirl decoration
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ff4081"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${r-10}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="5,4"/>`;
    body += `<circle cx="${cx}" cy="${cy}" r="8" fill="rgba(255,255,255,0.25)"/>`;
  } else {
    for (let i = 0; i < den; i++) {
      const s = i * 360 / den, e = (i + 1) * 360 / den;
      body += `<path d="${slicePath(cx,cy,r,s,e)}" fill="${SLICE_COLORS[i%SLICE_COLORS.length]}" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
  }

  // Frosted rim
  body += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>`;
  // Cherry on top
  body += `<circle cx="${cx}" cy="14" r="5.5" fill="#b71c1c"/>`;
  body += `<line x1="${cx}" y1="19.5" x2="${cx}" y2="27" stroke="#388e3c" stroke-width="2" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">${body}</svg>`;
}

// piece-count indicators: N cake-slice emoji
const PIECE_DOTS = ['','🍰','🍰🍰','🍰🍰🍰','🍰🍰🍰🍰'];
const FRACTION_NAMES = ['','Whole','Half','Thirds','Quarters'];

// Round pool — 6 per tier, 3 randomly chosen each game
// correct = denominator (1=whole, 2=half, 3=thirds, 4=quarters)
// opts = denominators to show as choices
const POOL = {
  easy: [
    { q:"Which cake is cut in 2? ✌️",     pEmoji:'✌️',  correct:2, opts:[1,2] },
    { q:"Tap the WHOLE cake! 🎂",           pEmoji:'🎂',  correct:1, opts:[1,2] },
    { q:"Which cake has MORE pieces? 🔢",  pEmoji:'🔢',  correct:4, opts:[2,4] },
    { q:"Which cake has FEWER pieces? 🎂", pEmoji:'🎂',  correct:2, opts:[2,4] },
    { q:"Which is NOT cut? (1 piece!) 🎂", pEmoji:'🎂',  correct:1, opts:[1,4] },
    { q:"Which has 2 equal pieces? ✂️",    pEmoji:'✂️',  correct:2, opts:[1,2] },
  ],
  medium: [
    { q:"Which cake has 2 equal pieces? ✌️",   pEmoji:'✌️',  correct:2, opts:[1,2,4] },
    { q:"Which cake has 4 equal pieces? 🤚",   pEmoji:'🤚',  correct:4, opts:[1,2,4] },
    { q:"Tap the WHOLE cake! 🎂",               pEmoji:'🎂',  correct:1, opts:[1,2,4] },
    { q:"Which has the MOST pieces? 🔢",       pEmoji:'🔢',  correct:4, opts:[1,2,4] },
    { q:"Which has FEWEST pieces? 🎂",         pEmoji:'🎂',  correct:1, opts:[1,2,4] },
    { q:"Tap the HALF! (2 equal pieces) ✌️",   pEmoji:'✌️',  correct:2, opts:[1,2,4] },
  ],
  hard: [
    { q:"Tap the cake with 2 equal pieces! ✌️",   pEmoji:'✌️',  correct:2, opts:[1,2,3,4] },
    { q:"Tap the cake with 4 equal pieces! 🤚",   pEmoji:'🤚',  correct:4, opts:[1,2,3,4] },
    { q:"Tap the cake with 3 equal pieces! 3️⃣",  pEmoji:'3️⃣', correct:3, opts:[1,2,3,4] },
    { q:"Tap the WHOLE cake! (1 big piece) 🎂",   pEmoji:'🎂',  correct:1, opts:[1,2,3,4] },
    { q:"Which has the MOST pieces? 🔢",          pEmoji:'🔢',  correct:4, opts:[1,2,3,4] },
    { q:"Tap the cake cut in HALF! ✌️",           pEmoji:'✌️',  correct:2, opts:[1,2,3,4] },
  ],
};

const TIERS = [
  { label:'🌱 Easy',   cls:'tier-easy',   pool:'easy',   choices:2 },
  { label:'🌸 Medium', cls:'tier-medium', pool:'medium', choices:3 },
  { label:'🌺 Hard',   cls:'tier-hard',   pool:'hard',   choices:4 },
];
const TOTAL = 9;

let round=0, score=0, locked=false, currentQ=null, tierOrders={};

function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function getTierIdx(r){ return r<=3?0:r<=6?1:2; }

function startGame(){
  document.getElementById('end-overlay').classList.remove('show');
  document.getElementById('round-overlay').classList.remove('show');
  round=0; score=0; locked=false;
  // Pre-shuffle each tier pool
  tierOrders = {
    easy:   shuffle([0,1,2,3,4,5]).slice(0,3),
    medium: shuffle([0,1,2,3,4,5]).slice(0,3),
    hard:   shuffle([0,1,2,3,4,5]).slice(0,3),
  };
  makeBgGems();
  nextRound();
}

function nextRound(){
  document.getElementById('round-overlay').classList.remove('show');
  if(round>=TOTAL){ endGame(); return; }
  round++; locked=false;
  updateHUD();

  const tierIdx = getTierIdx(round);
  const tier = TIERS[tierIdx];
  const posInTier = ((round-1) % 3); // 0,1,2 within this tier
  const qIdx = tierOrders[tier.pool][posInTier];
  currentQ = POOL[tier.pool][qIdx];

  document.getElementById('princess-emoji').textContent = currentQ.pEmoji;
  document.getElementById('prompt-text').textContent = currentQ.q;

  // Build option buttons
  const grid = document.getElementById('choices');
  grid.className = tier.choices===4?'cols-4':tier.choices===3?'cols-3':'cols-2';
  grid.innerHTML = '';

  currentQ.opts.forEach(den => {
    const isCorrect = (den === currentQ.correct);
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<div class="cake-wrap">${makeCakeSVG(den)}</div><div class="piece-dots">${PIECE_DOTS[den]}</div>`;
    btn.addEventListener('pointerdown', ()=>handleTap(btn, isCorrect, den));
    grid.appendChild(btn);
  });
}

function handleTap(btn, ok, den){
  if(locked) return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true; score++;
    btn.classList.add('correct');
    playCorrect();
    const r=btn.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
    updateHUD();
    setTimeout(()=>{ btn.classList.remove('correct'); showRoundOverlay(den); },560);
  } else {
    btn.classList.add('wrong');
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),450);
  }
}

function showRoundOverlay(correctDen){
  const tierIdx=getTierIdx(round);
  const nextTierIdx=getTierIdx(round+1);
  const isTierEnd=(round<TOTAL && nextTierIdx>tierIdx);

  if(isTierEnd){
    playTierUp(); confetti(42);
    const next=TIERS[nextTierIdx];
    document.getElementById('ov-emoji').textContent='🎉';
    document.getElementById('ov-title').textContent='Tier complete! ✨';
    document.getElementById('ov-sub').textContent=next.label+' starts now!';
  } else {
    const msgs=['Amazing! 🌟','You got it! 👑','Brilliant! ✨','Yes! 💎','Wonderful! 🌸','Perfect! 🎀'];
    document.getElementById('ov-emoji').textContent=PIECE_DOTS[correctDen];
    document.getElementById('ov-title').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('ov-sub').textContent=FRACTION_NAMES[correctDen]+'! That\'s '+correctDen+(correctDen===1?' piece!':' equal pieces!');
  }

  document.getElementById('round-btn').onclick=nextRound;
  document.getElementById('round-overlay').classList.add('show');
}

function endGame(){
  document.getElementById('final-score').textContent=score+' ⭐';
  document.getElementById('end-overlay').classList.add('show');
  playFinalWin(); confetti(60); setTimeout(()=>confetti(42),700);
}

function updateHUD(){
  const tier=TIERS[getTierIdx(round)];
  const badge=document.getElementById('tier-badge');
  badge.textContent=tier.label; badge.className=tier.cls;
  document.getElementById('score-display').textContent=score+' ⭐';
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';
}

function burst(cx,cy){
  const cols=['#ffd700','#f48fb1','#fff','#ce93d8','#e040fb','#ff8fab'];
  const icons=['✨','💫','⭐','🍰','🌟'];
  for(let i=0;i<18;i++){
    const el=document.createElement('div'); el.className='sp';
    const a=Math.random()*Math.PI*2, dist=30+Math.random()*75, sz=7+Math.random()*10;
    if(i<5){
      el.style.cssText=`left:${cx+Math.cos(a)*dist}px;top:${cy+Math.sin(a)*dist}px;font-size:${18+Math.random()*10}px;background:none;border-radius:0;`;
      el.textContent=icons[i%icons.length];
    } else {
      el.style.cssText=`left:${cx+Math.cos(a)*dist-sz/2}px;top:${cy+Math.sin(a)*dist-sz/2}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};border-radius:50%;`;
    }
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }
}

function confetti(count){
  const cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b2ebf2','#a5d6a7','#ff8a65'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='cf';
    const sz=6+Math.random()*10;
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-duration:${1.4+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}

function makeBgGems(){
  document.querySelectorAll('.bg-gem').forEach(e=>e.remove());
  const icons=['✨','💫','🍰','⭐','🌟','💎','🎂'];
  for(let i=0;i<10;i++){
    const el=document.createElement('div'); el.className='bg-gem';
    el.textContent=icons[i%icons.length];
    el.style.left=(4+Math.random()*92)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*14)+'s';
    document.body.appendChild(el);
  }
}

startGame();
</script>
</body>
</html>
