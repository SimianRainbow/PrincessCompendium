<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Dot Magic ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#1a0038 0%,#4a148c 45%,#1565c0 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-gem{position:fixed;pointer-events:none;animation:bgFloat linear infinite;opacity:.09;font-size:clamp(16px,4vw,26px);z-index:0;}
    @keyframes bgFloat{0%{transform:translateY(110vh) rotate(0deg)}100%{transform:translateY(-15vh) rotate(360deg)}}

    /* Header */
    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;font-weight:bold;border:2px solid rgba(255,255,255,.38);}
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);color:#fff;}
    #score-label{font-size:clamp(16px,4vw,22px);color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6);min-width:36px;}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(255,255,255,.85);}

    /* Progress bar */
    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(6px,1.5vw,10px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);
      border-radius:99px;transition:width .4s ease;width:0%;
      box-shadow:0 0 8px rgba(255,215,0,.45);
    }

    /* Prompt */
    #prompt{
      font-size:clamp(20px,5.5vw,34px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
      text-align:center;padding:clamp(8px,2vw,14px) 16px clamp(4px,1vw,8px);
      flex-shrink:0;position:relative;z-index:1;line-height:1.2;
    }

    /* Magic dot stage */
    #dot-stage{
      width:clamp(190px,48vw,270px);height:clamp(190px,48vw,270px);
      border-radius:50%;
      background:radial-gradient(circle at 50% 50%, rgba(255,215,0,.12) 0%, rgba(100,0,200,.18) 100%);
      border:4px solid rgba(255,215,0,.5);
      box-shadow:0 0 0 8px rgba(255,215,0,.1),0 8px 32px rgba(0,0,0,.5);
      position:relative;flex-shrink:0;
      animation:stagePulse 3s ease-in-out infinite;
      z-index:1;margin:0 auto;
    }
    @keyframes stagePulse{
      0%,100%{box-shadow:0 0 0 8px rgba(255,215,0,.1),0 8px 32px rgba(0,0,0,.5)}
      50%    {box-shadow:0 0 0 16px rgba(255,215,0,.16),0 8px 32px rgba(0,0,0,.5)}
    }

    .dot-item{
      position:absolute;
      font-size:clamp(26px,6.5vw,40px);
      line-height:1;
      transform:translate(-50%,-50%);
      animation:dotPop .35s cubic-bezier(.34,1.56,.64,1) both;
      z-index:2;
    }
    @keyframes dotPop{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

    /* Choice buttons */
    #choices{
      display:flex;gap:clamp(8px,2vw,14px);
      justify-content:center;
      padding:clamp(8px,2vw,14px) clamp(12px,3vw,20px);
      width:100%;max-width:460px;flex-wrap:wrap;
      position:relative;z-index:1;
    }
    .choice-btn{
      min-width:clamp(72px,18vw,100px);
      min-height:clamp(90px,22vw,110px);
      border-radius:20px;
      border:3px solid rgba(255,215,0,.3);
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:clamp(38px,9.5vw,56px);
      font-family:inherit;
      cursor:pointer;
      touch-action:manipulation;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.18);
      transition:transform .1s;
    }
    .choice-btn:active{transform:scale(.91);}
    .choice-btn.correct{border-color:#ffd700;background:rgba(255,215,0,.22);animation:correctPop .5s ease-out;}
    .choice-btn.wrong  {animation:wobble .45s ease-out;border-color:rgba(255,80,80,.7);}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.13);box-shadow:0 0 40px rgba(255,215,0,.8)}100%{transform:scale(1)}}
    @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}60%{transform:translateX(12px)}80%{transform:translateX(-6px)}}

    /* Particles */
    .sp{position:fixed;pointer-events:none;z-index:50;border-radius:50%;animation:sparkOut .75s ease-out forwards;}
    @keyframes sparkOut{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
    .sp-em{position:fixed;pointer-events:none;z-index:51;animation:spFloat .9s ease-out forwards;}
    @keyframes spFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-90px) scale(0);opacity:0}}

    /* Overlays */
    .overlay{
      position:fixed;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      z-index:99;opacity:0;pointer-events:none;transition:opacity .35s;
      padding:24px 20px;background:rgba(20,0,60,.93);
    }
    .overlay.show{opacity:1;pointer-events:all;}
    .ov-emoji{font-size:clamp(52px,14vw,90px);}
    .ov-title{font-size:clamp(22px,6vw,42px);color:#ffd700;text-align:center;line-height:1.2;}
    .ov-sub  {font-size:clamp(15px,3.8vw,22px);color:#f8bbd0;text-align:center;max-width:320px;line-height:1.3;}
    .ov-fact {font-size:clamp(13px,3.4vw,18px);color:#b39ddb;text-align:center;max-width:340px;line-height:1.4;}
    .btn-next{
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,54px);font-size:clamp(18px,5vw,26px);
      border-radius:50px;border:none;background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00;font-family:inherit;cursor:pointer;
      min-height:64px;min-width:180px;
      box-shadow:0 4px 18px rgba(255,180,0,.5);
      touch-action:manipulation;
    }
    .cf{position:fixed;pointer-events:none;z-index:100;border-radius:3px;animation:cfFall linear forwards;}
    @keyframes cfFall{0%{top:-20px;opacity:1;transform:rotate(0)}100%{top:110vh;opacity:.2;transform:rotate(720deg)}}
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-label">⭐ 0</div>
  <div id="round-label">1 / 9</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="prompt">How many sparkles? ✨</div>

<div id="dot-stage"></div>

<div id="choices"></div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji" id="cel-emoji">✨</div>
  <div class="ov-title" id="cel-title">That's 3! 🌟</div>
  <div class="ov-sub"   id="cel-sub">Brilliant counting! 👑</div>
  <div class="ov-fact"  id="cel-fact"></div>
  <button class="btn-next" id="cel-btn">Next ➡️</button>
</div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="t-emoji">🌸</div>
  <div class="ov-title" id="t-title">Amazing! 🌟</div>
  <div class="ov-sub"   id="t-sub">Ready for more? ✨</div>
  <button class="btn-next" id="t-btn">Let's go! ✨</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="ov-emoji">👑</div>
  <div class="ov-title">Magic Dot Master! ✨</div>
  <div class="ov-sub" id="win-sub">You know all your numbers! 🌟</div>
  <div class="ov-fact" id="win-fact"></div>
  <button class="btn-next" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
// ── Audio ──────────────────────────────────────────────────────────────────────
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,type,d,v,del){
  v=v||.18;del=del||0;
  try{
    const c=getAudio();
    setTimeout(()=>{
      try{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(v,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.start();o.stop(c.currentTime+d);
      }catch(e){}
    },del);
  }catch(e){}
}
function playCorrect(){[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.18,.2,i*70));}
function playWrong()  {tone(260,'sawtooth',.18,.13);tone(210,'sawtooth',.14,.1,160);}
function playTierUp() {[523,659,784,880,1047,1319].forEach((f,i)=>tone(f,'triangle',.28,.2,i*90));}
function playWin()    {[523,659,784,1047,784,1047,1319,1047,1319,1568].forEach((f,i)=>tone(f,'sine',.3,.22,i*90));}

// ── Data ──────────────────────────────────────────────────────────────────────
const PROMPTS = [
  'How many sparkles? ✨',
  'Count the magic gems! 💎',
  'How many royal stars? ⭐',
  'Quick! How many? 🌟',
  'Count the princess dots! 👑',
];

const FACTS = {
  1:'The number 1 is special — there is only ONE queen of the whole kingdom! 👑',
  2:'TWO makes a pair — like two wings on a butterfly or two eyes to see! 🦋',
  3:'THREE is magical — wishes always come in threes in every fairy tale! 🌟',
  4:'FOUR makes a square — four seasons, four corners on a princess castle! 🏰',
  5:'FIVE fingers on one royal hand — count them: 1-2-3-4-5! 🖐️',
  6:'SIX points on every snowflake — each one in the kingdom is unique! ❄️',
};

// Classic die-face patterns — positions as % within the circle stage
const DOT_PATTERNS = {
  1:[[50,50]],
  2:[[33,35],[67,65]],
  3:[[27,28],[73,28],[50,73]],
  4:[[28,28],[72,28],[28,72],[72,72]],
  5:[[28,25],[72,25],[50,50],[28,75],[72,75]],
  6:[[28,22],[72,22],[28,50],[72,50],[28,78],[72,78]],
};

const DOT_EMOJIS = ['✨','💫','⭐','🌟','💎','👑','🌸','💖'];

const TIERS = [
  {label:'🌱 Easy',   cls:'tier-easy',   choices:2, numPool:[1,2,3],     scatter:false,
   toastEmoji:'🌸', toastTitle:'Great counting! 🌟', toastSub:'Now let\'s try up to FIVE sparkles! ✨'},
  {label:'🌸 Medium', cls:'tier-medium', choices:3, numPool:[2,3,4,5],   scatter:false,
   toastEmoji:'⭐',  toastTitle:'Amazing! ✨',         toastSub:'Now try SIX sparkles in surprise patterns! 🌟'},
  {label:'⭐ Hard',   cls:'tier-hard',   choices:4, numPool:[3,4,5,6],   scatter:true},
];

const TOTAL = 9;

// ── Build rounds ──────────────────────────────────────────────────────────────
function buildRounds(){
  const rounds=[];
  TIERS.forEach((tier,ti)=>{
    const pool=shuffle([...tier.numPool,...tier.numPool]).slice(0,3);
    pool.forEach(n=>{
      const wrongs=getWrong(n,[1,2,3,4,5,6],tier.choices-1);
      const opts=shuffle([n,...wrongs]);
      rounds.push({n,opts,tierIdx:ti,scatter:tier.scatter});
    });
  });
  return rounds;
}

function getWrong(n,universe,count){
  return shuffle(universe.filter(v=>v!==n)).slice(0,count);
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ── State ─────────────────────────────────────────────────────────────────────
let round=0,score=0,locked=false,gameRounds=[],promptIdx=0,dotEmoji='✨';

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(){
  ['win-overlay','tier-overlay','cel-overlay'].forEach(id=>document.getElementById(id).classList.remove('show'));
  round=0;score=0;locked=false;
  promptIdx=Math.floor(Math.random()*PROMPTS.length);
  gameRounds=buildRounds();
  makeBgGems();
  nextRound();
}

function nextRound(){
  document.getElementById('cel-overlay').classList.remove('show');
  if(round>=TOTAL){endGame();return;}
  const prevTierIdx=round===0?-1:gameRounds[round-1].tierIdx;
  round++;
  const rd=gameRounds[round-1];
  if(rd.tierIdx>prevTierIdx&&prevTierIdx>=0){
    showTierOverlay(TIERS[rd.tierIdx],()=>renderRound(rd));
  } else {
    renderRound(rd);
  }
}

function renderRound(rd){
  locked=false;
  promptIdx=(promptIdx+1)%PROMPTS.length;
  document.getElementById('prompt').textContent=PROMPTS[promptIdx];
  dotEmoji=DOT_EMOJIS[Math.floor(Math.random()*DOT_EMOJIS.length)];

  const tier=TIERS[rd.tierIdx];
  const badge=document.getElementById('tier-badge');
  badge.textContent=tier.label;badge.className='tier-badge '+tier.cls;
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';

  renderDots(rd.n,rd.scatter);
  renderChoices(rd);
  setTimeout(()=>{try{getAudio().resume();}catch(e){}tone(880,'sine',.1,.08);},150);
}

function renderDots(n,scatter){
  const stage=document.getElementById('dot-stage');
  stage.innerHTML='';
  let pts=DOT_PATTERNS[n];
  if(scatter){
    pts=pts.map(([x,y])=>[
      Math.min(84,Math.max(16,x+(Math.random()-.5)*16)),
      Math.min(84,Math.max(16,y+(Math.random()-.5)*16))
    ]);
  }
  pts.forEach(([x,y],i)=>{
    const el=document.createElement('div');
    el.className='dot-item';
    el.textContent=dotEmoji;
    el.style.left=x+'%';
    el.style.top=y+'%';
    el.style.animationDelay=(i*80)+'ms';
    stage.appendChild(el);
  });
}

function renderChoices(rd){
  const container=document.getElementById('choices');
  container.innerHTML='';
  container.style.maxWidth=rd.opts.length===4?'340px':'460px';
  rd.opts.forEach(v=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=v;
    btn.addEventListener('pointerdown',()=>handleTap(btn,v===rd.n,rd.n));
    container.appendChild(btn);
  });
}

function handleTap(btn,ok,correct){
  if(locked)return;
  try{getAudio().resume();}catch(e){}
  if(ok){
    locked=true;score++;
    btn.classList.add('correct');
    playCorrect();
    const r=btn.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
    document.getElementById('score-label').textContent='⭐ '+score;
    setTimeout(()=>showCelebrate(correct),550);
  } else {
    btn.classList.add('wrong');
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),460);
  }
}

const CEL_MSGS=['Brilliant! 🌟','You got it! 👑','Amazing! ✨','Superstar! ⭐','Perfect! 💎','Wonderful! 🌸'];

function showCelebrate(n){
  document.getElementById('cel-emoji').textContent='✨'.repeat(Math.min(n,6));
  document.getElementById('cel-title').textContent='That\'s '+n+'! 🌟';
  document.getElementById('cel-sub').textContent=CEL_MSGS[Math.floor(Math.random()*CEL_MSGS.length)];
  document.getElementById('cel-fact').textContent=FACTS[n]||'';
  document.getElementById('cel-btn').onclick=nextRound;
  document.getElementById('cel-overlay').classList.add('show');
}

function showTierOverlay(tier,cb){
  document.getElementById('t-emoji').textContent=tier.toastEmoji;
  document.getElementById('t-title').textContent=tier.toastTitle;
  document.getElementById('t-sub').textContent=tier.toastSub||'Get ready! 🌟';
  document.getElementById('t-btn').onclick=()=>{
    document.getElementById('tier-overlay').classList.remove('show');
    cb();
  };
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();confetti(42);
}

function endGame(){
  playWin();confetti(60);setTimeout(()=>confetti(40),700);
  document.getElementById('win-sub').textContent='You scored ⭐ '+score+' out of '+TOTAL+'! ✨';
  document.getElementById('win-fact').textContent='You can see how many there are in a flash — that\'s called subitizing! Like a real royal mathematician! 👑';
  document.getElementById('win-overlay').classList.add('show');
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('score-label').textContent='⭐ '+score;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function burst(cx,cy){
  const cols=['#ffd700','#e040fb','#fff','#f48fb1','#80deea','#a5d6a7','#ce93d8','#ffe082'];
  const ems=['✨','💫','⭐','🌟','💎','👑','🌸','💖','🤩','🎉'];
  for(let i=0;i<20;i++){
    const el=document.createElement('div');el.className='sp';
    const a=Math.random()*Math.PI*2,dist=35+Math.random()*80,sz=7+Math.random()*10;
    el.style.cssText=`left:${cx+Math.cos(a)*dist-sz/2}px;top:${cy+Math.sin(a)*dist-sz/2}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),800);
  }
  for(let i=0;i<10;i++){
    const el=document.createElement('div');el.className='sp-em';
    el.textContent=ems[i%ems.length];
    el.style.cssText=`left:${cx+(Math.random()-.5)*120}px;top:${cy+(Math.random()-.5)*100}px;font-size:${16+Math.random()*12}px;`;
    el.style.animationDelay=(Math.random()*.2)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}

function confetti(count){
  count=count||42;
  const cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b2ebf2','#a5d6a7','#ff8a65'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='cf';
    const sz=6+Math.random()*10;
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-duration:${1.4+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
  }
}

function makeBgGems(){
  document.querySelectorAll('.bg-gem').forEach(e=>e.remove());
  const icons=['✨','💫','⭐','🌟','💎','👑','🌸','💖','1️⃣','2️⃣','3️⃣','4️⃣'];
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='bg-gem';
    el.textContent=icons[i%icons.length];
    el.style.left=(4+Math.random()*92)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*16)+'s';
    document.body.appendChild(el);
  }
}

startGame();
</script>
</body>
</html>
