<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Healthy 🌿</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      min-height:100vh;
      background: linear-gradient(160deg, #1b5e20 0%, #2e7d32 25%, #4a148c 70%, #6a1b9a 100%);
      font-family: 'Fredoka One', Georgia, serif;
      display:flex; flex-direction:column; align-items:center;
      overflow:hidden; user-select:none; touch-action:manipulation;
    }

    /* Background floating health icons */
    .bg-icon {
      position:fixed; pointer-events:none; opacity:.09;
      font-size:clamp(18px,4.5vw,30px);
      animation:bgFloat linear infinite; z-index:0;
    }
    @keyframes bgFloat {
      0%   { transform:translateY(110vh) rotate(0deg); }
      100% { transform:translateY(-15vh) rotate(360deg); }
    }

    /* Header */
    #header {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #tier-badge {
      font-size:clamp(13px,3.2vw,18px); padding:5px 15px;
      border-radius:20px; font-weight:bold;
    }
    .tier-easy   { background:linear-gradient(135deg,#a5d6a7,#66bb6a); color:#1b5e20; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#ffd54f); color:#5a3000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#ab47bc); color:#fff; }
    #round-label { font-size:clamp(13px,3.2vw,17px); color:rgba(255,255,255,.9); }

    /* Progress bar */
    #progress-wrap { width:100%; padding:6px clamp(14px,4vw,22px) 0; flex-shrink:0; z-index:1; position:relative; }
    #progress-track { background:rgba(255,255,255,.18); border-radius:20px; height:clamp(8px,2vw,12px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#a5d6a7,#ffd700); transition:width .35s ease; width:0%; box-shadow:0 0 8px rgba(165,214,167,.55); }

    /* Prompt */
    #prompt {
      font-size:clamp(17px,4.5vw,26px); color:#f8bbd0;
      text-shadow:0 2px 8px rgba(0,0,0,.5);
      text-align:center; padding:clamp(8px,2vw,12px) 16px 0;
      flex-shrink:0; position:relative; z-index:1; line-height:1.2;
    }

    /* Situation card */
    #situation-card {
      background:rgba(255,255,255,.93); border-radius:28px;
      padding:clamp(10px,2.5vw,18px) clamp(16px,5vw,32px);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      box-shadow:0 8px 32px rgba(0,0,0,.28), 0 0 0 4px rgba(165,214,167,.45);
      margin:clamp(8px,2vw,14px) clamp(12px,3vw,20px) 0;
      flex-shrink:0; position:relative; z-index:1;
    }
    #situation-card.pop-in { animation:cardPop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cardPop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
    #sit-emoji { font-size:clamp(62px,17vw,96px); line-height:1; }
    #sit-text  { font-size:clamp(15px,4vw,22px); color:#2e7d32; font-weight:bold; text-align:center; line-height:1.25; }

    /* Choice buttons */
    #choices {
      display:grid; gap:clamp(10px,2.5vw,14px);
      padding:clamp(8px,2vw,12px) clamp(12px,3vw,20px) clamp(10px,2.5vw,16px);
      width:100%; max-width:460px; flex-shrink:0; position:relative; z-index:1;
    }
    #choices.cols-2 { grid-template-columns:1fr 1fr; }
    #choices.cols-3 { grid-template-columns:1fr 1fr 1fr; }
    #choices.cols-4 { grid-template-columns:1fr 1fr; }

    .choice-btn {
      min-height:clamp(90px,22vw,118px);
      border-radius:22px; border:none; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:5px; padding:10px 6px;
      box-shadow:0 4px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3);
      transition:transform .1s; touch-action:manipulation;
    }
    .choice-btn:active { transform:scale(.91); }
    .choice-icon  { font-size:clamp(34px,9vw,52px); line-height:1; pointer-events:none; }
    .choice-label { font-size:clamp(11px,2.8vw,16px); font-weight:bold; pointer-events:none; text-align:center; line-height:1.1; }

    /* Colour theme per choice slot (rotates) */
    .c-green  { background:linear-gradient(145deg,#c8e6c9,#66bb6a); color:#1b5e20; }
    .c-blue   { background:linear-gradient(145deg,#b3e5fc,#039be5); color:#01579b; }
    .c-pink   { background:linear-gradient(145deg,#f8bbd0,#e91e63); color:#880e4f; }
    .c-yellow { background:linear-gradient(145deg,#fff9c4,#f9a825); color:#4a2000; }
    .c-purple { background:linear-gradient(145deg,#e1bee7,#8e24aa); color:#fff; }
    .c-teal   { background:linear-gradient(145deg,#b2ebf2,#00acc1); color:#006064; }

    .choice-btn.correct-flash { animation:correctPop .5s ease-out; }
    .choice-btn.wrong-flash   { animation:wrongShake .42s ease-out; }
    @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.8)} 100%{transform:scale(1)} }
    @keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 60%{transform:translateX(12px)} 80%{transform:translateX(-6px)} }

    /* Sparkles */
    .sp    { position:fixed; pointer-events:none; z-index:50; animation:spOut .75s ease-out forwards; }
    @keyframes spOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.5);opacity:0} }
    .sp-dot { position:fixed; pointer-events:none; z-index:50; border-radius:50%; animation:dotFly .8s ease-out forwards; }
    @keyframes dotFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0} }

    /* Overlays (shared) */
    .overlay {
      position:fixed; inset:0; z-index:99;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:clamp(10px,2.5vw,16px);
      opacity:0; pointer-events:none; transition:opacity .35s;
    }
    .overlay.show { opacity:1; pointer-events:all; }

    /* Tier overlay */
    #tier-overlay { background:rgba(0,0,0,.7); }
    #to-icon  { font-size:clamp(60px,16vw,96px); }
    #to-title { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-shadow:0 0 20px #ff9800; text-align:center; }
    #to-sub   { font-size:clamp(15px,4vw,22px); color:#fff; text-align:center; padding:0 24px; }
    .ov-btn {
      margin-top:6px; padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px);
      font-size:clamp(18px,4.8vw,26px); border-radius:50px; border:none;
      background:linear-gradient(135deg,#ffd700,#ff9800);
      color:#5d2e00; font-weight:bold; cursor:pointer;
      font-family:inherit; box-shadow:0 4px 16px rgba(255,180,0,.5);
      touch-action:manipulation;
    }

    /* Celebrate overlay (per-round correct feedback) */
    #cel-overlay { background:rgba(0,0,0,.68); }
    #cel-emoji   { font-size:clamp(72px,18vw,110px); line-height:1; animation:celBounce .5s ease-out; }
    @keyframes celBounce { 0%{transform:scale(.3)} 65%{transform:scale(1.18)} 100%{transform:scale(1)} }
    #cel-label   { font-size:clamp(24px,6.5vw,44px); color:#ffd700; text-align:center; padding:0 20px; text-shadow:0 0 18px rgba(255,215,0,.55); }
    #cel-msg     { font-size:clamp(16px,4.2vw,24px); color:#f8bbd0; text-align:center; padding:0 20px; }

    /* Win overlay */
    #win-overlay { background:linear-gradient(160deg,#1b5e20 0%,#4a148c 100%); }
    #win-crown   { font-size:clamp(72px,18vw,110px); animation:crowBounce 1.1s ease-in-out infinite; }
    @keyframes crowBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    #win-title { font-size:clamp(26px,7vw,46px); color:#ffd700; text-shadow:0 0 24px #ff9800; text-align:center; }
    #win-sub   { font-size:clamp(15px,4vw,22px); color:#f8bbd0; text-align:center; padding:0 24px; }

    /* Confetti */
    .confetti {
      position:fixed; pointer-events:none; z-index:101; border-radius:3px;
      animation:cfFall linear forwards;
    }
    @keyframes cfFall {
      0%  { top:-20px; opacity:1; transform:rotate(0deg); }
      100%{ top:110vh; opacity:.2; transform:rotate(var(--cr,360deg)); }
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="tier-badge" class="tier-easy">🌱 Easy</div>
    <div id="round-label">1 / 9</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>

  <div id="prompt">What does Princess need? 🌿</div>

  <div id="situation-card">
    <div id="sit-emoji">🙌</div>
    <div id="sit-text">Princess has muddy hands!</div>
  </div>

  <div id="choices" class="cols-2"></div>

  <!-- Tier transition overlay -->
  <div class="overlay" id="tier-overlay">
    <div id="to-icon">🌟</div>
    <div id="to-title">Level Up!</div>
    <div id="to-sub">More health choices ahead!</div>
    <button class="ov-btn" onclick="resumeFromTier()">Keep going! ➡️</button>
  </div>

  <!-- Per-round celebrate overlay -->
  <div class="overlay" id="cel-overlay">
    <div id="cel-emoji">🧼</div>
    <div id="cel-label">Wash Hands! 🧼</div>
    <div id="cel-msg">Great choice! ✨</div>
    <button class="ov-btn" onclick="nextRound()">Next ➡️</button>
  </div>

  <!-- Win overlay -->
  <div class="overlay" id="win-overlay">
    <div id="win-crown">👑</div>
    <div id="win-title">Healthy Princess! 🌿</div>
    <div id="win-sub">You made all the right choices! ✨</div>
    <button class="ov-btn" onclick="startGame()">Play Again 🌸</button>
  </div>

<script>
'use strict';

// ── Audio ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(f, type, dur, vol, delay) {
  delay = delay || 0; vol = vol || 0.15;
  try {
    var c = getAudio(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type || 'sine'; o.frequency.value = f;
    var t0 = c.currentTime + delay;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  } catch(e) {}
}
function playCorrect()   { [523,659,784,1047].forEach(function(f,i){ tone(f,'sine',0.18,0.18,i*0.07); }); }
function playWrong()     { tone(260,'sawtooth',0.18,0.12); setTimeout(function(){ tone(210,'sawtooth',0.14,0.09); },160); }
function playCelebrate() { [523,587,659,698,784,880,1047].forEach(function(f,i){ tone(f,'sine',0.22,0.17,i*0.065); }); }
function playTierUp()    { [392,494,587,784,1047].forEach(function(f,i){ tone(f,'triangle',0.25,0.18,i*0.09); }); }
function playWin()       { [523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,'sine',0.28,0.2,i*0.1); }); }

// ── Scenario data ─────────────────────────────────────────────────────────────
// Each scenario: { sit: '🙌', text: '...', correct: {emoji,label}, wrongs: [{emoji,label},…] }
var EASY = [
  { sit:'🙌', text:'Princess has muddy hands!',          correct:{emoji:'🧼',label:'Wash Hands'},  wrongs:[{emoji:'🍰',label:'Eat Cake'}] },
  { sit:'😴', text:'Princess feels very sleepy!',         correct:{emoji:'🛏️',label:'Go to Sleep'}, wrongs:[{emoji:'🎮',label:'Play Games'}] },
  { sit:'😋', text:'Princess is hungry!',                 correct:{emoji:'🍎',label:'Eat Fruit'},   wrongs:[{emoji:'🍭',label:'Eat Sweets'}] },
  { sit:'😬', text:"Princess hasn't brushed her teeth!",  correct:{emoji:'🪥',label:'Brush Teeth'}, wrongs:[{emoji:'🍬',label:'Eat Candy'}] },
  { sit:'🥵', text:'Princess is very thirsty!',           correct:{emoji:'💧',label:'Drink Water'}, wrongs:[{emoji:'🧁',label:'Eat Cupcake'}] },
  { sit:'🤢', text:'Princess has a cold!',                correct:{emoji:'🤧',label:'Use a Tissue'}, wrongs:[{emoji:'🏊',label:'Go Swimming'}] },
];

var MEDIUM = [
  { sit:'🤒', text:'Princess feels sick!',                  correct:{emoji:'🩺',label:'See a Doctor'},  wrongs:[{emoji:'🎡',label:'Fun Fair'},{emoji:'🍕',label:'Eat Pizza'}] },
  { sit:'🩸', text:'Princess cut her finger!',              correct:{emoji:'🩹',label:'Put a Plaster'}, wrongs:[{emoji:'🍬',label:'Eat Sweets'},{emoji:'🏊',label:'Go Swim'}] },
  { sit:'🥶', text:'Princess is freezing cold!',            correct:{emoji:'🧥',label:'Wear a Coat'},   wrongs:[{emoji:'🍦',label:'Ice Cream'},{emoji:'💦',label:'Cold Water'}] },
  { sit:'🤕', text:'Princess has a headache!',              correct:{emoji:'😴',label:'Have a Rest'},   wrongs:[{emoji:'🎵',label:'Loud Music'},{emoji:'📱',label:'Screen Time'}] },
  { sit:'☀️', text:'Princess is going out in the sun!',    correct:{emoji:'🕶️',label:'Sunglasses'},   wrongs:[{emoji:'🌂',label:'Umbrella'},{emoji:'⛄',label:'Build Snowman'}] },
  { sit:'😰', text:'Princess has a tummy ache!',            correct:{emoji:'🛌',label:'Rest & Relax'},  wrongs:[{emoji:'🍔',label:'More Food'},{emoji:'🎢',label:'Rollercoaster'}] },
];

var HARD = [
  { sit:'🏃', text:'Princess has been running!',            correct:{emoji:'💧',label:'Drink Water'},    wrongs:[{emoji:'☕',label:'Hot Coffee'},{emoji:'🧁',label:'Cupcake'},{emoji:'📱',label:'Phone Time'}] },
  { sit:'🌧️', text:'It is raining outside!',               correct:{emoji:'☂️',label:'Take Umbrella'}, wrongs:[{emoji:'🕶️',label:'Sunglasses'},{emoji:'🎿',label:'Skis'},{emoji:'🏊',label:'Go Swim'}] },
  { sit:'😟', text:"Princess can't get to sleep!",          correct:{emoji:'🛏️',label:'Go to Bed'},     wrongs:[{emoji:'☕',label:'Coffee'},{emoji:'📺',label:'Watch TV'},{emoji:'🎵',label:'Loud Music'}] },
  { sit:'🦷', text:'Princess has a sore throat!',           correct:{emoji:'🍵',label:'Warm Tea'},       wrongs:[{emoji:'🍦',label:'Ice Cream'},{emoji:'🍕',label:'Hot Pizza'},{emoji:'🎵',label:'Sing Loudly'}] },
  { sit:'👁️', text:'Princess has very tired eyes!',        correct:{emoji:'😑',label:'Rest Your Eyes'}, wrongs:[{emoji:'📺',label:'More TV'},{emoji:'🎮',label:'Video Games'},{emoji:'📱',label:'Phone Screen'}] },
  { sit:'🤧', text:'Princess sneezed on her hands!',        correct:{emoji:'🧼',label:'Wash Hands'},     wrongs:[{emoji:'🍕',label:'Make Food'},{emoji:'🤝',label:'Shake Hands'},{emoji:'🍬',label:'Eat Sweets'}] },
];

var TIER_INFO = [
  { label:'🌱 Easy',   cls:'tier-easy',   cats:2, icon:'🌿', title:'Moving to Medium!', sub:'3 choices now — which is healthiest? 🌸' },
  { label:'🌸 Medium', cls:'tier-medium', cats:3, icon:'💫', title:'Almost there!',     sub:'4 choices — think carefully! 💪' },
  { label:'⭐ Hard',   cls:'tier-hard',   cats:4 },
];
var TOTAL = 9;

// ── Helpers ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var SLOT_COLS = ['c-green','c-blue','c-pink','c-yellow','c-purple','c-teal'];

// ── State ─────────────────────────────────────────────────────────────────────
var round = 0, locked = false, currentScenario = null, roundPlan = [];

function buildPlan() {
  var e = shuffle(EASY).slice(0,3);
  var m = shuffle(MEDIUM).slice(0,3);
  var h = shuffle(HARD).slice(0,3);
  return e.concat(m).concat(h);
}

function getTierIdx(r) { return r <= 3 ? 0 : r <= 6 ? 1 : 2; }

// ── Background ────────────────────────────────────────────────────────────────
(function initBg() {
  var icons = ['🌿','💧','🍎','🩹','🧼','🛏️','💊','🩺','🌸','✨','🌱','💫'];
  for (var i = 0; i < 12; i++) {
    var el = document.createElement('div');
    el.className = 'bg-icon';
    el.textContent = icons[i % icons.length];
    el.style.left = (3 + Math.random() * 94) + 'vw';
    el.style.animationDuration = (10 + Math.random() * 14) + 's';
    el.style.animationDelay = -(Math.random() * 20) + 's';
    document.body.appendChild(el);
  }
})();

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('cel-overlay').classList.remove('show');
  document.getElementById('tier-overlay').classList.remove('show');
  round = 0;
  roundPlan = buildPlan();
  document.getElementById('progress-fill').style.width = '0%';
  nextRound();
}

function nextRound() {
  document.getElementById('cel-overlay').classList.remove('show');
  if (round >= TOTAL) { endGame(); return; }

  var prevTier = getTierIdx(round);
  round++;
  locked = false;
  updateHUD();

  var newTier = getTierIdx(round);
  if (round > 1 && newTier !== prevTier) {
    showTierOverlay(newTier);
  } else {
    showQuestion();
  }
}

function showTierOverlay(tIdx) {
  var ti = TIER_INFO[tIdx - 1];
  document.getElementById('to-icon').textContent  = ti.icon;
  document.getElementById('to-title').textContent = ti.title;
  document.getElementById('to-sub').textContent   = ti.sub;
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();
  confetti(42);
}

function resumeFromTier() {
  document.getElementById('tier-overlay').classList.remove('show');
  showQuestion();
}

function updateHUD() {
  var tIdx = getTierIdx(round);
  var ti   = TIER_INFO[tIdx];
  var badge = document.getElementById('tier-badge');
  badge.textContent = ti.label;
  badge.className   = ti.cls;
  document.getElementById('round-label').textContent = round + ' / ' + TOTAL;
  document.getElementById('progress-fill').style.width = ((round - 1) / TOTAL * 100) + '%';
}

function showQuestion() {
  var tIdx = getTierIdx(round);
  var sc   = roundPlan[round - 1];
  currentScenario = sc;

  // Animate card in
  var card = document.getElementById('situation-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');
  document.getElementById('sit-emoji').textContent = sc.sit;
  document.getElementById('sit-text').textContent  = sc.text;

  // Build choices: correct + wrongs (trimmed to tier count)
  var count   = TIER_INFO[tIdx].cats;
  var allWrong = sc.wrongs.slice(0, count - 1);
  var opts    = shuffle([sc.correct].concat(allWrong));

  var choicesEl = document.getElementById('choices');
  choicesEl.className = count === 4 ? 'cols-4' : 'cols-' + count;
  choicesEl.innerHTML = '';
  opts.forEach(function(opt, idx) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn ' + SLOT_COLS[idx % SLOT_COLS.length];
    btn.innerHTML = '<span class="choice-icon">' + opt.emoji + '</span>'
                  + '<span class="choice-label">' + opt.label + '</span>';
    var isCorrect = (opt === sc.correct);
    btn.addEventListener('pointerdown', function() { handleTap(btn, isCorrect, opt); });
    choicesEl.appendChild(btn);
  });
}

// ── Tap handling ──────────────────────────────────────────────────────────────
function handleTap(btn, isCorrect, opt) {
  if (locked) return;
  if (isCorrect) {
    locked = true;
    btn.classList.add('correct-flash');
    playCorrect();
    sparkleBurst(btn);
    setTimeout(function() {
      btn.classList.remove('correct-flash');
      showCelebrate(opt);
    }, 500);
  } else {
    btn.classList.add('wrong-flash');
    playWrong();
    setTimeout(function() { btn.classList.remove('wrong-flash'); }, 450);
  }
}

function showCelebrate(opt) {
  document.getElementById('cel-emoji').textContent = opt.emoji;
  document.getElementById('cel-label').textContent = opt.label + '!';
  var msgs = ['Great choice! ✨', 'Amazing! 💫', 'You know it! 🌿', 'Brilliant! 👑', 'Well done! ⭐', 'Healthy Princess! 🌸'];
  document.getElementById('cel-msg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  document.getElementById('cel-overlay').classList.add('show');
  playCelebrate();
  confetti(28);
}

function endGame() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('win-overlay').classList.add('show');
  playWin();
  confetti(60);
  setTimeout(function() { confetti(40); }, 700);
}

// ── Particles ─────────────────────────────────────────────────────────────────
function sparkleBurst(btn) {
  var r  = btn.getBoundingClientRect();
  var cx = r.left + r.width / 2;
  var cy = r.top  + r.height / 2;
  var ems  = ['✨','💫','🌿','⭐','💖','🌸','💧'];
  var cols = ['#a5d6a7','#ffd700','#f48fb1','#ce93d8','#80deea','#ffab91','#fff'];
  for (var i = 0; i < 8; i++) {
    var el = document.createElement('div');
    el.className = 'sp';
    el.textContent = ems[i % ems.length];
    el.style.cssText = 'font-size:' + (18 + Math.random() * 14) + 'px;left:' + (cx + (Math.random() - .5) * 110) + 'px;top:' + (cy + (Math.random() - .5) * 90) + 'px;animation-delay:' + (Math.random() * .15) + 's;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), 900);
  }
  for (var j = 0; j < 18; j++) {
    var dot  = document.createElement('div');
    dot.className = 'sp-dot';
    var a   = Math.random() * Math.PI * 2;
    var dist = 25 + Math.random() * 75;
    var sz  = 5 + Math.random() * 10;
    dot.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (cx - sz/2) + 'px;top:' + (cy - sz/2) + 'px;background:' + cols[j % cols.length] + ';--tx:' + (Math.cos(a) * dist) + 'px;--ty:' + (Math.sin(a) * dist) + 'px;';
    document.body.appendChild(dot);
    setTimeout(function(e) { return function() { e.remove(); }; }(dot), 950);
  }
}

function confetti(count) {
  var cols = ['#a5d6a7','#ffd700','#f48fb1','#ce93d8','#80deea','#ff7043','#fff','#ffcc02'];
  for (var i = 0; i < count; i++) {
    var el  = document.createElement('div');
    el.className = 'confetti';
    var dur = 1.4 + Math.random() * 1.8;
    var sz  = 6 + Math.random() * 10;
    el.style.cssText = 'left:' + Math.random() * 100 + 'vw;width:' + sz + 'px;height:' + sz * (0.4 + Math.random() * 0.7) + 'px;background:' + cols[i % cols.length] + ';animation-duration:' + dur + 's;animation-delay:' + Math.random() * .5 + 's;--cr:' + ((Math.random() - .5) * 720) + 'deg;';
    document.body.appendChild(el);
    setTimeout(function(e) { return function() { e.remove(); }; }(el), (dur + 0.6) * 1000 + 200);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
startGame();
</script>
