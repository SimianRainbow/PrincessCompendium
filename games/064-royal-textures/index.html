<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Touch 🤚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body {
      background: linear-gradient(160deg, #fce4ec 0%, #e8f5e9 50%, #e3f2fd 100%);
      min-height:100vh; width:100vw; overflow:hidden;
      font-family:'Fredoka One', Georgia, serif; user-select:none; position:relative;
      display:flex; flex-direction:column; align-items:center;
    }

    .bg-gem { position:fixed; pointer-events:none; animation:floatUp linear infinite; opacity:.13; font-size:clamp(16px,4vw,26px); }
    @keyframes floatUp { 0%{transform:translateY(110vh) rotate(0deg)} 100%{transform:translateY(-15vh) rotate(360deg)} }

    #header {
      position:fixed; top:0; left:0; right:0; z-index:10;
      padding:clamp(8px,2vw,14px) clamp(12px,3vw,20px);
      display:flex; justify-content:space-between; align-items:center;
    }
    #tier-badge { font-size:clamp(13px,3.4vw,18px); padding:5px 15px; border-radius:20px; font-weight:bold; }
    .tier-easy   { background:linear-gradient(135deg,#a5d6a7,#66bb6a); color:#1b5e20; }
    .tier-medium { background:linear-gradient(135deg,#ffe082,#ffd54f); color:#5a3000; }
    .tier-hard   { background:linear-gradient(135deg,#ce93d8,#ab47bc); color:#fff; }
    #round-lbl { font-size:clamp(13px,3.2vw,18px); color:#6a1b9a; font-weight:bold; }
    #score-lbl { font-size:clamp(13px,3.2vw,18px); color:#ad1457; font-weight:bold; }

    #progress-wrap {
      position:fixed; top:clamp(48px,11vw,70px); left:0; right:0;
      padding:0 clamp(14px,4vw,24px); z-index:10;
    }
    #progress-track { background:rgba(171,71,188,.2); border-radius:20px; height:clamp(10px,2.5vw,14px); overflow:hidden; }
    #progress-fill  { height:100%; border-radius:20px; background:linear-gradient(90deg,#e040fb,#f48fb1); transition:width .35s ease; width:0%; box-shadow:0 0 8px rgba(224,64,251,.3); }

    #scene-wrap {
      margin-top:clamp(78px,18vw,110px);
      display:flex; flex-direction:column; align-items:center; gap:clamp(6px,1.5vw,10px);
      padding:0 16px; width:100%; text-align:center;
    }
    #obj-emoji {
      font-size:clamp(80px,20vw,130px); line-height:1;
      animation:scenePop .5s cubic-bezier(.34,1.56,.64,1);
      filter: drop-shadow(0 4px 12px rgba(100,0,200,.2));
    }
    @keyframes scenePop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    #obj-name {
      font-size:clamp(20px,5.5vw,36px); color:#4a148c; font-weight:bold;
      text-shadow:0 1px 4px rgba(100,0,180,.12);
    }
    #prompt {
      font-size:clamp(18px,4.8vw,30px); color:#ad1457;
      font-weight:bold; text-shadow:0 1px 4px rgba(173,20,87,.15);
      background:rgba(255,255,255,.55); border-radius:16px; padding:8px 20px;
      margin-top:4px;
    }

    #choices {
      position:fixed; bottom:clamp(10px,3vw,22px); left:0; right:0;
      display:flex; justify-content:center; flex-wrap:wrap;
      gap:clamp(12px,3vw,20px); padding:0 clamp(12px,3vw,20px);
      z-index:5;
    }
    .choice-btn {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:clamp(4px,1vw,8px);
      min-width:clamp(110px,26vw,150px); min-height:clamp(90px,22vw,120px);
      border-radius:22px; border:none; cursor:pointer; touch-action:manipulation;
      background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(243,229,245,.95));
      box-shadow:0 5px 20px rgba(150,50,200,.2), inset 0 2px 0 rgba(255,255,255,.8);
      transition:transform .1s, box-shadow .1s; padding:10px;
    }
    .choice-btn:active { transform:scale(.91); }
    .choice-word {
      font-size:clamp(22px,6vw,36px); color:#4a148c; font-weight:bold; line-height:1.1; text-align:center;
    }
    .choice-icon { font-size:clamp(24px,6vw,36px); line-height:1; }
    .choice-btn.correct-flash {
      animation:correctPop .5s ease-out;
      background:linear-gradient(135deg,rgba(255,255,180,.9),rgba(200,255,200,.9));
      box-shadow:0 0 30px rgba(200,255,100,.7);
    }
    .choice-btn.wrong-shake { animation:wobble .45s ease-out; }
    @keyframes correctPop { 0%{transform:scale(1)} 45%{transform:scale(1.18)} 100%{transform:scale(1)} }
    @keyframes wobble { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 60%{transform:translateX(10px)} }

    .sparkle { position:fixed; pointer-events:none; z-index:50; border-radius:50%; animation:spkOut .7s ease-out forwards; }
    @keyframes spkOut { 0%{transform:scale(0);opacity:1} 100%{transform:scale(1.7);opacity:0} }
    .sparkle-em { position:fixed; pointer-events:none; z-index:51; font-size:clamp(18px,4.5vw,26px); animation:sFloat .9s ease-out forwards; }
    @keyframes sFloat { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-90px) scale(0);opacity:0} }
    .confetti { position:fixed; pointer-events:none; z-index:100; border-radius:3px; animation:cfFall linear forwards; }
    @keyframes cfFall { 0%{top:-20px;opacity:1;transform:rotate(0deg)} 100%{top:110vh;opacity:.2;transform:rotate(720deg)} }

    .overlay {
      position:fixed; inset:0; background:rgba(250,240,255,.95);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      z-index:99; opacity:0; pointer-events:none; transition:opacity .4s;
    }
    .overlay.show { opacity:1; pointer-events:all; }
    .ov-emoji { font-size:clamp(60px,16vw,100px); }
    .ov-title { font-size:clamp(22px,6vw,44px); color:#6a1b9a; text-align:center; padding:0 20px; }
    .ov-sub   { font-size:clamp(14px,3.8vw,22px); color:#7b1fa2; text-align:center; padding:0 20px; opacity:.85; }
    .btn-next {
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,56px); font-size:clamp(20px,5vw,28px);
      border-radius:50px; border:none; background:linear-gradient(135deg,#e040fb,#ab47bc);
      color:#fff; font-weight:bold; cursor:pointer; font-family:inherit;
      min-height:64px; min-width:180px; touch-action:manipulation;
      box-shadow:0 4px 18px rgba(224,64,251,.4);
    }
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="round-lbl">🌟 1 / 9</div>
  <div id="score-lbl">⭐ 0</div>
</div>
<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="scene-wrap">
  <div id="obj-emoji">🪨</div>
  <div id="obj-name">Rock</div>
  <div id="prompt">Is this ROUGH or SMOOTH? 🤚</div>
</div>

<div id="choices"></div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji" id="cel-em">🪨</div>
  <div class="ov-title" id="cel-word">ROUGH!</div>
  <div class="ov-sub"   id="cel-fact">Rocks are bumpy and rough to touch!</div>
  <button class="btn-next" id="cel-btn">Cool! ✨</button>
</div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="t-emoji">🌸</div>
  <div class="ov-title" id="t-title">New Feeling!</div>
  <div class="ov-sub"   id="t-sub">Now we learn HARD and SOFT!</div>
  <button class="btn-next" id="t-btn">Let's touch! 🤚</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="ov-emoji">👑</div>
  <div class="ov-title">Amazing Toucher! 🤚</div>
  <div class="ov-sub" id="win-sub">Princess Jet knows all the textures! ✨</div>
  <button class="btn-next" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
  // Each scenario: emoji, name, tier (0=Easy ROUGH/SMOOTH, 1=Medium HARD/SOFT, 2=Hard WET/DRY)
  // answer: the correct word; wrong: array of wrong word+icon pairs
  const SCENARIOS = [
    // --- EASY: ROUGH vs SMOOTH ---
    { t:0, emoji:'🪨', name:'Rock',
      answer:{word:'ROUGH 🪨', icon:'🪨'},
      wrong:[{word:'SMOOTH ✨', icon:'✨'}],
      fact:'Rocks are bumpy and rough to touch! 🪨',
      question:'Is this ROUGH or SMOOTH? 🤚' },
    { t:0, emoji:'🪶', name:'Feather',
      answer:{word:'SMOOTH 🪶', icon:'🪶'},
      wrong:[{word:'ROUGH 🪨', icon:'🪨'}],
      fact:'Feathers are silky and smooth to stroke! 🪶',
      question:'Is this ROUGH or SMOOTH? 🤚' },
    { t:0, emoji:'🌵', name:'Cactus',
      answer:{word:'ROUGH 🌵', icon:'🌵'},
      wrong:[{word:'SMOOTH ✨', icon:'✨'}],
      fact:'Cactus has prickly rough spikes! 🌵',
      question:'Is this ROUGH or SMOOTH? 🤚' },
    { t:0, emoji:'💎', name:'Diamond',
      answer:{word:'SMOOTH 💎', icon:'💎'},
      wrong:[{word:'ROUGH 🪨', icon:'🪨'}],
      fact:'Diamonds are glittery and perfectly smooth! 💎',
      question:'Is this ROUGH or SMOOTH? 🤚' },
    { t:0, emoji:'🌳', name:'Tree Bark',
      answer:{word:'ROUGH 🌳', icon:'🌳'},
      wrong:[{word:'SMOOTH ✨', icon:'✨'}],
      fact:'Tree bark is rough and bumpy all over! 🌳',
      question:'Is this ROUGH or SMOOTH? 🤚' },
    { t:0, emoji:'🐱', name:'Kitten',
      answer:{word:'SMOOTH 🐱', icon:'🐱'},
      wrong:[{word:'ROUGH 🪨', icon:'🪨'}],
      fact:"Kitten's fur is so soft and smooth to pet! 🐱",
      question:'Is this ROUGH or SMOOTH? 🤚' },

    // --- MEDIUM: HARD vs SOFT ---
    { t:1, emoji:'🪨', name:'Rock',
      answer:{word:'HARD 🪨', icon:'🪨'},
      wrong:[{word:'SOFT 🛏️', icon:'🛏️'}],
      fact:'Rocks are very hard and heavy! 🪨',
      question:'Is this HARD or SOFT? 🤚' },
    { t:1, emoji:'🛏️', name:'Pillow',
      answer:{word:'SOFT 🛏️', icon:'🛏️'},
      wrong:[{word:'HARD 🪨', icon:'🪨'}],
      fact:'Pillows are fluffy, squidgy and soft! 🛏️',
      question:'Is this HARD or SOFT? 🤚' },
    { t:1, emoji:'🧊', name:'Ice Cube',
      answer:{word:'HARD 🧊', icon:'🧊'},
      wrong:[{word:'SOFT 🛏️', icon:'🛏️'}],
      fact:'Ice is frozen and super hard and cold! 🧊',
      question:'Is this HARD or SOFT? 🤚' },
    { t:1, emoji:'🧸', name:'Teddy Bear',
      answer:{word:'SOFT 🧸', icon:'🧸'},
      wrong:[{word:'HARD 🪨', icon:'🪨'}],
      fact:'Teddy bears are cosy and soft to cuddle! 🧸',
      question:'Is this HARD or SOFT? 🤚' },
    { t:1, emoji:'💎', name:'Diamond',
      answer:{word:'HARD 💎', icon:'💎'},
      wrong:[{word:'SOFT 🧸', icon:'🧸'}],
      fact:'Diamonds are the hardest thing in the world! 💎',
      question:'Is this HARD or SOFT? 🤚' },
    { t:1, emoji:'🌸', name:'Flower Petal',
      answer:{word:'SOFT 🌸', icon:'🌸'},
      wrong:[{word:'HARD 💎', icon:'💎'}],
      fact:'Flower petals are gentle, velvety and soft! 🌸',
      question:'Is this HARD or SOFT? 🤚' },

    // --- HARD: WET vs DRY ---
    { t:2, emoji:'☔', name:'Rain',
      answer:{word:'WET 💧', icon:'💧'},
      wrong:[{word:'DRY 🏜️', icon:'🏜️'},{word:'ROUGH 🪨', icon:'🪨'}],
      fact:'Rain makes everything wet and splashy! ☔',
      question:'Is this WET or DRY? 🤚' },
    { t:2, emoji:'🏖️', name:'Beach Sand',
      answer:{word:'DRY 🏜️', icon:'🏜️'},
      wrong:[{word:'WET 💧', icon:'💧'},{word:'SOFT 🧸', icon:'🧸'}],
      fact:'Dry beach sand is warm, grainy and dry! 🏖️',
      question:'Is this WET or DRY? 🤚' },
    { t:2, emoji:'🧽', name:'Wet Sponge',
      answer:{word:'WET 💧', icon:'💧'},
      wrong:[{word:'DRY 🏜️', icon:'🏜️'},{word:'HARD 🪨', icon:'🪨'}],
      fact:'Wet sponges are full of water and dripping! 🧽',
      question:'Is this WET or DRY? 🤚' },
    { t:2, emoji:'🌵', name:'Desert Cactus',
      answer:{word:'DRY 🏜️', icon:'🏜️'},
      wrong:[{word:'WET 💧', icon:'💧'},{word:'SMOOTH ✨', icon:'✨'}],
      fact:'Cactus grows in the hot dry desert! 🌵',
      question:'Is this WET or DRY? 🤚' },
    { t:2, emoji:'💧', name:'Puddle',
      answer:{word:'WET 💧', icon:'💧'},
      wrong:[{word:'DRY 🏜️', icon:'🏜️'},{word:'SMOOTH ✨', icon:'✨'}],
      fact:'Puddles are full of splashy wet water! 💧',
      question:'Is this WET or DRY? 🤚' },
    { t:2, emoji:'🪨', name:'Sun-baked Stone',
      answer:{word:'DRY 🏜️', icon:'🏜️'},
      wrong:[{word:'WET 💧', icon:'💧'},{word:'SOFT 🧸', icon:'🧸'}],
      fact:'Stones baked in sunshine are warm and dry! ☀️',
      question:'Is this WET or DRY? 🤚' },
  ];

  const TIERS = [
    { t:0, label:'🌱 Easy',   cls:'tier-easy',   opts:2,
      toastEmoji:'🌸', toastTitle:'New Feeling Time!', toastSub:'Now we learn HARD and SOFT! 🪨🧸' },
    { t:1, label:'🌸 Medium', cls:'tier-medium', opts:2,
      toastEmoji:'💧', toastTitle:'One More Feeling!', toastSub:'Now we learn WET and DRY! 💧🏜️' },
    { t:2, label:'⭐ Hard',   cls:'tier-hard',   opts:3, toastEmoji:'⭐', toastTitle:'', toastSub:'' },
  ];
  const TOTAL = 9;

  let ctx = null;
  function getCtx(){ if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(f,type,d,v){
    v=v||.18;
    try{
      const c=getCtx(), o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
      o.start(); o.stop(c.currentTime+d);
    }catch(e){}
  }
  function playCorrect()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.18,.22),i*65)); }
  function playWrong()    { tone(280,'sawtooth',.16,.13); setTimeout(()=>tone(240,'sawtooth',.14,.11),160); }
  function playTierWin()  { [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.28,.22),i*80)); }
  function playFinalWin() { [523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.32,.22),i*90)); }

  let round=0, score=0, locked=false, order=[];

  function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]; } return b; }
  function getTier(r){ return r<=3 ? TIERS[0] : r<=6 ? TIERS[1] : TIERS[2]; }

  function startGame(){
    ['win-overlay','tier-overlay','cel-overlay'].forEach(id=>document.getElementById(id).classList.remove('show'));
    round=0; score=0; locked=false;
    document.getElementById('score-lbl').textContent='⭐ 0';
    const easy   = shuffle(SCENARIOS.filter(s=>s.t===0)).slice(0,3);
    const medium = shuffle(SCENARIOS.filter(s=>s.t===1)).slice(0,3);
    const hard   = shuffle(SCENARIOS.filter(s=>s.t===2)).slice(0,3);
    order = [...easy, ...medium, ...hard];
    makeBgGems();
    nextQuestion();
  }

  function nextQuestion(){
    if(round >= TOTAL){ endGame(); return; }
    const prevTier = round > 0 ? getTier(round) : null;
    round++;
    const newTier = getTier(round);
    if(prevTier && prevTier.t !== newTier.t){
      showTierOverlay(prevTier, ()=>{ locked=false; renderQuestion(); });
    } else {
      locked=false; renderQuestion();
    }
  }

  function showTierOverlay(prevTier, cb){
    const next = TIERS[prevTier.t + 1];
    if(!next){ cb(); return; }
    document.getElementById('t-emoji').textContent = next.toastEmoji;
    document.getElementById('t-title').textContent = next.toastTitle;
    document.getElementById('t-sub').textContent   = next.toastSub;
    const btn = document.getElementById('t-btn');
    btn.onclick = ()=>{
      document.getElementById('tier-overlay').classList.remove('show');
      playTierWin(); confetti();
      cb();
    };
    document.getElementById('tier-overlay').classList.add('show');
  }

  function renderQuestion(){
    const sc = order[round-1];
    const tier = getTier(round);

    const objEl = document.getElementById('obj-emoji');
    objEl.style.animation='none'; void objEl.offsetWidth; objEl.style.animation='';
    objEl.textContent = sc.emoji;
    document.getElementById('obj-name').textContent = sc.name;
    document.getElementById('prompt').textContent = sc.question;

    const badge = document.getElementById('tier-badge');
    badge.textContent = tier.label;
    badge.className = 'tier-badge ' + tier.cls;
    document.getElementById('round-lbl').textContent = '🌟 '+round+' / '+TOTAL;
    document.getElementById('score-lbl').textContent = '⭐ '+score;
    document.getElementById('progress-fill').style.width = ((round-1)/TOTAL*100)+'%';

    // Pick wrong answers: grab (opts-1) from sc.wrong
    const wrongChoices = shuffle([...sc.wrong]).slice(0, tier.opts-1);
    const choices = shuffle([sc.answer, ...wrongChoices]);

    const container = document.getElementById('choices');
    container.innerHTML='';
    choices.forEach(item=>{
      const btn=document.createElement('button');
      btn.className='choice-btn';
      btn.innerHTML=`<div class="choice-icon">${item.icon}</div><div class="choice-word">${item.word}</div>`;
      btn.addEventListener('pointerdown', ()=>handleTap(btn, item, sc));
      container.appendChild(btn);
    });

    setTimeout(()=>tone(880,'sine',.12,.1), 200);
  }

  function handleTap(btn, item, sc){
    if(locked) return;
    if(item.word === sc.answer.word){
      locked=true;
      score++;
      btn.classList.add('correct-flash');
      playCorrect();
      burst(btn);
      document.getElementById('score-lbl').textContent='⭐ '+score;
      setTimeout(()=>showCelebrate(sc), 500);
    } else {
      btn.classList.add('wrong-shake');
      playWrong();
      setTimeout(()=>btn.classList.remove('wrong-shake'), 450);
    }
  }

  function showCelebrate(sc){
    document.getElementById('cel-em').textContent   = sc.emoji;
    document.getElementById('cel-word').textContent = sc.answer.word + ' ✅';
    document.getElementById('cel-fact').textContent = sc.fact;
    const btn = document.getElementById('cel-btn');
    btn.onclick = ()=>{
      document.getElementById('cel-overlay').classList.remove('show');
      confetti();
      setTimeout(()=>nextQuestion(), 300);
    };
    document.getElementById('cel-overlay').classList.add('show');
  }

  function burst(btn){
    const r=btn.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const cols=['#ffd700','#e040fb','#fff','#f48fb1','#80deea','#a5d6a7','#ffcc02','#ce93d8'];
    for(let i=0;i<20;i++){
      const el=document.createElement('div'); el.className='sparkle';
      const a=Math.random()*Math.PI*2, dist=30+Math.random()*80, sz=6+Math.random()*14;
      el.style.cssText=`left:${cx+Math.cos(a)*dist-sz/2}px;top:${cy+Math.sin(a)*dist-sz/2}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]}`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),800);
    }
    const icons=['✨','💫','⭐','🌟','💖','🤚'];
    for(let i=0;i<8;i++){
      const el=document.createElement('div'); el.className='sparkle-em';
      el.textContent=icons[i%icons.length];
      el.style.left=(cx+(Math.random()-.5)*120)+'px';
      el.style.top=(cy+(Math.random()-.5)*100)+'px';
      el.style.animationDelay=(Math.random()*.2)+'s';
      document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
    }
  }

  function confetti(){
    const cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b2ebf2','#a5d6a7','#80deea'];
    for(let i=0;i<42;i++){
      const el=document.createElement('div'); el.className='confetti';
      const sz=6+Math.random()*10;
      el.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),3500);
    }
  }

  function endGame(){
    document.getElementById('win-sub').textContent =
      'You scored ⭐ '+score+' out of '+TOTAL+'! Brilliant texture expert! 🌟';
    document.getElementById('win-overlay').classList.add('show');
    playFinalWin(); confetti(); setTimeout(confetti, 700);
    document.getElementById('progress-fill').style.width='100%';
    document.getElementById('score-lbl').textContent='⭐ '+score;
  }

  function makeBgGems(){
    document.querySelectorAll('.bg-gem').forEach(e=>e.remove());
    const icons=['💎','🌟','✨','👑','💖','🌸','⭐','🤚','🪨','🌵'];
    for(let i=0;i<14;i++){
      const el=document.createElement('div'); el.className='bg-gem';
      el.textContent=icons[i%icons.length];
      el.style.left=(4+Math.random()*92)+'vw';
      el.style.animationDuration=(10+Math.random()*14)+'s';
      el.style.animationDelay=-(Math.random()*16)+'s';
      document.body.appendChild(el);
    }
  }

  startGame();
</script>
</body>
</html>
