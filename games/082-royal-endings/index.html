<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Princess Endings ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#4a0072 0%,#7b1fa2 45%,#00695c 100%);
      font-family:'Fredoka One',Georgia,serif;
      display:flex;flex-direction:column;align-items:center;
      overflow:hidden;user-select:none;touch-action:manipulation;
      padding-bottom:12px;
    }

    .bg-gem{position:fixed;pointer-events:none;animation:bgFloat linear infinite;opacity:.09;font-size:clamp(14px,3.5vw,22px);z-index:0;}
    @keyframes bgFloat{0%{transform:translateY(110vh) rotate(0deg)}100%{transform:translateY(-15vh) rotate(360deg)}}

    #header{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      padding:clamp(10px,2.5vw,16px) clamp(14px,4vw,22px) 0;
      flex-shrink:0;position:relative;z-index:1;
    }
    #tier-badge{font-size:clamp(13px,3.2vw,17px);padding:5px 14px;border-radius:20px;font-weight:bold;border:2px solid rgba(255,255,255,.38);}
    .tier-easy  {background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;}
    .tier-medium{background:linear-gradient(135deg,#ffca28,#f57f17);color:#3e2000;}
    .tier-hard  {background:linear-gradient(135deg,#ce93d8,#6a1b9a);color:#fff;}
    #score-label{font-size:clamp(16px,4vw,22px);color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6);}
    #round-label{font-size:clamp(13px,3.2vw,17px);color:rgba(255,255,255,.85);}

    #progress-track{
      width:calc(100% - clamp(28px,7vw,44px));height:7px;
      background:rgba(255,255,255,.15);border-radius:99px;
      margin:clamp(5px,1.5vw,9px) auto 0;overflow:hidden;
      position:relative;z-index:1;
    }
    #progress-fill{
      height:100%;background:linear-gradient(90deg,#ffd700,#e040fb);
      border-radius:99px;transition:width .4s ease;width:0%;
      box-shadow:0 0 8px rgba(255,215,0,.45);
    }

    #prompt{
      font-size:clamp(18px,5vw,28px);color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
      text-align:center;padding:clamp(8px,2vw,14px) 16px clamp(4px,1vw,8px);
      flex-shrink:0;position:relative;z-index:1;line-height:1.25;
    }

    /* Word card */
    #word-card{
      background:rgba(255,255,255,.13);
      border:3px solid rgba(255,215,0,.45);
      border-radius:28px;
      padding:clamp(12px,3vw,20px) clamp(20px,5vw,32px);
      display:flex;flex-direction:column;align-items:center;gap:6px;
      width:clamp(240px,70vw,320px);
      box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 0 6px rgba(255,215,0,.08);
      position:relative;z-index:1;
      flex-shrink:0;
    }
    #word-emoji{font-size:clamp(54px,15vw,88px);line-height:1;animation:cardBob 2.5s ease-in-out infinite;}
    @keyframes cardBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    #word-text{
      font-size:clamp(28px,8vw,46px);color:#ffd700;
      letter-spacing:.12em;
      text-shadow:0 2px 12px rgba(0,0,0,.5);
    }
    /* Highlight last letter */
    #word-text .end-letter{
      color:#ff8f00;
      text-shadow:0 0 18px rgba(255,143,0,.8),0 2px 8px rgba(0,0,0,.4);
      font-size:1.15em;
    }

    /* Letter choice buttons */
    #choices{
      display:flex;gap:clamp(10px,3vw,18px);
      width:clamp(260px,78vw,340px);
      justify-content:center;
      flex-shrink:0;position:relative;z-index:1;
      margin-top:clamp(10px,2.5vw,18px);
    }
    .choice-btn{
      flex:1;
      min-height:90px;min-width:90px;max-width:120px;
      border-radius:22px;
      border:3px solid rgba(255,255,255,.35);
      background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
      font-size:clamp(30px,8vw,50px);color:#fff;
      cursor:pointer;touch-action:manipulation;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 20px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2);
      transition:transform .12s;
      font-family:'Fredoka One',sans-serif;
      letter-spacing:0;
    }
    .choice-btn:active{transform:scale(.91);}
    .choice-btn.correct{border-color:#ffd700;background:linear-gradient(135deg,rgba(255,215,0,.4),rgba(255,140,0,.2));animation:correctPop .55s ease-out;}
    .choice-btn.wrong  {animation:wobble .45s ease-out;border-color:rgba(255,80,80,.7);}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.15);box-shadow:0 0 40px rgba(255,215,0,.85)}100%{transform:scale(1)}}
    @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}60%{transform:translateX(12px)}80%{transform:translateX(-6px)}}

    /* Hint text */
    #hint-text{
      font-size:clamp(13px,3.3vw,17px);color:rgba(255,255,255,.7);
      text-align:center;position:relative;z-index:1;
      padding:0 16px;line-height:1.3;
      flex-shrink:0;
    }

    /* Particles */
    .sp{position:fixed;pointer-events:none;z-index:50;border-radius:50%;animation:sparkOut .75s ease-out forwards;}
    @keyframes sparkOut{0%{transform:scale(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
    .sp-em{position:fixed;pointer-events:none;z-index:51;animation:spFloat .9s ease-out forwards;}
    @keyframes spFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-90px) scale(0);opacity:0}}

    /* Overlays */
    .overlay{
      position:fixed;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      z-index:99;opacity:0;pointer-events:none;transition:opacity .35s;
      padding:24px 20px;background:rgba(10,0,40,.93);
    }
    .overlay.show{opacity:1;pointer-events:all;}
    .ov-emoji{font-size:clamp(52px,14vw,90px);}
    .ov-title{font-size:clamp(22px,6vw,40px);color:#ffd700;text-align:center;line-height:1.2;}
    .ov-sub  {font-size:clamp(15px,3.8vw,22px);color:#f8bbd0;text-align:center;max-width:320px;line-height:1.35;}
    .ov-fact {font-size:clamp(13px,3.4vw,18px);color:#b39ddb;text-align:center;max-width:340px;line-height:1.45;}
    .btn-next{
      padding:clamp(14px,4vw,20px) clamp(32px,8vw,54px);font-size:clamp(18px,5vw,26px);
      border-radius:50px;border:none;background:linear-gradient(135deg,#ffd700,#ff8c00);
      color:#5d2e00;font-family:inherit;cursor:pointer;
      min-height:64px;min-width:180px;
      box-shadow:0 4px 18px rgba(255,180,0,.5);
      touch-action:manipulation;
    }
    .cf{position:fixed;pointer-events:none;z-index:100;border-radius:3px;animation:cfFall linear forwards;}
    @keyframes cfFall{0%{top:-20px;opacity:1;transform:rotate(0)}100%{top:110vh;opacity:.2;transform:rotate(720deg)}}
  </style>
</head>
<body>

<div id="header">
  <div id="tier-badge" class="tier-easy">🌱 Easy</div>
  <div id="score-label">⭐ 0</div>
  <div id="round-label">1 / 18</div>
</div>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="prompt">What sound does this word end with? 🎵</div>

<div id="word-card">
  <div id="word-emoji">🐱</div>
  <div id="word-text">CAT</div>
</div>

<div id="hint-text">Tap the ending letter!</div>

<div id="choices">
  <button class="choice-btn" id="opt-0">T</button>
  <button class="choice-btn" id="opt-1">N</button>
  <button class="choice-btn" id="opt-2">P</button>
</div>

<!-- Celebrate overlay -->
<div class="overlay" id="cel-overlay">
  <div class="ov-emoji" id="cel-emoji">✨</div>
  <div class="ov-title" id="cel-title">Brilliant!</div>
  <div class="ov-sub"   id="cel-sub">Amazing! 👑</div>
  <div class="ov-fact"  id="cel-fact"></div>
  <button class="btn-next" id="cel-btn">Next ➡️</button>
</div>

<!-- Tier overlay -->
<div class="overlay" id="tier-overlay">
  <div class="ov-emoji" id="t-emoji">🌸</div>
  <div class="ov-title" id="t-title">Level up! 🌟</div>
  <div class="ov-sub"   id="t-sub">Ready for more? ✨</div>
  <button class="btn-next" id="t-btn">Let's go! ✨</button>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="ov-emoji">✨</div>
  <div class="ov-title">Royal Word Wizard! 👑</div>
  <div class="ov-sub" id="win-sub">You heard all the ending sounds! 🌟</div>
  <div class="ov-fact">Listening for the ending sound helps you read and spell new words — you're amazing! 📖</div>
  <button class="btn-next" onclick="startGame()">Play Again 🌸</button>
</div>

<script>
// ── Audio ──────────────────────────────────────────────────────────────────────
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function tone(f,type,d,v,del){
  v=v||.18;del=del||0;
  try{
    const c=getAudio();
    setTimeout(()=>{
      try{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(v,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.start();o.stop(c.currentTime+d);
      }catch(e){}
    },del);
  }catch(e){}
}
function playCorrect(){[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.18,.2,i*70));}
function playWrong()  {tone(260,'sawtooth',.18,.13);tone(210,'sawtooth',.14,.1,160);}
function playTierUp() {[523,659,784,880,1047,1319].forEach((f,i)=>tone(f,'triangle',.28,.2,i*90));}
function playWin()    {[523,659,784,1047,784,1047,1319,1047,1319,1568].forEach((f,i)=>tone(f,'sine',.3,.22,i*90));}

// ── Word pools ─────────────────────────────────────────────────────────────────
// Each item: word shown, emoji for the word, ending letter (answer), 3 choices
const POOLS = {
  easy:[
    {word:'CAT',  emoji:'🐱', end:'T', opts:['T','N','P'],
     fact:'CAT ends with T! The letter T makes a /t/ sound — say it with me: /t/! 🐱'},
    {word:'SUN',  emoji:'☀️', end:'N', opts:['N','T','B'],
     fact:'SUN ends with N! The letter N makes a /n/ sound — like humming! 🎵'},
    {word:'CUB',  emoji:'🐻', end:'B', opts:['B','P','T'],
     fact:'CUB ends with B! The letter B makes a /b/ sound — your lips pop open! 👄'},
    {word:'CUP',  emoji:'☕', end:'P', opts:['P','B','N'],
     fact:'CUP ends with P! The letter P makes a /p/ sound — like a tiny pop! 💨'},
    {word:'HAT',  emoji:'🎩', end:'T', opts:['T','B','P'],
     fact:'HAT ends with T! Princess wears her hat with a royal /t/ at the end! 👒'},
    {word:'HEN',  emoji:'🐔', end:'N', opts:['N','T','P'],
     fact:'HEN ends with N! The letter N hums like a bee: /n/ /n/ /n/! 🐝'},
  ],
  medium:[
    {word:'BED',  emoji:'🛏️', end:'D', opts:['D','B','G'],
     fact:'BED ends with D! The letter D sounds like T but softer — /d/! 🛏️'},
    {word:'DUCK', emoji:'🦆', end:'K', opts:['K','G','D'],
     fact:'DUCK ends with K! The letter K makes a sharp /k/ sound at the back of your mouth! 🦆'},
    {word:'DRUM', emoji:'🥁', end:'M', opts:['M','N','B'],
     fact:'DRUM ends with M! The letter M hums with your lips together: /mmm/! 🥁'},
    {word:'BUS',  emoji:'🚌', end:'S', opts:['S','Z','T'],
     fact:'BUS ends with S! The letter S hisses like a snake: /sss/! 🐍'},
    {word:'BALL', emoji:'⚽', end:'L', opts:['L','R','N'],
     fact:'BALL ends with L! The letter L makes a gentle /l/ sound with your tongue! ⚽'},
    {word:'BUG',  emoji:'🐛', end:'G', opts:['G','D','K'],
     fact:'BUG ends with G! The letter G sounds like K but deeper in your throat: /g/! 🐛'},
  ],
  hard:[
    {word:'FOX',   emoji:'🦊', end:'X', opts:['X','S','K'],
     fact:'FOX ends with X! The letter X makes a /ks/ sound — fox, box, six! 🦊'},
    {word:'BIRD',  emoji:'🐦', end:'D', opts:['D','T','B'],
     fact:'BIRD ends with D! Listen carefully — is it /t/ or /d/? Birds say /d/! 🐦'},
    {word:'FROG',  emoji:'🐸', end:'G', opts:['G','D','K'],
     fact:'FROG ends with G! Frogs ribbit with a deep /g/ at the end! 🐸'},
    {word:'LAMP',  emoji:'💡', end:'P', opts:['P','B','M'],
     fact:'LAMP ends with P! Your lips pop at the end: lam-/p/! 💡'},
    {word:'SWIM',  emoji:'🏊', end:'M', opts:['M','N','B'],
     fact:'SWIM ends with M! Your lips hum closed at the end: swi-/mmm/! 🏊'},
    {word:'SHELF', emoji:'📚', end:'F', opts:['F','V','P'],
     fact:'SHELF ends with F! The letter F is a soft hiss through your teeth: /fff/! 📚'},
  ],
};

const TIERS = [
  {label:'🌱 Easy',  cls:'tier-easy',   pool:'easy',
   toastEmoji:'🌸', toastTitle:'More sounds! 🌟',
   toastSub:'You can hear T, N, B and P — amazing! Now for D, K, M, S, L and G! 🎵'},
  {label:'🌸 Medium',cls:'tier-medium', pool:'medium',
   toastEmoji:'⭐',  toastTitle:'Word Wizard level! ✨',
   toastSub:'Incredible! Now the trickiest endings — X, D, G, P, M and F! 📖'},
  {label:'⭐ Hard',  cls:'tier-hard',   pool:'hard'},
];

const PROMPTS = [
  'What sound does this word end with? 🎵',
  'Tap the ending letter! ✨',
  'Which letter is at the END? 👑',
  'What does this word end with? 🌟',
  'Find the ending sound! 🎶',
  'The LAST sound — tap it! 💫',
  'Which letter do you hear at the end? 🔤',
];

const TOTAL = 18;
let round=0,score=0,locked=false,gameRounds=[],promptIdx=0,currentRound=null;

// ── Build rounds ──────────────────────────────────────────────────────────────
function buildRounds(){
  const rounds=[];
  TIERS.forEach((tier,ti)=>{
    POOLS[tier.pool].forEach(item=>{
      rounds.push({item,tierIdx:ti});
    });
  });
  return rounds;
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame(){
  ['win-overlay','tier-overlay','cel-overlay'].forEach(id=>document.getElementById(id).classList.remove('show'));
  round=0;score=0;locked=false;
  promptIdx=Math.floor(Math.random()*PROMPTS.length);
  gameRounds=buildRounds();
  makeBgGems();
  nextRound();
}

function nextRound(){
  document.getElementById('cel-overlay').classList.remove('show');
  if(round>=TOTAL){endGame();return;}
  const prevTierIdx=round===0?-1:gameRounds[round-1].tierIdx;
  round++;
  const rd=gameRounds[round-1];
  if(rd.tierIdx>prevTierIdx&&prevTierIdx>=0){
    showTierOverlay(TIERS[rd.tierIdx],()=>renderRound(rd));
  } else {
    renderRound(rd);
  }
}

function renderRound(rd){
  locked=false;
  currentRound=rd;
  promptIdx=(promptIdx+1)%PROMPTS.length;
  document.getElementById('prompt').textContent=PROMPTS[promptIdx];

  const tier=TIERS[rd.tierIdx];
  const badge=document.getElementById('tier-badge');
  badge.textContent=tier.label;badge.className='tier-badge '+tier.cls;
  document.getElementById('score-label').textContent='⭐ '+score;
  document.getElementById('round-label').textContent=round+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=((round-1)/TOTAL*100)+'%';

  const item=rd.item;
  document.getElementById('word-emoji').textContent=item.emoji;

  // Render word with last letter highlighted
  const wordEl=document.getElementById('word-text');
  const body=item.word.slice(0,-1);
  const last=item.word.slice(-1);
  wordEl.innerHTML=body+'<span class="end-letter">'+last+'</span>';

  // Render choice buttons — shuffle options
  const opts=[...item.opts].sort(()=>Math.random()-.5);
  for(let i=0;i<3;i++){
    const btn=document.getElementById('opt-'+i);
    btn.textContent=opts[i];
    btn.dataset.letter=opts[i];
    btn.className='choice-btn';
    btn.onclick=()=>handleChoice(opts[i],btn);
  }

  // Hint: blank word with blank at end
  document.getElementById('hint-text').textContent=item.word.slice(0,-1)+'___ sounds like /'+item.end.toLowerCase()+'/';

  setTimeout(()=>{try{getAudio().resume();}catch(e){}tone(880,'sine',.1,.07);},150);
}

function handleChoice(letter,btn){
  if(locked)return;
  try{getAudio().resume();}catch(e){}
  const rd=currentRound;
  if(letter===rd.item.end){
    locked=true;score++;
    btn.classList.add('correct');
    playCorrect();
    const rect=btn.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    burst(cx,cy);
    document.getElementById('score-label').textContent='⭐ '+score;
    setTimeout(showCelebrate,800);
  } else {
    btn.classList.add('wrong');
    playWrong();
    setTimeout(()=>btn.classList.remove('wrong'),460);
  }
}

const CEL_MSGS=['Brilliant! 🌟','You heard it! 👑','Amazing! ✨','Superstar! ⭐','Perfect! 💎','Wonderful! 🌸','Exactly right! 🎉','Great listening! 🎵','You got it! 🏆'];

function showCelebrate(){
  const item=currentRound.item;
  const endLetter=item.end;
  document.getElementById('cel-emoji').textContent=item.emoji;
  document.getElementById('cel-title').textContent=item.word+' ends with '+endLetter+'! 🎵';
  document.getElementById('cel-sub').textContent=CEL_MSGS[Math.floor(Math.random()*CEL_MSGS.length)];
  document.getElementById('cel-fact').textContent=item.fact;
  document.getElementById('cel-btn').onclick=nextRound;
  document.getElementById('cel-overlay').classList.add('show');
}

function showTierOverlay(tier,cb){
  document.getElementById('t-emoji').textContent=tier.toastEmoji;
  document.getElementById('t-title').textContent=tier.toastTitle;
  document.getElementById('t-sub').textContent=tier.toastSub||'Get ready! 🌟';
  document.getElementById('t-btn').onclick=()=>{
    document.getElementById('tier-overlay').classList.remove('show');
    cb();
  };
  document.getElementById('tier-overlay').classList.add('show');
  playTierUp();confetti(42);
}

function endGame(){
  playWin();confetti(60);setTimeout(()=>confetti(40),700);
  document.getElementById('win-sub').textContent='You scored ⭐ '+score+' out of '+TOTAL+'! ✨';
  document.getElementById('win-overlay').classList.add('show');
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('score-label').textContent='⭐ '+score;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function burst(cx,cy){
  const cols=['#ffd700','#e040fb','#fff','#f48fb1','#80deea','#a5d6a7','#ce93d8','#ffe082'];
  const ems=['✨','💫','⭐','🌟','💎','👑','🌸','💖','🔤','📖','🎵','🎶'];
  for(let i=0;i<24;i++){
    const el=document.createElement('div');el.className='sp';
    const a=Math.random()*Math.PI*2,dist=35+Math.random()*85,sz=7+Math.random()*10;
    el.style.cssText=`left:${cx+Math.cos(a)*dist-sz/2}px;top:${cy+Math.sin(a)*dist-sz/2}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),800);
  }
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='sp-em';
    el.textContent=ems[i%ems.length];
    el.style.cssText=`left:${cx+(Math.random()-.5)*130}px;top:${cy+(Math.random()-.5)*110}px;font-size:${16+Math.random()*12}px;`;
    el.style.animationDelay=(Math.random()*.2)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}

function confetti(count){
  const cols=['#e040fb','#ffd700','#fff','#f48fb1','#ce93d8','#b2ebf2','#a5d6a7','#ff8a65'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='cf';
    const sz=6+Math.random()*10;
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};animation-duration:${1.4+Math.random()*2}s;animation-delay:${Math.random()*.5}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),3500);
  }
}

function makeBgGems(){
  document.querySelectorAll('.bg-gem').forEach(e=>e.remove());
  const icons=['✨','🔤','📖','🌟','👑','🌸','💫','💎','🎵','🎶','🐱','☀️','🐻','☕','🐔','🦆'];
  for(let i=0;i<16;i++){
    const el=document.createElement('div');el.className='bg-gem';
    el.textContent=icons[i%icons.length];
    el.style.left=(4+Math.random()*92)+'vw';
    el.style.animationDuration=(10+Math.random()*14)+'s';
    el.style.animationDelay=-(Math.random()*16)+'s';
    document.body.appendChild(el);
  }
}

startGame();
</script>
</body>
</html>
